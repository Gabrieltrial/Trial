<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afinador</title>
<style>
  :root {
    --background: #171b26;
    --panel: #232838;
    --accent: #aee9df;
    --accent-strong: #549d96;
    --muted: #8993ad;
    --ink: #eef1fa;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #232a3d, var(--background) 65%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  main {
    width: min(92vw, 420px);
    text-align: center;
  }

  h1 {
    margin: 0 0 18px;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: .01em;
  }

  .tuner-panel {
    border-radius: 26px;
    padding: 22px 22px 26px;
    background: linear-gradient(160deg, #3c3c3c, #1a1a1a);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }

  .tuner-face {
    background: radial-gradient(circle at 50% 25%, #f6efdc, #ddcfa8 85%);
    border-radius: 18px;
    padding: 18px 12px 6px;
    box-shadow: inset 0 3px 14px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.35);
  }

  .tuner-svg { display: block; width: 100%; height: auto; }
  .tuner-arc { fill: none; stroke: #2b2b2b; stroke-width: 3; }
  .tuner-tick { stroke: #2b2b2b; stroke-width: 2.4; }
  .tuner-tick.center { stroke: #2f7d4f; stroke-width: 3.6; }
  .tuner-label { fill: #4a4a4a; font-size: 15px; font-weight: 700; font-family: inherit; }

  .tuner-needle {
    stroke: #c1272d;
    stroke-width: 3.6;
    stroke-linecap: round;
    transform-origin: 160px 165px;
    transition: transform .1s ease-out;
  }

  .tuner-pivot { fill: #2b2b2b; }

  .tuner-note {
    margin-top: 14px;
    font-size: 3.1rem;
    font-weight: 800;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--accent);
    letter-spacing: .02em;
    line-height: 1;
  }

  .tuner-freq {
    font-size: 1rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  .tuner-cents {
    font-size: .85rem;
    color: var(--muted);
    margin-top: 6px;
    min-height: 1.2em;
  }

  .mic-btn {
    width: 100%;
    min-height: 54px;
    margin-top: 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.2);
    background: #30394f;
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 650;
    cursor: pointer;
  }

  .mic-btn:hover { background: #3d4965; }
  .mic-btn:active { transform: scale(.98); }

  .mic-btn.selected {
    background: #2f7d4f;
    border-color: var(--accent);
    color: #eafff2;
  }

  .tuner-status {
    margin-top: 12px;
    font-size: .8rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .hint {
    margin-top: 12px;
    font-size: .68rem;
    color: var(--muted);
    opacity: .75;
  }
</style>
</head>
<body>
  <main>
    <h1>Afinador</h1>
    <div class="tuner-panel">
      <div class="tuner-face">
        <svg class="tuner-svg" viewBox="0 0 320 190" aria-hidden="true">
          <path class="tuner-arc" d="M 68.1 73.1 A 130 130 0 0 1 251.9 73.1" />
          <line class="tuner-tick" x1="68.1" y1="73.1" x2="79.4" y2="84.4" />
          <line class="tuner-tick" x1="110.3" y1="44.9" x2="116.4" y2="59.7" />
          <line class="tuner-tick center" x1="160" y1="35" x2="160" y2="51" />
          <line class="tuner-tick" x1="209.7" y1="44.9" x2="203.6" y2="59.7" />
          <line class="tuner-tick" x1="251.9" y1="73.1" x2="240.6" y2="84.4" />
          <text class="tuner-label" x="46" y="100" text-anchor="middle">♭</text>
          <text class="tuner-label" x="274" y="100" text-anchor="middle">♯</text>
          <line id="needle" class="tuner-needle" x1="160" y1="165" x2="160" y2="48" />
          <circle class="tuner-pivot" cx="160" cy="165" r="7" />
        </svg>
      </div>
      <div class="tuner-note" id="note">—</div>
      <div class="tuner-freq" id="freq">-- Hz</div>
      <div class="tuner-cents" id="cents"></div>
      <button id="toggle" class="mic-btn" type="button" aria-pressed="false">🎤 Tap to tune</button>
      <div class="tuner-status" id="status">Filters out quiet background noise automatically</div>
    </div>
    <p class="hint">If nothing happens when you tap the mic, try opening this page in its own browser tab (mic access can be blocked inside embedded previews).</p>
  </main>

  <script>
    (() => {
      "use strict";

      const noteDisplay = document.querySelector("#note");
      const freqDisplay = document.querySelector("#freq");
      const centsDisplay = document.querySelector("#cents");
      const statusDisplay = document.querySelector("#status");
      const toggleButton = document.querySelector("#toggle");
      const needle = document.querySelector("#needle");

      const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      let audioContext = null;
      let analyser = null;
      let micStream = null;
      let running = false;
      let rafId = null;

      // Adaptive noise-floor gate: background sound (which could itself be
      // musical notes, e.g. other instruments or a recording playing nearby)
      // is told apart from "the note you're playing" purely by loudness —
      // only a signal clearly louder than the recent ambient level is treated
      // as the note to report. The floor slowly tracks quiet stretches so it
      // adapts to whatever room/background level is currently present.
      let noiseFloor = 0.01;
      const ABSOLUTE_SILENCE = 0.0025;
      const SIGNAL_ABOVE_FLOOR_RATIO = 2.3;
      const FLOOR_ADAPT_RATE = 0.08;

      function updateNoiseFloor(rms) {
        const target = Math.max(rms, ABSOLUTE_SILENCE);
        noiseFloor += (target - noiseFloor) * FLOOR_ADAPT_RATE;
      }

      // Classic autocorrelation pitch detector (ACF2+): trims near-silent
      // edges, autocorrelates the remaining buffer, finds the first strong
      // peak after the initial downslope, then refines it with a parabolic
      // fit. Returns -1 when the signal is too quiet, too close to the
      // ambient noise floor, or has no clear periodic pitch.
      function autoCorrelate(buffer, sampleRate) {
        const size = buffer.length;
        let rms = 0;
        for (let i = 0; i < size; i += 1) rms += buffer[i] * buffer[i];
        rms = Math.sqrt(rms / size);

        if (rms < ABSOLUTE_SILENCE || rms < noiseFloor * SIGNAL_ABOVE_FLOOR_RATIO) {
          updateNoiseFloor(rms);
          return { frequency: -1, rms, loud: false };
        }

        const threshold = 0.2;
        let start = 0;
        let end = size - 1;
        for (let i = 0; i < size / 2; i += 1) {
          if (Math.abs(buffer[i]) < threshold) { start = i; break; }
        }
        for (let i = 1; i < size / 2; i += 1) {
          if (Math.abs(buffer[size - i]) < threshold) { end = size - i; break; }
        }
        const trimmed = buffer.slice(start, end);
        const n = trimmed.length;
        if (n < 8) return { frequency: -1, rms, loud: true };

        const correlation = new Array(n).fill(0);
        for (let lag = 0; lag < n; lag += 1) {
          for (let i = 0; i < n - lag; i += 1) {
            correlation[lag] += trimmed[i] * trimmed[i + lag];
          }
        }

        let d = 0;
        while (d < n - 1 && correlation[d] > correlation[d + 1]) d += 1;

        let bestLag = -1;
        let bestValue = -Infinity;
        for (let i = d; i < n; i += 1) {
          if (correlation[i] > bestValue) { bestValue = correlation[i]; bestLag = i; }
        }
        if (bestLag <= 0) return { frequency: -1, rms, loud: true };

        const prev = correlation[bestLag - 1] ?? correlation[bestLag];
        const curr = correlation[bestLag];
        const next = correlation[bestLag + 1] ?? correlation[bestLag];
        const a = (prev + next - 2 * curr) / 2;
        const b = (next - prev) / 2;
        const refinedLag = a ? bestLag - b / (2 * a) : bestLag;

        const frequency = sampleRate / refinedLag;
        if (!Number.isFinite(frequency) || frequency < 50 || frequency > 1500) {
          return { frequency: -1, rms, loud: true };
        }
        return { frequency, rms, loud: true };
      }

      function frequencyToNoteData(frequency) {
        const midiFloat = 69 + 12 * Math.log2(frequency / 440);
        const midi = Math.round(midiFloat);
        const cents = Math.round((midiFloat - midi) * 100);
        const pitchClassIndex = ((midi % 12) + 12) % 12;
        const octave = Math.floor(midi / 12) - 1;
        return { name: NOTE_NAMES[pitchClassIndex], octave, cents, frequency };
      }

      function updateNeedle(cents) {
        const clamped = Math.max(-50, Math.min(50, cents));
        const angle = (clamped / 50) * 45;
        needle.style.transform = `rotate(${angle}deg)`;
      }

      function resetDisplay() {
        updateNeedle(0);
        noteDisplay.textContent = "—";
        freqDisplay.textContent = "-- Hz";
        centsDisplay.textContent = "";
      }

      function showNote(frequency) {
        const note = frequencyToNoteData(frequency);
        updateNeedle(note.cents);
        noteDisplay.textContent = `${note.name}${note.octave}`;
        freqDisplay.textContent = `${frequency.toFixed(1)} Hz`;
        if (Math.abs(note.cents) <= 5) {
          centsDisplay.textContent = "In tune";
        } else {
          centsDisplay.textContent = note.cents > 0 ? `+${note.cents} cents (sharp)` : `${note.cents} cents (flat)`;
        }
      }

      function loop() {
        if (!running || !analyser) return;
        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);
        const result = autoCorrelate(buffer, audioContext.sampleRate);
        if (result.frequency !== -1) {
          showNote(result.frequency);
          statusDisplay.textContent = "Note detected";
        } else if (!result.loud) {
          statusDisplay.textContent = "Listening (below background level — play louder to be heard)";
        } else {
          statusDisplay.textContent = "No clear pitch — play a single note";
        }
        rafId = window.requestAnimationFrame(loop);
      }

      async function start() {
        if (window.isSecureContext === false) {
          statusDisplay.textContent = "Mic needs a secure page (https) — try opening this page in its own browser tab";
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusDisplay.textContent = "Microphone not available in this browser/frame";
          return;
        }
        toggleButton.textContent = "🎤 Requesting access…";
        statusDisplay.textContent = "Requesting microphone access…";
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
        } catch (error) {
          const name = error && error.name;
          if (name === "NotAllowedError" || name === "SecurityError") {
            statusDisplay.textContent = "Microphone blocked — check the site/browser permission, or open this page in its own tab";
          } else if (name === "NotFoundError") {
            statusDisplay.textContent = "No microphone found on this device";
          } else {
            statusDisplay.textContent = `Couldn't access the microphone (${name || "unknown error"})`;
          }
          toggleButton.textContent = "🎤 Tap to tune";
          return;
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        noiseFloor = 0.01;
        running = true;
        toggleButton.textContent = "🎤 Listening — tap to stop";
        toggleButton.classList.add("selected");
        toggleButton.setAttribute("aria-pressed", "true");
        statusDisplay.textContent = "Listening…";
        loop();
      }

      function stop() {
        running = false;
        if (rafId) window.cancelAnimationFrame(rafId);
        rafId = null;
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
          micStream = null;
        }
        analyser = null;
        if (audioContext) {
          audioContext.close && audioContext.close();
          audioContext = null;
        }
        toggleButton.textContent = "🎤 Tap to tune";
        toggleButton.classList.remove("selected");
        toggleButton.setAttribute("aria-pressed", "false");
        statusDisplay.textContent = "Filters out quiet background noise automatically";
        resetDisplay();
      }

      function toggle() {
        if (running) stop(); else start();
      }

      toggleButton.addEventListener("click", toggle);
      window.addEventListener("beforeunload", () => { if (running) stop(); });

      resetDisplay();
    })();
  </script>
</body>
</html>
