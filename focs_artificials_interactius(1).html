<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Focs artificials interactius</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
  #ui{position:fixed;top:14px;right:14px;z-index:5;display:flex;gap:8px}
  button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;background:rgba(255,255,255,.14);color:white;backdrop-filter:blur(8px);box-shadow:0 2px 15px #0008}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff9;text-align:center;font-size:14px;pointer-events:none}
  #flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="sound">🔊 So</button><button id="finish">Finalitzar</button></div>
<div id="hint">Toca o fes clic a la pantalla per disparar un foc artificial</div>
<div id="flash"></div>

<script>
(() => {
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d',{alpha:false});
  let W,H,dpr,rockets=[],particles=[],stars=[],running=true,audio=null;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.floor(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H*.72,r:Math.random()*1.2+.2,a:Math.random()*.6+.2}));
  }
  addEventListener('resize',resize); resize();

  const colors=['#ff3b30','#ffd60a','#64d2ff','#bf5af2','#30d158','#ff9f0a','#ffffff','#ff375f'];
  function burst(x,y, power=1){
    const col=colors[(Math.random()*colors.length)|0];
    const n=120+((Math.random()*90)|0);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2;
      const speed=(2.2+Math.pow(Math.random(),.45)*5.8)*power;
      particles.push({
        x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
        life:1,decay:.008+Math.random()*.012,
        size:1+Math.random()*2.2,color:Math.random()<.12?'#fff':col,
        drag:.982+Math.random()*.006
      });
    }
    // secondary glitter
    for(let i=0;i<28;i++){
      const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.006+Math.random()*.008,size:.8+Math.random()*1.5,color:'#fff',drag:.985});
    }
    soundBoom();
  }

  function launch(tx,ty){
    const x=W*(.15+Math.random()*.7), y=H+10;
    const dx=tx-x, dy=ty-y, dist=Math.hypot(dx,dy);
    const speed=9;
    rockets.push({x,y,vx:dx/dist*speed,vy:dy/dist*speed,targetY:ty,trail:[]});
    soundLaunch();
  }

  function update(){
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i];
      r.trail.push({x:r.x,y:r.y});
      if(r.trail.length>8)r.trail.shift();
      r.x+=r.vx; r.y+=r.vy;
      r.vy+=.035;
      if(r.y<=r.targetY || r.vy>0){
        burst(r.x,r.y,Math.min(1.35, .8+Math.random()*.5));
        rockets.splice(i,1);
      }
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*.985+.045;
      p.life-=p.decay;
      if(p.life<=0)particles.splice(i,1);
    }
  }

  function draw(){
    ctx.fillStyle='rgba(2,3,11,.18)';
    ctx.fillRect(0,0,W,H);

    for(const s of stars){
      ctx.globalAlpha=s.a*(.7+.3*Math.sin(performance.now()/900+s.x));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalCompositeOperation='lighter';

    for(const r of rockets){
      for(let i=0;i<r.trail.length;i++){
        const t=r.trail[i], a=(i/r.trail.length)*.55;
        ctx.globalAlpha=a;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(t.x,t.y,1.2,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,Math.PI*2);ctx.fill();
    }

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.65+.35*p.life),0,Math.PI*2);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }

  function loop(){
    if(!running)return;
    update();draw();requestAnimationFrame(loop);
  }

  // Web Audio: short launch hiss + low boom. Audio only starts after user interaction.
  function initAudio(){
    if(audio)return;
    try{audio=new (AudioContext||webkitAudioContext)();}catch(e){}
  }
  function tone(freq,dur,type,gain,delay=0){
    if(!audio)return;
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+delay);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.35),audio.currentTime+delay+dur);
    g.gain.setValueAtTime(.0001,audio.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+delay+.008);
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+dur);
    o.connect(g).connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+dur+.02);
  }
  function soundLaunch(){initAudio();if(audio&&audio.state==='suspended')audio.resume();tone(260,.25,'sawtooth',.035);}
  function soundBoom(){initAudio();if(audio&&audio.state==='suspended')audio.resume();tone(75,.45,'sine',.09);tone(145,.18,'triangle',.045,.015);}
  let soundOn=true;
  document.getElementById('sound').onclick=e=>{
    soundOn=!soundOn;e.target.textContent=soundOn?'🔊 So':'🔇 Mut';
    if(!soundOn&&audio)audio.suspend(); if(soundOn&&audio)audio.resume();
  };

  function pointer(e){
    if(e.target.tagName==='BUTTON')return;
    initAudio(); if(audio&&audio.state==='suspended')audio.resume();
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX??e.touches?.[0].clientX)-rect.left;
    const y=(e.clientY??e.touches?.[0].clientY)-rect.top;
    launch(x,Math.max(70,y));
  }
  canvas.addEventListener('pointerdown',pointer);

  document.getElementById('finish').onclick=()=>{
    initAudio(); if(audio&&audio.state==='suspended')audio.resume();
    // Final sequence: several large synchronized bursts.
    const pts=[
      [W*.20,H*.34],[W*.38,H*.23],[W*.52,H*.32],[W*.68,H*.22],[W*.82,H*.36],
      [W*.30,H*.48],[W*.60,H*.46],[W*.76,H*.50]
    ];
    pts.forEach((p,i)=>setTimeout(()=>burst(p[0],p[1],1.25),i*170));
    setTimeout(()=>{running=false; flash();},1500);
  };
  function flash(){
    const f=document.getElementById('flash');f.style.transition='opacity .08s';f.style.opacity='.55';
    setTimeout(()=>{f.style.transition='opacity .5s';f.style.opacity='0'},90);
  }

  // Initial demonstration, subtle and automatic.
  setTimeout(()=>launch(W*.5,H*.32),500);
  loop();
})();
</script>
</body>
</html>
