<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analitzador espectral amb feedback</title>
<style>
  :root {
    --bg:#101317; --panel:#181d23; --grid:#2a313a; --text:#d8dee6; --muted:#8a95a3;
    --line:#4fc3f7; --up:#43c06a; --down:#e5534b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .panel { background:var(--panel); border-radius:10px; padding:12px; }
  canvas { width:100%; display:block; border-radius:6px; background:#0c0f12; }
  #spec { height:340px; }
  #prof { height:200px; }
  #diff { height:150px; }
  #harm { height:150px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font:inherit; color:var(--text); background:#242b33; border:1px solid #333c47;
           border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { background:#2d363f; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .big { font-size:22px; padding:10px 28px; }
  #up { border-color:var(--up); } #down { border-color:var(--down); }
  #up:hover:not(:disabled) { background:rgba(67,192,106,.2); }
  #down:hover:not(:disabled) { background:rgba(229,83,75,.2); }
  .muted { color:var(--muted); }
  #status { min-height:1.4em; }
  .spacer { flex:1; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 12px; }
  label { color:var(--muted); }
  select { background:#242b33; color:var(--text); border:1px solid #333c47; border-radius:6px; padding:4px; }
</style>
</head>
<body>
<main>
  <h1><svg style="display:inline-block;width:1.3em;height:1.12em;vertical-align:-0.18em;margin-right:0.35em;flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="60 110 900 780" class="tm-logo" aria-hidden="true"><defs><filter id="g21" x="-5%" y="-5%" width="110%" height="110%"> <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="21" result="n"/> <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/> </filter></defs> <g transform="translate(512 512) scale(0.9) translate(-566 -560)" filter="url(#g21)"><g fill="currentColor"><g opacity="1"><path d="M299.9 310.3 L310.8 309.2 L321.6 307.7 L332.4 306.0 L342.9 303.6 L353.7 302.0 L363.9 298.1 L374.2 294.8 L384.7 292.3 L395.4 290.1 L406.0 288.0 L416.5 285.3 L427.2 283.3 L437.8 281.3 L448.3 278.5 L458.5 274.8 L469.0 272.1 L479.6 269.8 L490.3 267.9 L500.4 263.9 L510.5 259.6 L520.9 256.6 L531.1 252.7 L541.4 249.3 L536.2 230.1 L524.8 229.4 L514.3 232.0 L503.8 234.5 L493.6 238.2 L482.9 240.2 L472.5 243.4 L461.8 245.2 L451.2 247.5 L440.7 250.2 L430.0 252.1 L419.8 255.8 L409.1 257.8 L398.7 260.9 L387.9 262.3 L377.7 265.8 L367.0 267.9 L357.1 272.6 L346.4 274.9 L336.0 277.6 L325.2 279.1 L314.4 280.8 L304.2 284.7 L294.5 290.0 Z"/><path d="M511.4 206.4 L502.0 215.0 L494.6 224.4 L489.0 234.6 L485.2 245.6 L481.5 256.5 L477.8 267.5 L474.1 278.4 L470.7 289.5 L468.1 300.9 L465.4 312.3 L461.8 323.3 L457.0 333.8 L451.4 344.0 L445.3 353.9 L438.6 363.7 L432.6 373.7 L428.0 384.3 L424.5 395.3 L421.2 406.5 L417.8 417.5 L413.7 428.3 L408.1 438.5 L401.7 448.4 L396.4 458.6 L392.6 469.6 L389.4 480.7 L386.5 492.0 L383.7 503.3 L380.3 514.4 L376.8 525.5 L374.9 537.2 L373.6 549.1 L372.2 561.0 L417.3 579.4 L426.3 570.7 L435.9 562.1 L444.8 553.3 L452.2 543.8 L458.1 533.8 L461.8 522.8 L464.0 511.3 L464.8 499.1 L467.5 487.7 L471.1 476.7 L476.2 466.3 L480.4 455.6 L484.4 444.8 L488.8 434.1 L493.2 423.4 L498.0 412.9 L501.0 401.7 L504.5 390.6 L507.9 379.6 L513.7 369.5 L520.0 359.6 L526.1 349.6 L531.6 339.4 L536.1 328.7 L541.3 318.4 L5 2 L280.2 641.7 L278.7 652.2 L278.6 662.6 L278.1 673.1 L279.2 683.5 L280.8 694.0 L280.8 704.5 L281.8 714.9 L282.5 725.4 L283.2 735.9 L284.6 746.3 L286.9 756.8 L287.2 767.2 L288.3 777.7 L289.2 788.2 L290.0 798.6 L292.3 809.1 L294.5 819.6 L296.2 830.0 Z"/></g><path d="M324.4 793.3 L327.3 799.3 L329.5 805.6 L331.0 812.2 L331.7 819.0 L331.8 826.0 L331.0 833.1 L329.6 840.2 L327.5 847.4 L324.8 854.5 L321.5 861.5 L317.7 868.4 L313.5 875.2 L308.8 881.8 L303.7 888.3 L298.2 894.7 L292.3 900.8 L286.0 906.7 L279.3 912.3 L272.2 917.6 L264.7 922.5 L256.9 927.0 L248.9 931.1 L240.6 934.7 L232.1 937.8 L223.5 940.4 L214.9 942.6 L206.2 944.2 L197.6 945.4 L189.1 946.2 L180.6 946.6 L172.2 946.6 L164.0 946.1 L155.9 945.2 L148.0 943.9 L140.3 942.1 L133.0 939.7 L126.0 936.9 L119.5 933.5 L113.5 929.6 L108.0 925.3 L103.1 920.5 L98.8 915.3 L95.1 909.8 L92.0 904.0 L89.4 897.9 L87.4 891.7 L85.9 885.3 L84.8 878.8 L84.3 872.1 L84.3 865.4 L84.8 858.5 L85.8 851.6 L87.5 844.7 L89.7 837.7 L92.6 830.8 L96.1 824.0 L100.2 817.3 L104.9 810.8 L110.1 804.5 L115.8 798.4 L121.9 792.6 L128.4 787.1 L135.1 781.9 L142.1 776.9 L149.4 772.3 L156.9 767.9 L164.6 763.8 L172.5 760.0 L180.6 756.7 L188.9 753.7 L197.3 751.2 L205.8 749.2 L214.3 747.7 L222.7 746.8 L231.1 746.4 L239.4 746.6 L247.4 747.3 L255.2 748.5 L262.8 750.2 L270.1 752.3 L277.1 754.7 L283.8 757.6 L290.2 760.8 L296.4 764.3 L302.2 768.2 L307.6 772.5 L312.6 777.1 L317.1 782.1 L321.0 787.5 Z"/></g></g></svg>Analitzador espectral (20 Hz – 20 kHz)</h1>

  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <button id="start">Activa el micròfon</button>
      <label>Suavitzat
        <select id="smooth">
          <option value="0.5">baix</option>
          <option value="0.8" selected>mitjà</option>
          <option value="0.92">alt</option>
        </select>
      </label>
      <label>Vista
        <select id="view">
          <option value="both" selected>espectre + harmònics</option>
          <option value="line">només espectre</option>
          <option value="bars">només barres d'harmònics</option>
        </select>
      </label>
      <label><input type="checkbox" id="peak"> mostra pics màxims</label>
      <span class="spacer"></span>
      <span class="muted" id="info"></span>
    </div>
    <canvas id="spec"></canvas>
    <div class="row" style="margin:12px 0 6px">
      <strong>Harmònics</strong>
      <span class="muted" id="f0info">Toca o canta una nota llarga</span>
    </div>
    <canvas id="harm"></canvas>
  </div>

  <div class="panel">
    <div class="row">
      <button id="up" class="big" disabled title="Tecla ↑">👍</button>
      <button id="down" class="big" disabled title="Tecla ↓">👎</button>
      <span class="muted">(també amb les tecles ↑ / ↓)</span>
      <span class="spacer"></span>
      <span id="counts" class="muted"></span>
    </div>
    <div id="status" class="muted" style="margin-top:8px"></div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:8px">
      <strong>Perfil après (bandes de 1/3 d'octava, nivell relatiu)</strong>
      <span class="legend muted"><span style="background:var(--up)"></span>m'agrada
        <span style="background:var(--down)"></span>no m'agrada</span>
    </div>
    <canvas id="prof"></canvas>
    <div style="margin:12px 0 8px"><strong>Diferència: m'agrada − no m'agrada (dB)</strong>
      <span class="muted"> · verd = més energia en els sons que t'agraden</span></div>
    <canvas id="diff"></canvas>
  </div>

  <div class="panel row">
    <button id="exportJson">Exporta JSON</button>
    <button id="exportCsv">Exporta CSV</button>
    <button id="importBtn">Importa JSON</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <span class="spacer"></span>
    <button id="clear">Esborra dades</button>
  </div>
</main>

<script>
(() => {
  const FMIN = 20, FMAX = 20000, DB_MIN = -110, DB_MAX = 0;
  const KEY = 'spectral-feedback-v1';

  // 31 bandes de 1/3 d'octava (~20 Hz ... ~20 kHz)
  const centers = [];
  for (let k = -17; k <= 13; k++) centers.push(1000 * Math.pow(2, k / 3));
  const edges = centers.map(c => [c / Math.pow(2, 1/6), c * Math.pow(2, 1/6)]);
  const NB = centers.length;

  let ctx, analyser, data, peaks, running = false, samples = [];
  let pitchAn = null, tbuf = null, yinBuf = null, lastPitch = 0;
  let f0 = null;            // { freq, note, cents, harm: [{k, f, db}] } o null
  let f0Smooth = 0, f0Miss = 0;
  const NOTE = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const NOTE_CA = ['Do', 'Do♯', 'Re', 'Re♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Si'];
  const MAX_H = 16;

  const $ = id => document.getElementById(id);
  const specC = $('spec'), profC = $('prof'), diffC = $('diff'), harmC = $('harm');

  // ---------- persistència ----------
  function load() {
    try { samples = JSON.parse(localStorage.getItem(KEY)) || []; } catch { samples = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(samples)); } catch {}
  }

  // ---------- utilitats de dibuix ----------
  function fit(c) {
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { g, w, h };
  }
  const M = { l: 44, r: 10, t: 8, b: 22 };
  const xOf = (f, w) => M.l + (Math.log(f / FMIN) / Math.log(FMAX / FMIN)) * (w - M.l - M.r);
  const yOf = (v, h, lo, hi) => M.t + (1 - (v - lo) / (hi - lo)) * (h - M.t - M.b);

  function axes(g, w, h, lo, hi, step, unit) {
    g.clearRect(0, 0, w, h);
    g.font = '11px system-ui'; g.fillStyle = '#8a95a3'; g.strokeStyle = '#2a313a'; g.lineWidth = 1;
    g.textAlign = 'center';
    const fs = [20,50,100,200,500,1000,2000,5000,10000,20000];
    for (const f of fs) {
      const x = Math.round(xOf(f, w)) + .5;
      g.beginPath(); g.moveTo(x, M.t); g.lineTo(x, h - M.b); g.stroke();
      g.fillText(f >= 1000 ? (f / 1000) + 'k' : f, x, h - 7);
    }
    for (const f of [30,40,60,70,80,90,300,400,600,700,800,900,3000,4000,6000,7000,8000,9000,15000]) {
      const x = Math.round(xOf(f, w)) + .5;
      g.save(); g.globalAlpha = .35;
      g.beginPath(); g.moveTo(x, M.t); g.lineTo(x, h - M.b); g.stroke(); g.restore();
    }
    g.textAlign = 'right';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const y = Math.round(yOf(v, h, lo, hi)) + .5;
      g.beginPath(); g.moveTo(M.l, y); g.lineTo(w - M.r, y); g.stroke();
      g.fillText(v + unit, M.l - 5, y + 4);
    }
  }

  // ---------- freqüència fonamental (YIN) i harmònics ----------
  function yin(buf, sr) {
    const W = 2048, maxLag = Math.min(Math.floor(sr / 40), buf.length - W - 1), minLag = Math.floor(sr / 2000);
    let rms = 0;
    for (let i = 0; i < W; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / W);
    if (rms < 0.003) return null;
    const d = yinBuf;
    d[0] = 1;
    let run = 0, best = -1;
    for (let tau = 1; tau <= maxLag; tau++) {
      let sum = 0;
      for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; sum += x * x; }
      run += sum;
      d[tau] = run ? sum * tau / run : 1;
    }
    for (let tau = minLag; tau <= maxLag; tau++) {
      if (d[tau] < 0.15) {
        while (tau + 1 <= maxLag && d[tau + 1] < d[tau]) tau++;
        best = tau; break;
      }
    }
    if (best < 0) return null;
    const a = d[best - 1], b = d[best], c = d[best + 1] ?? b;
    const den = a + c - 2 * b;
    const t = best + (den ? (a - c) / (2 * den) : 0);
    return { freq: sr / t, clarity: 1 - b };
  }

  // Busca el pic de l'espectre (gran resolució) prop de cada múltiple de f0.
  function measureHarmonics(freq) {
    const nyq = ctx.sampleRate / 2, n = data.length, binHz = nyq / n;
    const harm = [];
    for (let k = 1; k <= MAX_H; k++) {
      const target = k * freq;
      if (target > Math.min(FMAX, nyq * 0.95)) break;
      const span = Math.max(2, Math.round(target * 0.025 / binHz));
      const c = Math.round(target / binHz);
      let bi = c, bv = -Infinity;
      for (let i = Math.max(1, c - span); i <= Math.min(n - 2, c + span); i++) if (data[i] > bv) { bv = data[i]; bi = i; }
      const a = data[bi - 1], b = data[bi], g = data[bi + 1];
      const den = a + g - 2 * b;
      const off = den ? Math.max(-0.5, Math.min(0.5, (a - g) / (2 * den))) : 0;
      harm.push({ k, f: (bi + off) * binHz, db: b - (den ? (a - g) * off / 4 : 0) });
    }
    return harm;
  }

  function updatePitch(now) {
    if (now - lastPitch < 45) return;
    lastPitch = now;
    pitchAn.getFloatTimeDomainData(tbuf);
    const est = yin(tbuf, ctx.sampleRate);
    if (!est || est.clarity < 0.82 || est.freq < FMIN) {
      if (++f0Miss > 6) { f0 = null; f0Smooth = 0; }
      return;
    }
    f0Miss = 0;
    // Afina amb els harmònics de l'espectre de 32k punts (resolució ~1,5 Hz).
    let harm = measureHarmonics(est.freq);
    let num = 0, den = 0;
    for (const h of harm.slice(0, 8)) {
      if (h.db < -95) continue;
      const w = Math.pow(10, h.db / 20);
      num += w * h.f / h.k; den += w;
    }
    let freq = den ? num / den : est.freq;
    if (Math.abs(freq / est.freq - 1) > 0.03) freq = est.freq;
    f0Smooth = f0Smooth && Math.abs(freq / f0Smooth - 1) < 0.03 ? f0Smooth + (freq - f0Smooth) * 0.35 : freq;
    harm = measureHarmonics(f0Smooth);
    const m = 69 + 12 * Math.log2(f0Smooth / 440), r = Math.round(m);
    f0 = { freq: f0Smooth, midi: r, cents: (m - r) * 100, harm };
  }

  function noteLabel(midi) {
    const i = ((midi % 12) + 12) % 12, o = Math.floor(midi / 12) - 1;
    return NOTE[i] + o + ' (' + NOTE_CA[i] + ')';
  }

  function drawHarm() {
    const { g, w, h } = fit(harmC);
    g.clearRect(0, 0, w, h);
    g.font = '11px system-ui';
    if (!f0) {
      g.fillStyle = '#8a95a3'; g.textAlign = 'center';
      g.fillText(running ? 'Cap fonamental clara (toca una sola nota)' : 'Activa el micròfon', w / 2, h / 2);
      $('f0info').textContent = running ? 'Toca o canta una nota llarga' : '';
      return;
    }
    const ref = f0.harm[0].db, lo = -60, hi = 24;
    const L = 44, R = 10, T = 8, B = 22, cw = (w - L - R) / MAX_H;
    g.strokeStyle = '#2a313a'; g.fillStyle = '#8a95a3'; g.textAlign = 'right';
    for (let v = lo; v <= hi; v += 12) {
      const y = Math.round(T + (1 - (v - lo) / (hi - lo)) * (h - T - B)) + .5;
      g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
      g.fillText((v > 0 ? '+' : '') + v, L - 5, y + 4);
    }
    const y0 = T + (1 - (0 - lo) / (hi - lo)) * (h - T - B);
    g.textAlign = 'center';
    let strongest = f0.harm[0];
    for (const hm of f0.harm) {
      if (hm.db > strongest.db) strongest = hm;
      const rel = Math.max(lo, Math.min(hi, hm.db - ref));
      const x = L + (hm.k - 0.5) * cw, bw = Math.max(4, cw * 0.62);
      const y = T + (1 - (rel - lo) / (hi - lo)) * (h - T - B);
      g.fillStyle = hm.k === 1 ? '#f2b35b' : '#4fc3f7';
      g.fillRect(x - bw / 2, y, bw, h - B - y);
      g.fillStyle = '#8a95a3';
      g.fillText(hm.k === 1 ? 'F0' : 'H' + hm.k, x, h - 7);
    }
    g.strokeStyle = 'rgba(242,179,91,.6)'; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(L, y0); g.lineTo(w - R, y0); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#8a95a3'; g.textAlign = 'right'; g.fillText('dB respecte la fonamental', w - R - 4, T + 12);
    const c = Math.round(f0.cents);
    $('f0info').textContent = `Fonamental ${f0.freq.toFixed(1)} Hz · ${noteLabel(f0.midi)} ${c >= 0 ? '+' : ''}${c} cents · harmònic més fort: ${strongest.k === 1 ? 'la fonamental' : 'H' + strongest.k}`;
  }

  // ---------- espectre en directe ----------
  function drawSpec() {
    const { g, w, h } = fit(specC);
    axes(g, w, h, DB_MIN, DB_MAX, 10, '');
    if (running) {
      analyser.getFloatFrequencyData(data);
      const nyq = ctx.sampleRate / 2, n = data.length;
      const i0 = Math.max(1, Math.floor(FMIN / nyq * n));
      const i1 = Math.min(n - 1, Math.ceil(FMAX / nyq * n));

      const path = (arr) => {
        g.beginPath();
        for (let i = i0; i <= i1; i++) {
          const f = i * nyq / n;
          const x = xOf(Math.max(f, FMIN), w);
          const y = yOf(Math.max(DB_MIN, Math.min(DB_MAX, arr[i])), h, DB_MIN, DB_MAX);
          i === i0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
      };

      updatePitch(performance.now());
      const view = $('view').value;
      if ($('peak').checked && view !== 'bars') {
        for (let i = 0; i < n; i++) peaks[i] = Math.max(data[i], peaks[i] - 0.15);
        g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; path(peaks); g.stroke();
      }
      if (view !== 'bars') {
        path(data);
        g.strokeStyle = view === 'both' && f0 ? 'rgba(79,195,247,.55)' : '#4fc3f7'; g.lineWidth = 1.5; g.stroke();
        g.lineTo(xOf(FMAX, w), h - M.b); g.lineTo(xOf(FMIN, w), h - M.b); g.closePath();
        const grad = g.createLinearGradient(0, M.t, 0, h - M.b);
        grad.addColorStop(0, 'rgba(79,195,247,.25)'); grad.addColorStop(1, 'rgba(79,195,247,0)');
        g.fillStyle = grad; g.fill();
      }
      if (f0 && view !== 'line') {
        g.textAlign = 'center'; g.font = '10px system-ui';
        for (const hm of f0.harm) {
          const x = xOf(hm.f, w), y = yOf(Math.max(DB_MIN, Math.min(DB_MAX, hm.db)), h, DB_MIN, DB_MAX);
          g.fillStyle = hm.k === 1 ? '#f2b35b' : 'rgba(120,214,255,.9)';
          g.fillRect(x - 3, y, 6, h - M.b - y);
          if (hm.k <= 10) { g.fillStyle = '#c9d3de'; g.fillText(hm.k, x, y - 4); }
        }
      }
      if (f0) {
        const x = Math.round(xOf(f0.freq, w)) + .5;
        g.strokeStyle = '#f2b35b'; g.lineWidth = 1.5; g.setLineDash([5, 4]);
        g.beginPath(); g.moveTo(x, M.t); g.lineTo(x, h - M.b); g.stroke(); g.setLineDash([]);
        const c = Math.round(f0.cents);
        const label = `F0 ${f0.freq.toFixed(1)} Hz · ${noteLabel(f0.midi)} ${c >= 0 ? '+' : ''}${c}c`;
        g.font = 'bold 12px system-ui';
        const tw = g.measureText(label).width + 12;
        const bx = Math.min(w - M.r - tw, Math.max(M.l, x + 6));
        g.fillStyle = 'rgba(242,179,91,.95)'; g.fillRect(bx, M.t + 4, tw, 20);
        g.fillStyle = '#1b1406'; g.textAlign = 'left'; g.fillText(label, bx + 6, M.t + 18);
      }
    } else {
      g.fillStyle = '#8a95a3'; g.textAlign = 'center'; g.font = '14px system-ui';
      g.fillText('Prem «Activa el micròfon» per començar', w / 2, h / 2);
    }
    g.fillStyle = '#8a95a3'; g.font = '11px system-ui'; g.textAlign = 'left';
    g.fillText('dBFS', 4, 12);
    drawHarm();
    requestAnimationFrame(drawSpec);
  }

  // ---------- captura d'una mostra (bandes 1/3 d'octava, relativa) ----------
  function snapshot() {
    analyser.getFloatFrequencyData(data);
    const nyq = ctx.sampleRate / 2, n = data.length;
    const pw = new Array(NB).fill(0);
    let maxDb = -Infinity;
    for (let b = 0; b < NB; b++) {
      const lo = Math.max(1, Math.floor(edges[b][0] / nyq * n));
      const hi = Math.min(n - 1, Math.max(lo, Math.ceil(edges[b][1] / nyq * n)));
      let s = 0, c = 0;
      for (let i = lo; i <= hi; i++) { s += Math.pow(10, data[i] / 10); c++; maxDb = Math.max(maxDb, data[i]); }
      pw[b] = s / c;
    }
    if (maxDb < -75) return null; // massa silenci
    const bandsDb = pw.map(p => 10 * Math.log10(p + 1e-20));
    const total = 10 * Math.log10(pw.reduce((a, b) => a + b, 0) + 1e-20);
    return { bands: bandsDb.map(v => v - total), level: total };
  }

  function rate(label) {
    if (!running) return;
    const s = snapshot();
    if (!s) { setStatus('Senyal massa feble: no s\'ha desat.'); return; }
    samples.push({ t: Date.now(), label, bands: s.bands.map(v => +v.toFixed(2)) });
    save(); refreshStats();
    setStatus(label > 0 ? '👍 desat' : '👎 desat');
  }

  let statusTimer;
  function setStatus(t) {
    $('status').textContent = t;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => $('status').textContent = '', 2500);
  }

  // ---------- perfils apresos ----------
  function mean(list) {
    if (!list.length) return null;
    const m = new Array(NB).fill(0);
    for (const s of list) for (let i = 0; i < NB; i++) m[i] += s.bands[i];
    return m.map(v => v / list.length);
  }

  function refreshStats() {
    const up = samples.filter(s => s.label > 0), dn = samples.filter(s => s.label < 0);
    $('counts').textContent = `👍 ${up.length} · 👎 ${dn.length}`;
    drawProfiles(mean(up), mean(dn));
  }

  function bandX(i, w) { return xOf(centers[i], w); }

  function drawProfiles(mu, md) {
    // perfils
    let { g, w, h } = fit(profC);
    const all = [...(mu || []), ...(md || [])];
    let lo = -50, hi = 0;
    if (all.length) { lo = Math.floor((Math.min(...all) - 3) / 10) * 10; hi = Math.ceil((Math.max(...all) + 3) / 10) * 10; }
    axes(g, w, h, lo, hi, 10, '');
    const line = (arr, col) => {
      if (!arr) return;
      g.beginPath();
      arr.forEach((v, i) => { const x = bandX(i, w), y = yOf(v, h, lo, hi); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.strokeStyle = col; g.lineWidth = 2; g.stroke();
    };
    line(md, '#e5534b'); line(mu, '#43c06a');
    if (!mu && !md) { g.fillStyle = '#8a95a3'; g.textAlign = 'center'; g.fillText('Encara no hi ha dades', w / 2, h / 2); }

    // diferència
    ({ g, w, h } = fit(diffC));
    if (mu && md) {
      const d = mu.map((v, i) => v - md[i]);
      const m = Math.max(3, Math.ceil(Math.max(...d.map(Math.abs))));
      axes(g, w, h, -m, m, m > 8 ? 5 : 2, '');
      const y0 = yOf(0, h, -m, m);
      const bw = Math.max(3, (w - M.l - M.r) / NB * 0.7);
      d.forEach((v, i) => {
        const x = bandX(i, w), y = yOf(v, h, -m, m);
        g.fillStyle = v >= 0 ? '#43c06a' : '#e5534b';
        g.fillRect(x - bw / 2, Math.min(y, y0), bw, Math.abs(y - y0));
      });
    } else {
      axes(g, w, h, -6, 6, 2, '');
      g.fillStyle = '#8a95a3'; g.textAlign = 'center';
      g.fillText('Cal almenys una mostra 👍 i una 👎', w / 2, h / 2);
    }
  }

  // ---------- micròfon ----------
  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
      });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 32768;
      analyser.minDecibels = -120; analyser.maxDecibels = 0;
      analyser.smoothingTimeConstant = parseFloat($('smooth').value);
      src.connect(analyser);
      pitchAn = ctx.createAnalyser();
      pitchAn.fftSize = 4096;
      src.connect(pitchAn);
      tbuf = new Float32Array(pitchAn.fftSize);
      yinBuf = new Float32Array(Math.floor(ctx.sampleRate / 40) + 2);
      data = new Float32Array(analyser.frequencyBinCount);
      peaks = new Float32Array(analyser.frequencyBinCount).fill(-200);
      running = true;
      $('start').disabled = true; $('up').disabled = false; $('down').disabled = false;
      $('info').textContent = `${ctx.sampleRate} Hz · resolució ${(ctx.sampleRate / analyser.fftSize).toFixed(2)} Hz/bin`;
    } catch (e) {
      setStatus('No s\'ha pogut accedir al micròfon: ' + e.message);
    }
  }

  // ---------- import / export ----------
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
  }

  $('start').onclick = start;
  $('up').onclick = () => rate(1);
  $('down').onclick = () => rate(-1);
  $('smooth').onchange = () => { if (analyser) analyser.smoothingTimeConstant = parseFloat($('smooth').value); };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') { e.preventDefault(); rate(1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); rate(-1); }
  });
  $('exportJson').onclick = () => download('feedback_espectral.json',
    JSON.stringify({ centers: centers.map(c => +c.toFixed(1)), samples }, null, 1), 'application/json');
  $('exportCsv').onclick = () => {
    const head = ['timestamp', 'label', ...centers.map(c => c.toFixed(0) + 'Hz')].join(',');
    const rows = samples.map(s => [new Date(s.t).toISOString(), s.label, ...s.bands].join(','));
    download('feedback_espectral.csv', [head, ...rows].join('\n'), 'text/csv');
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    try {
      const j = JSON.parse(await e.target.files[0].text());
      const arr = Array.isArray(j) ? j : j.samples;
      if (!Array.isArray(arr) || arr.some(s => !s.bands || s.bands.length !== NB)) throw new Error('format invàlid');
      samples = samples.concat(arr); save(); refreshStats(); setStatus(`Importades ${arr.length} mostres`);
    } catch (err) { setStatus('Error important: ' + err.message); }
    e.target.value = '';
  };
  $('clear').onclick = () => {
    if (confirm('Segur que vols esborrar totes les mostres?')) { samples = []; save(); refreshStats(); }
  };
  addEventListener('resize', refreshStats);

  load(); refreshStats(); drawSpec();
})();
</script>
</body>
</html>
