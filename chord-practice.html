<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chord Practice</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #11131a;
      --panel: #1c2030;
      --ink: #f6f7fb;
      --muted: #b8bfd4;
      --accent: #91f2c0;
      --accent-strong: #1ea86a;
      --pulse: #e1fff0;
      --glow: #283452;
      --beat-start: rgba(145,242,192,.55);
      --beat-end: rgba(30,168,106,.2);
      --beat-shadow: rgba(30,168,106,.22);
      --accent-shadow: rgba(145,242,192,.18);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, var(--glow), var(--background) 54%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(96vw, 1080px);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .practice-time {
      margin: -10px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .98rem;
    }

    .practice-time output {
      display: inline;
      min-width: 0;
      margin-left: 5px;
      font-size: 1rem;
    }

    .reset-btn {
      width: 26px;
      height: 26px;
      min-height: 26px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,.25);
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    .reset-btn:hover { background: rgba(255,255,255,.1); color: var(--ink); }
    .reset-btn:active { transform: scale(.9); }

    .note-card {
      position: relative;
      min-height: min(50vh, 420px);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      align-items: center;
      column-gap: clamp(16px, 3.5vw, 40px);
      padding: 28px clamp(20px, 4vw, 40px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      box-shadow: 0 20px 70px rgba(0,0,0,.28);
      transition: background .08s ease, transform .08s ease, box-shadow .08s ease;
    }

    .current-chord {
      container-type: inline-size;
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 6px;
      min-width: 0;
    }

    .next-chord {
      container-type: inline-size;
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 16px 22px;
      border-radius: 20px;
      background: rgba(8,10,18,.4);
      backdrop-filter: blur(3px);
      color: var(--muted);
      min-width: 0;
    }

    .next-chord .next-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .75;
    }

    .next-chord #nextChord {
      font-size: clamp(2.2rem, 13vw, 6.5rem); /* fallback if container-query units are unsupported */
      font-size: clamp(2.2rem, 36cqi, 7rem);
      font-weight: 800;
      color: var(--accent);
      opacity: .7;
      line-height: 1;
    }

    .staff-wrap-main { justify-self: center; }

    .staff-wrap[hidden] { display: none; }
    .staff-wrap-main svg { display: block; width: 224px; height: 124px; }
    .staff-wrap-next svg { display: block; width: 172px; height: 96px; }

    .staff line { stroke: var(--muted); stroke-width: 1.8; }
    .staff .ledger { stroke: var(--muted); stroke-width: 1.8; }
    .staff .notehead { fill: var(--accent); }
    .staff .accidental { fill: var(--accent); }

    @media (max-width: 640px) {
      .note-card { grid-template-columns: 1fr; row-gap: 18px; }
      .current-chord { justify-items: center; text-align: center; }
      .next-chord { justify-self: center; }
    }

    .note-card.beat {
      background: linear-gradient(145deg, var(--beat-start), var(--beat-end));
      transform: scale(1.012);
      box-shadow: 0 20px 70px var(--beat-shadow);
    }

    #chord {
      font-size: clamp(4.5rem, 30vw, 17rem); /* fallback if container-query units are unsupported */
      font-size: clamp(4.5rem, 34cqi, 15rem);
      line-height: .8;
      font-weight: 800;
      letter-spacing: -.07em;
      color: var(--accent);
      text-shadow: 0 0 28px var(--accent-shadow);
    }

    .triangle {
      display: inline-block;
      font-size: .34em;
      font-weight: 700;
      letter-spacing: normal;
      vertical-align: top;
      line-height: 1;
      margin-left: .03em;
      transform: translateY(.06em);
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 26px 0 30px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #40475c;
      transition: transform .12s ease, background .12s ease;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.35);
    }

    .progress.sub-progress {
      margin: -14px 0 26px;
      min-height: 12px;
    }

    .progress.sub-progress[hidden] { display: none; }

    .dot.sub {
      width: 10px;
      height: 10px;
      background: transparent;
      border: 2px solid #ffb4aa;
      opacity: .55;
      border-radius: 2px;
    }

    .dot.sub.active {
      background: #ffb4aa;
      opacity: 1;
      transform: scale(1.35);
    }

    .poly-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .poly-grid[hidden] { display: none; }

    .poly-volumes {
      display: grid;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }

    .poly-volumes[hidden] { display: none; }
    .poly-volumes label { font-size: .9rem; }
    .poly-volumes output { min-width: 3ch; text-align: right; }

    button.poly-option {
      min-height: 38px;
      padding: 0 4px;
      border: 1px solid rgba(255,255,255,.2);
      background: #30394f;
      color: var(--ink);
      font-size: .9rem;
      font-variant-numeric: tabular-nums;
    }

    button.poly-option:hover { background: #3d4965; }
    button.poly-option.selected {
      background: #7d4a2f;
      border-color: #ffb4aa;
      color: #fff1ee;
      box-shadow: 0 0 0 2px #ffb4aa;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      align-items: stretch;
      gap: clamp(16px, 3vw, 32px);
      margin-top: 20px;
    }

    .chord-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .controls-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      padding: 26px;
      border-radius: 22px;
      background: var(--panel);
      text-align: left;
      min-width: 0;
    }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      .controls-column { justify-content: flex-start; }
    }

    .tempo-panel {
      display: grid;
      gap: 14px;
      margin-top: 20px;
      padding: 20px 26px;
      border-radius: 20px;
      background: var(--panel);
      text-align: left;
    }

    .tempo-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
    }

    label { font-weight: 650; }

    output {
      min-width: 5.5ch;
      font-variant-numeric: tabular-nums;
      font-size: 1.15rem;
      font-weight: 750;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-strong);
      cursor: pointer;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #092116;
      cursor: pointer;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover { background: var(--pulse); }
    button:active { transform: scale(.985); }
    button.running { background: #ffb4aa; color: #4a0c08; }
    button:focus-visible, input:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .instrument-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
    }

    .instrument-row span { font-weight: 650; }

    .option-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    button.secondary {
      width: 100%;
      min-height: 44px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: #30394f;
      color: var(--ink);
      font-size: .86rem;
    }

    button.secondary:hover { background: #3d4965; }
    button.secondary.selected {
      background: #4d3c79;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 0 22px var(--accent-shadow);
    }

    .chord-type-section {
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .chord-type-section > span { font-weight: 650; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 0;
      color: var(--muted);
      font-weight: 650;
      font-size: .85rem;
    }

    .panel-header .panel-header-buttons {
      display: flex;
      gap: 6px;
    }

    .panel-header button.secondary {
      width: auto;
      min-height: 32px;
      padding: 0 12px;
      font-size: .8rem;
    }

    .panel-header button.secondary.selected {
      background: #2f7d4f;
      border-color: var(--accent);
      color: #eafff2;
    }

    .prob-panel {
      border-radius: 16px;
      padding: 12px 14px 14px;
      background: linear-gradient(160deg, #3c3c3c, #1a1a1a);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
    }

    .prob-panel .panel-header:has(+ .prob-grid:not([hidden])) { margin-bottom: 10px; }

    .prob-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .prob-grid[hidden] { display: none; }

    .prob-notes-grid { grid-template-columns: repeat(7, 1fr); }

    button.prob-note.selected {
      background: #7d2f2f;
      border-color: #e0908e;
      color: #ffecec;
    }

    button.prob-note {
      flex: 1;
      width: auto;
      min-height: 36px;
      padding: 0 4px;
      border: 1px solid rgba(255,255,255,.2);
      background: #30394f;
      color: var(--ink);
      font-size: .82rem;
    }

    button.prob-note:hover { background: #3d4965; }

    .prob-chords-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 10px;
    }

    .prob-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prob-step {
      width: 22px;
      min-height: 22px;
      height: 22px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.2);
      background: #30394f;
      color: var(--ink);
      font-size: .85rem;
      line-height: 1;
    }

    .prob-step:hover { background: #3d4965; }
    .prob-step:active { transform: scale(.92); }

    .prob-label {
      flex: 1;
      font-size: .96rem;
      font-weight: 750;
      color: var(--ink);
    }

    .prob-percent {
      min-width: 1.8em;
      text-align: right;
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .chord-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    button.chord-option {
      min-height: 46px;
      padding: 0 8px;
      border: 1px solid rgba(255,255,255,.2);
      background: #30394f;
      color: var(--ink);
      font-size: 1rem;
    }

    button.chord-option:hover { background: #3d4965; }
    button.chord-option:not(.selected) { color: var(--muted); opacity: .68; }
    button.chord-option.selected {
      background: #285c50;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 0 18px var(--accent-shadow);
    }
    button.chord-option.selected::after { content: "  ✓"; }

    .help { margin: 16px 0 0; color: var(--muted); font-size: .92rem; }

    .played-notes {
      min-height: 1.5em;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 3.2vw, 1.35rem);
      font-weight: 650;
      letter-spacing: .04em;
    }

    @media (max-height: 700px) {
      body { padding: 14px; }
      h1 { margin-bottom: 12px; }
      .note-card { min-height: 32vh; }
      .progress { margin: 14px 0 18px; }
      .controls-column, .tempo-panel { padding: 16px 18px; gap: 12px; }
      .next-chord { padding: 8px 14px; }
      .next-chord #nextChord { font-size: clamp(1.8rem, 28cqi, 3.6rem); }
      .staff-wrap-main svg { width: 176px; height: 98px; }
      .staff-wrap-next svg { width: 136px; height: 76px; }
      .prob-panel { padding: 10px 12px 12px; }
      button.prob-note { min-height: 30px; font-size: .74rem; }
      .prob-step { width: 19px; min-height: 19px; height: 19px; font-size: .74rem; }
      .prob-label { font-size: .84rem; font-weight: 700; }
      .prob-percent { font-size: .66rem; }
    }
  </style>
</head>

    <p class="practice-time" aria-live="polite">
      Practice time:<output id="practiceTime">0.0 min</output>
      <button id="resetPracticeTime" class="reset-btn" type="button" aria-label="Reset practice time" title="Reset practice time">⟲</button>
    </p>

    <div class="layout">
      <div class="chord-column">
        <section class="note-card" id="chordCard" aria-live="polite" aria-label="Current chord">
          <div class="current-chord">
            <div id="chord">Ab7</div>
            <div class="staff-wrap staff-wrap-main" id="chordStaffWrap" hidden></div>
          </div>
          <div class="next-chord" aria-label="Next chord">
            <span class="next-label">Next</span>
            <span id="nextChord">Db7</span>
            <div class="staff-wrap staff-wrap-next" id="nextChordStaffWrap" hidden></div>
          </div>
        </section>
        <p class="played-notes" id="playedNotes" aria-live="polite">—</p>

        <div class="progress" id="beatDots" aria-label="Beats of the current bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="progress sub-progress" id="subDots" aria-label="Subdivision of the current bar" hidden></div>
      </div>

      <div class="controls-column" aria-label="Metronome controls">
        <button id="toggle" type="button" aria-pressed="false">Start</button>
        <div class="option-buttons" aria-label="Practice options">
          <button id="transposition" class="secondary selected" type="button" aria-pressed="true">Instrument: Bb</button>
          <button id="polyToggle" class="secondary" type="button" aria-expanded="false" aria-controls="polyGrid">Polyrhythm: Off</button>
          <div class="poly-grid" id="polyGrid" role="group" aria-label="Bar beats : subdivision parts" hidden></div>
          <div class="poly-volumes" id="polyVolumes" aria-label="Metronome volumes" hidden>
            <div class="tempo-row">
              <label for="beatVolume">Kick &amp; snare volume</label>
              <output id="beatVolumeValue" for="beatVolume">80</output>
            </div>
            <input id="beatVolume" type="range" min="0" max="100" value="80" step="1" aria-label="Kick and snare volume">
            <div class="tempo-row">
              <label for="subVolume">Subdivision volume</label>
              <output id="subVolumeValue" for="subVolume">80</output>
            </div>
            <input id="subVolume" type="range" min="0" max="100" value="80" step="1" aria-label="Subdivision metronome volume">
          </div>
        </div>
        <div class="chord-type-section">
          <span>Chord type</span>
          <div class="chord-options" role="group" aria-label="Chord types to practice">
            <button class="chord-option" type="button" data-chord-type="Maj7" aria-pressed="false">Maj7</button>
            <button class="chord-option selected" type="button" data-chord-type="7" aria-pressed="true">7</button>
            <button class="chord-option" type="button" data-chord-type="m7" aria-pressed="false">m7</button>
          </div>
        </div>

        <div class="prob-panel" aria-label="Root note probabilities">
          <div class="panel-header">
            <span>Prob chords</span>
            <div class="panel-header-buttons">
              <button id="probReset" class="secondary" type="button" hidden>Reset</button>
              <button id="probToggle" class="secondary" type="button" aria-expanded="false">Show</button>
            </div>
          </div>
          <div class="prob-grid prob-chords-grid" id="probGrid" hidden></div>
        </div>

        <div class="prob-panel" aria-label="Scale degree exclusions">
          <div class="panel-header">
            <span>Prob notes</span>
            <div class="panel-header-buttons">
              <button id="probNotesToggle" class="secondary" type="button" aria-expanded="false">Show</button>
            </div>
          </div>
          <div class="prob-grid prob-notes-grid" id="probNotesGrid" hidden></div>
        </div>
      </div>
    </div>

    <div class="tempo-panel">
      <div class="tempo-row">
        <label for="tempo">Tempo</label>
        <output id="tempoValue" for="tempo">80 BPM</output>
      </div>
      <input id="tempo" type="range" min="40" max="240" value="80" step="5" aria-label="Metronome tempo">
    </div>

    <p class="help">A new chord sounds on the first beat of every 4/4 bar (kick on strong beats, snare on weak ones). Press the space bar to start or stop.</p>
  </main>

        { label: "B", pitchClass: 11, sharp: false }
      ];
      // Probability weight per spelling (index into NOTE_SPELLINGS), always
      // summing to 100. Pressing a "Prob" button adds 10 to its own weight and
      // proportionally shrinks the rest so the total stays 100.
      const noteWeights = new Array(NOTE_SPELLINGS.length).fill(100 / NOTE_SPELLINGS.length);

      function getAudioContext() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          masterOutput = audioContext.createDynamicsCompressor();
          masterOutput.threshold.value = -20;
          masterOutput.knee.value = 16;
          masterOutput.ratio.value = 5;
          masterOutput.attack.value = 0.003;
          masterOutput.release.value = 0.24;
          masterOutput.connect(audioContext.destination);

          beatBus = audioContext.createGain();
          subBus = audioContext.createGain();
          beatBus.gain.value = volumeToGain(beatVolume.value);
          subBus.gain.value = volumeToGain(subVolume.value);
          beatBus.connect(masterOutput);
          subBus.connect(masterOutput);

          const noiseLength = Math.floor(audioContext.sampleRate * 0.5);
          noiseBuffer = audioContext.createBuffer(1, noiseLength, audioContext.sampleRate);
          const noiseData = noiseBuffer.getChannelData(0);
          for (let i = 0; i < noiseLength; i += 1) noiseData[i] = Math.random() * 2 - 1;

          const real = new Float32Array(12);
          const imaginary = new Float32Array([0, 1, 0.68, 0.37, 0.22, 0.12, 0.07, 0.035, 0.018, 0.01, 0.006, 0.003]);
          pianoWave = audioContext.createPeriodicWave(real, imaginary);
          concertReverb = createReverb(audioContext);
        }
        if (audioContext.state === "suspended") audioContext.resume();
        return audioContext;
      }

      function createReverb(context) {
        const duration = 2.2;
        const length = Math.floor(context.sampleRate * duration);
        const impulse = context.createBuffer(2, length, context.sampleRate);

        for (let channel = 0; channel < impulse.numberOfChannels; channel += 1) {
          const data = impulse.getChannelData(channel);
          for (let index = 0; index < length; index += 1) {
            const fade = Math.pow(1 - index / length, 2.7);
            const noise = Math.sin(index * 12.9898 + channel * 78.233) * 43758.5453;
            data[index] = ((noise - Math.floor(noise)) * 2 - 1) * fade;
          }
        }

        const convolver = context.createConvolver();
        const reverbGain = context.createGain();
        convolver.buffer = impulse;
        reverbGain.gain.value = 0.18;
        convolver.connect(reverbGain).connect(masterOutput);
        return convolver;
      }

      // Picks the next chord and schedules its sound at audio time `when`.
      // The on-screen update is deferred to that same moment by the caller's
      // UI timeout, because this runs slightly ahead of the audible beat.
      function chooseChord(when) {
        const chord = queuedChord ?? createRandomChord();
        currentConcertRootIndex = chord.rootIndex;
        currentChordType = chord.type;
        currentChordObj = chord;
        playSeventhChord(currentConcertRootIndex, currentChordType, when);
        queuedChord = createRandomChord();
        const shownChord = currentChordObj;
        const shownNext = queuedChord;
        runAt(when, () => {
          chordDisplay.innerHTML = chordSymbolFor(shownChord);
          renderStaff(chordStaffWrap, shownChord, "main");
          nextChordDisplay.innerHTML = chordSymbolFor(shownNext);
          renderStaff(nextChordStaffWrap, shownNext, "next");
        });
      }

      // Runs a UI update when the audio clock reaches `when`.
      function runAt(when, fn) {
        const delayMs = Math.max(0, (when - audioContext.currentTime) * 1000);
        const id = window.setTimeout(() => {
          pendingUiTimeouts.delete(id);
          fn();
        }, delayMs);
        pendingUiTimeouts.add(id);
      }

      // Picks a root pitch class at random, weighted by noteWeights (percentages
      // that sum to 100) instead of uniformly.
      // Picks a note SPELLING at random, weighted by noteWeights (percentages
      // that sum to 100) instead of uniformly. Returns an index into
      // NOTE_SPELLINGS — e.g. "Ab" and "G#" are separate entries here.
      function weightedRandomSpellingIndex() {
        const total = noteWeights.reduce((sum, w) => sum + w, 0);
        let r = Math.random() * total;
        for (let i = 0; i < NOTE_SPELLINGS.length; i += 1) {
          if (r < noteWeights[i]) return i;
          r -= noteWeights[i];
        }
        return NOTE_SPELLINGS.length - 1;
      }

      // Pressing a note's + or − button adjusts its own weight by 7
      // percentage points and shrinks/grows every OTHER spelling's weight
      // proportionally so the total stays 100. Enharmonic partners (e.g. G#
      // and Ab) are independent: adjusting one changes the other just like
      // any other note, it is never kept equal.
      function adjustNoteWeight(spellingIndex, delta) {
        const oldWeight = noteWeights[spellingIndex];
        const newWeight = Math.max(0, Math.min(100, oldWeight + delta));
        const remaining = 100 - newWeight;
        const oldRemainingSum = 100 - oldWeight;
        const otherCount = NOTE_SPELLINGS.length - 1;
        for (let i = 0; i < NOTE_SPELLINGS.length; i += 1) {
          if (i === spellingIndex) continue;
          noteWeights[i] = oldRemainingSum > 0 ? noteWeights[i] * (remaining / oldRemainingSum) : remaining / otherCount;
        }
        noteWeights[spellingIndex] = newWeight;
        renderProbPercentages();
      }

      function resetProbWeights() {
        const uniform = 100 / NOTE_SPELLINGS.length;
        for (let i = 0; i < NOTE_SPELLINGS.length; i += 1) noteWeights[i] = uniform;
        renderProbPercentages();
      }

      function renderProbPercentages() {
        probGrid.querySelectorAll(".prob-percent").forEach(span => {
          const i = Number(span.dataset.spellingIndex);
          span.textContent = `${Math.round(noteWeights[i])}`;
        });
      }

      // Builds the 15 note rows once: a +/− stepper on the left, the note
      // name, and its live percentage (no % sign) on the right.
      function buildProbGrid() {
        const fragment = document.createDocumentFragment();
        NOTE_SPELLINGS.forEach((spelling, index) => {
          const row = document.createElement("div");
          row.className = "prob-row";

          const plus = document.createElement("button");
          plus.type = "button";
          plus.className = "prob-step prob-step-plus";
          plus.textContent = "+";
          plus.dataset.spellingIndex = String(index);
          plus.dataset.delta = "7";
          plus.setAttribute("aria-label", `Increase ${spelling.label} probability`);

          const minus = document.createElement("button");
          minus.type = "button";
          minus.className = "prob-step prob-step-minus";
          minus.textContent = "−";
          minus.dataset.spellingIndex = String(index);
          minus.dataset.delta = "-7";
          minus.setAttribute("aria-label", `Decrease ${spelling.label} probability`);

          const label = document.createElement("span");
          label.className = "prob-label";
          label.textContent = spelling.label;

          const percent = document.createElement("span");
          percent.className = "prob-percent";
          percent.dataset.spellingIndex = String(index);

          row.appendChild(plus);
          row.appendChild(minus);
          row.appendChild(label);
          row.appendChild(percent);
          fragment.appendChild(row);
        });
        probGrid.appendChild(fragment);
        probGrid.addEventListener("click", event => {
          const button = event.target.closest(".prob-step");
          if (!button) return;
          adjustNoteWeight(Number(button.dataset.spellingIndex), Number(button.dataset.delta));
        });
        renderProbPercentages();
      }

      function toggleProbPanel() {
        const expanded = probToggleButton.getAttribute("aria-expanded") === "true";
        probGrid.hidden = expanded;
        probResetButton.hidden = expanded;
        probToggleButton.setAttribute("aria-expanded", String(!expanded));
        probToggleButton.textContent = expanded ? "Show" : "Hide";
      }

      function createRandomChord() {
        let nextConcertRootIndex;
        let nextChordType;
        let nextPreferSharp;
        let attempts = 0;
        do {
          // The Prob weights are about what note appears ON SCREEN (written
          // pitch), so pick the written spelling first, then undo the current
          // instrument's transposition to get the concert root to store.
          const spelling = NOTE_SPELLINGS[weightedRandomSpellingIndex()];
          nextConcertRootIndex = pitchClass(spelling.pitchClass - instruments[instrumentIndex].writtenOffset);
          nextPreferSharp = spelling.sharp;
          const choices = [...selectedChordTypes];
          nextChordType = choices[Math.floor(Math.random() * choices.length)];
          attempts += 1;
        } while (
          nextConcertRootIndex === currentConcertRootIndex &&
          nextChordType === currentChordType &&
          chordRoots.length * selectedChordTypes.size > 1 &&
          attempts < 20
        );
        const allowedDegrees = [0, 1, 2, 3, 4, 5, 6].filter(d => !excludedDegrees.has(d));
        const degreePool = allowedDegrees.length > 0 ? allowedDegrees : [0, 1, 2, 3, 4, 5, 6];
        const scaleDegreeIndex = degreePool[Math.floor(Math.random() * degreePool.length)];
        return { rootIndex: nextConcertRootIndex, type: nextChordType, scaleDegreeIndex, preferSharp: nextPreferSharp };
      }

      function noteName(pitchClassIndex, preferSharp) {
        const alternatives = enharmonicSpellings[pitchClassIndex];
        if (!alternatives) return chordRoots[pitchClassIndex];
        return alternatives[preferSharp ? 1 : 0];
      }

      function chordSymbolFor(chordObj) {
        const writtenRoot = (chordObj.rootIndex + instruments[instrumentIndex].writtenOffset) % chordRoots.length;
        return `${noteName(writtenRoot, chordObj.preferSharp)}${CHORD_SUFFIX_HTML[chordObj.type]}`;
      }

      function diatonicStep(letter, octave) {
        return LETTER_ORDER.indexOf(letter) + 7 * octave;
      }

      function normalizeAccidental(diff) {
        if (diff > 6) return diff - 12;
        if (diff < -6) return diff + 12;
        return diff;
      }

      // Picks whichever of the 7 natural letters spells a pitch class with the
      // smallest accidental — used as a fallback so we never show a double
      // sharp/flat for the rare keys where strict diatonic spelling would need one.
      function simplestSpelling(targetPitchClass) {
        let best = null;
        for (const letter of LETTER_ORDER) {
          const accidental = normalizeAccidental(targetPitchClass - NATURAL_PITCH_CLASS[letter]);
          if (!best || Math.abs(accidental) < Math.abs(best.accidental)) best = { letter, accidental };
        }
        return best;
      }

      // Sharp-spelling letters for the same 3 ambiguous pitch classes, so a
      // chord's whole scale can be spelled consistently with its symbol.
      const SHARP_LETTER_FOR_AMBIGUOUS = { 1: "C", 6: "F", 8: "G" };
      function rootLetterFor(pitchClassIndex, preferSharp) {
        if (preferSharp && SHARP_LETTER_FOR_AMBIGUOUS[pitchClassIndex]) return SHARP_LETTER_FOR_AMBIGUOUS[pitchClassIndex];
        return chordRoots[pitchClassIndex][0];
      }

      function chordScale(rootIndex, chordType, preferSharp) {
        const intervals = SCALE_INTERVALS[chordType];
        const rootLetter = rootLetterFor(rootIndex, preferSharp);
        const startLetterIdx = LETTER_ORDER.indexOf(rootLetter);
        return intervals.map((semitones, degree) => {
          const letterIdx = (startLetterIdx + degree) % 7;
          let letter = LETTER_ORDER[letterIdx];
          const octaveOffset = Math.floor((startLetterIdx + degree) / 7);
          const targetPitchClass = (rootIndex + semitones) % 12;
          let accidental = normalizeAccidental(targetPitchClass - NATURAL_PITCH_CLASS[letter]);
          if (Math.abs(accidental) > 1) {
            ({ letter, accidental } = simplestSpelling(targetPitchClass));
          }
          return { letter, accidental, octaveOffset };
        });
      }

      function scaleToneFor(chordObj) {
        if (!chordObj) return null;
        const writtenRoot = (chordObj.rootIndex + instruments[instrumentIndex].writtenOffset) % chordRoots.length;
        const degree = chordScale(writtenRoot, chordObj.type, chordObj.preferSharp)[chordObj.scaleDegreeIndex];
        return { letter: degree.letter, accidental: degree.accidental, octave: STAFF_BASE_OCTAVE + degree.octaveOffset };
      }

      function staffMarkup(tone, size) {
        const dims = size === "main"
          ? { width: 224, height: 124, lineGap: 17, bottomY: 103, noteRx: 13, noteRy: 10.4, accidentalSize: 38 }
          : { width: 172, height: 96, lineGap: 13, bottomY: 79, noteRx: 10, noteRy: 8, accidentalSize: 29 };

        const lineStartX = 10;
        const lineEndX = dims.width - 6;

        const lines = [];
        for (let i = 0; i < 5; i += 1) {
          const y = dims.bottomY - i * dims.lineGap;
          lines.push(`<line x1="${lineStartX}" y1="${y}" x2="${lineEndX}" y2="${y}" />`);
        }

        const step = diatonicStep(tone.letter, tone.octave) - BOTTOM_LINE_STEP;
        const noteY = dims.bottomY - step * (dims.lineGap / 2);
        const noteX = (lineStartX + lineEndX) / 2;

        const ledgerSteps = [];
        if (step > 8) {
          for (let s = 10; s <= step; s += 2) ledgerSteps.push(s);
        } else if (step < 0) {
          for (let s = -2; s >= step; s -= 2) ledgerSteps.push(s);
        }
        const ledgers = ledgerSteps
          .map(s => {
            const y = dims.bottomY - s * (dims.lineGap / 2);
            return `<line class="ledger" x1="${noteX - dims.noteRx - 4}" y1="${y}" x2="${noteX + dims.noteRx + 4}" y2="${y}" />`;
          })
          .join("");

        const notehead = `<ellipse class="notehead" cx="${noteX}" cy="${noteY}" rx="${dims.noteRx}" ry="${dims.noteRy}" transform="rotate(-18 ${noteX} ${noteY})" />`;

        const symbol = ACCIDENTAL_SYMBOLS[String(tone.accidental)] || "";
        const accidentalGlyph = symbol
          ? `<text class="accidental" x="${noteX - dims.noteRx - 9}" y="${noteY + dims.accidentalSize * 0.32}" font-size="${dims.accidentalSize}" text-anchor="middle">${symbol}</text>`
          : "";

        return `<svg class="staff" viewBox="0 0 ${dims.width} ${dims.height}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${lines.join("")}${ledgers}${notehead}${accidentalGlyph}</svg>`;
      }

      function renderStaff(container, chordObj, size) {
        const tone = scaleToneFor(chordObj);
        if (!tone) {
          container.hidden = true;
          container.innerHTML = "";
          return;
        }
        container.hidden = false;
        container.innerHTML = staffMarkup(tone, size);
      }

      function renderChordSymbol() {
        const chord = currentChordObj || { rootIndex: 0, type: currentChordType, preferSharp: false };
        chordDisplay.innerHTML = chordSymbolFor(chord);
      }

      function renderNextChordSymbol() {
        if (!queuedChord) {
          nextChordDisplay.textContent = "—";
          return;
        }
        nextChordDisplay.innerHTML = chordSymbolFor(queuedChord);
      }

      function renderPlayedNotes(voicing) {
        const writtenOffset = instruments[instrumentIndex].writtenOffset;
        const preferSharp = currentChordObj ? currentChordObj.preferSharp : false;
        playedNotes.textContent = voicing
          .map(note => noteName(pitchClass(note + writtenOffset), preferSharp))
          .join(" – ");
      }

      function toggleTransposition() {
        instrumentIndex = (instrumentIndex + 1) % instruments.length;
        const instrument = instruments[instrumentIndex];
        transpositionButton.textContent = `Instrument: ${instrument.label}`;
        transpositionButton.classList.toggle("selected", instrument.label !== "C");
        transpositionButton.setAttribute("aria-pressed", String(instrument.label !== "C"));
        renderChordSymbol();
        renderNextChordSymbol();
        renderStaff(chordStaffWrap, currentChordObj, "main");
        renderStaff(nextChordStaffWrap, queuedChord, "next");
        if (previousVoicing) renderPlayedNotes(previousVoicing);
      }

      function toggleChordType(chordType) {
        if (selectedChordTypes.has(chordType) && selectedChordTypes.size === 1) return;
        if (selectedChordTypes.has(chordType)) {
          selectedChordTypes.delete(chordType);
        } else {
          selectedChordTypes.add(chordType);
        }
        chordTypeButtons.forEach(button => {
          const selected = selectedChordTypes.has(button.dataset.chordType);
          button.classList.toggle("selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        queuedChord = createRandomChord();
        renderNextChordSymbol();
        renderStaff(nextChordStaffWrap, queuedChord, "next");
      }

      function toggleNoteExclusion(degreeIndex, button) {
        if (excludedDegrees.has(degreeIndex)) {
          excludedDegrees.delete(degreeIndex);
        } else {
          excludedDegrees.add(degreeIndex);
        }
        button.classList.toggle("selected", excludedDegrees.has(degreeIndex));
        button.setAttribute("aria-pressed", String(excludedDegrees.has(degreeIndex)));
        queuedChord = createRandomChord();
        renderNextChordSymbol();
        renderStaff(nextChordStaffWrap, queuedChord, "next");
      }

      function buildProbNotesGrid() {
        const fragment = document.createDocumentFragment();
        SCALE_DEGREE_LABELS.forEach((label, degreeIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "prob-note";
          button.textContent = label;
          button.dataset.degreeIndex = String(degreeIndex);
          button.setAttribute("aria-pressed", "false");
          fragment.appendChild(button);
        });
        probNotesGrid.appendChild(fragment);
        probNotesGrid.addEventListener("click", event => {
          const button = event.target.closest(".prob-note");
          if (!button) return;
          toggleNoteExclusion(Number(button.dataset.degreeIndex), button);
        });
      }

      function toggleProbNotesPanel() {
        const expanded = probNotesToggleButton.getAttribute("aria-expanded") === "true";
        probNotesGrid.hidden = expanded;
        probNotesToggleButton.setAttribute("aria-expanded", String(!expanded));
        probNotesToggleButton.textContent = expanded ? "Show" : "Hide";
      }

      function applyRandomPastelPalette() {
        let paletteIndex;
        do {
          paletteIndex = Math.floor(Math.random() * pastelPalettes.length);
        } while (paletteIndex === lastPaletteIndex && pastelPalettes.length > 1);
        lastPaletteIndex = paletteIndex;
        const palette = pastelPalettes[paletteIndex];
        const style = document.documentElement.style;
        style.setProperty("--background", palette.background);
        style.setProperty("--panel", palette.panel);
        style.setProperty("--accent", palette.accent);
        style.setProperty("--accent-strong", palette.accentStrong);
        style.setProperty("--glow", palette.glow);
        style.setProperty("--beat-start", palette.beatStart);
        style.setProperty("--beat-end", palette.beatEnd);
        style.setProperty("--beat-shadow", palette.beatShadow);
        style.setProperty("--accent-shadow", palette.accentShadow);
      }

      function updatePracticeTime() {
        const elapsedMs = accumulatedPracticeMs + (running ? Date.now() - practiceStartedAt : 0);
        practiceTime.textContent = `${(elapsedMs / 60000).toFixed(1)} min`;
      }

      function startPracticeTimer() {
        practiceStartedAt = Date.now();
        updatePracticeTime();
        practiceTimerId = window.setInterval(updatePracticeTime, 1000);
      }

      function stopPracticeTimer() {
        accumulatedPracticeMs += Date.now() - practiceStartedAt;
        window.clearInterval(practiceTimerId);
        practiceTimerId = undefined;
        updatePracticeTime();
      }

      function resetPracticeTime() {
        accumulatedPracticeMs = 0;
        if (running) practiceStartedAt = Date.now();
        updatePracticeTime();
      }

      function pitchClass(note) {
        return ((note % 12) + 12) % 12;
      }

      function buildVoicing(rootIndex, intervals) {
        if (!harmonicContinuity || !previousVoicing) {
          return intervals.map(interval => rootIndex + interval);
        }

        const pitchClasses = intervals.map(interval => pitchClass(rootIndex + interval));
        const previous = [...previousVoicing].sort((a, b) => a - b);
        const previousNotes = new Set(previous);
        let bestVoicing;
        let bestCommonTones = -1;
        let bestMovement = Infinity;
        let bestCentreDistance = Infinity;

        function consider(candidate) {
          const voicing = [...candidate].sort((a, b) => a - b);
          const commonTones = voicing.filter(note => previousNotes.has(note)).length;
          const movement = voicing.reduce((total, note, index) => total + Math.abs(note - previous[index]), 0);
          const centreDistance = voicing.reduce((total, note) => total + Math.abs(note - 12), 0);

          const isBetter =
            commonTones > bestCommonTones ||
            (commonTones === bestCommonTones && movement < bestMovement) ||
            (commonTones === bestCommonTones && movement === bestMovement && centreDistance < bestCentreDistance);

          if (isBetter) {
            bestVoicing = voicing;
            bestCommonTones = commonTones;
            bestMovement = movement;
            bestCentreDistance = centreDistance;
          }
        }

        function search(voiceIndex, candidate) {
          if (voiceIndex === pitchClasses.length) {
            consider(candidate);
            return;
          }

          for (let octave = -1; octave <= 3; octave += 1) {
            const note = pitchClasses[voiceIndex] + octave * 12;
            if (note >= -12 && note <= 35) {
              search(voiceIndex + 1, [...candidate, note]);
            }
          }
        }

        search(0, []);
        return bestVoicing;
      }

      function buildDots(container, count, extraClass) {
        container.innerHTML = "";
        const created = [];
        for (let i = 0; i < count; i += 1) {
          const dot = document.createElement("span");
          dot.className = extraClass ? `dot ${extraClass}` : "dot";
          container.appendChild(dot);
          created.push(dot);
        }
        return created;
      }

      // Rebuilds both dot rows to match the current bar length / subdivision.
      function rebuildDotRows() {
        dots = buildDots(beatDotsEl, barBeats);
        subDots = buildDots(subDotsEl, subParts, "sub");
        subDotsEl.hidden = subParts === 0;
      }

      function highlightBeatDot(index) {
        dots.forEach((dot, i) => dot.classList.toggle("active", i === index));
      }

      function highlightSubDot(index) {
        subDots.forEach((dot, i) => dot.classList.toggle("active", i === index));
      }

      // Slider 0-100 -> bus gain (squared curve so the low end is usable).
      function volumeToGain(value) {
        return 1.5 * Math.pow(Number(value) / 100, 2);
      }

      // Random number in [1 - spread, 1 + spread].
      function jitter(spread) {
        return 1 + (Math.random() * 2 - 1) * spread;
      }

      // Main metronome: kick on the strong beats (1st, 3rd, 5th, 7th), snare on
      // the weak ones (2nd, 4th, 6th). Only loudness, pitch and tone vary from
      // hit to hit; the hit itself always starts exactly at `when`.
      function drumSound(beatIndex, when) {
        const context = getAudioContext();
        const now = when ?? context.currentTime;
        if (beatIndex % 2 === 0) kickSound(context, now, beatIndex === 0);
        else snareSound(context, now);
      }

      function kickSound(context, now, downbeat) {
        const velocity = (downbeat ? 1 : 0.82) * jitter(0.07);
        const pitch = jitter(0.035);
        const body = context.createOscillator();
        const bodyGain = context.createGain();
        body.type = "sine";
        body.frequency.setValueAtTime(155 * pitch, now);
        body.frequency.exponentialRampToValueAtTime(46 * pitch, now + 0.12);
        bodyGain.gain.setValueAtTime(0.8 * velocity, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32 * jitter(0.08));
        body.connect(bodyGain).connect(beatBus);
        body.start(now);
        body.stop(now + 0.4);

        // Short beater click on top of the body.
        const click = context.createBufferSource();
        const clickFilter = context.createBiquadFilter();
        const clickGain = context.createGain();
        click.buffer = noiseBuffer;
        clickFilter.type = "lowpass";
        clickFilter.frequency.value = 3200 * jitter(0.15);
        clickGain.gain.setValueAtTime(0.28 * velocity, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);
        click.connect(clickFilter).connect(clickGain).connect(beatBus);
        click.start(now, Math.random() * 0.3);
        click.stop(now + 0.02);
      }

      function snareSound(context, now) {
        const velocity = jitter(0.12);
        const pitch = jitter(0.04);

        // Noise "wires".
        const noise = context.createBufferSource();
        const highpass = context.createBiquadFilter();
        const bandpass = context.createBiquadFilter();
        const noiseGain = context.createGain();
        noise.buffer = noiseBuffer;
        highpass.type = "highpass";
        highpass.frequency.value = 1100;
        bandpass.type = "bandpass";
        bandpass.frequency.value = 2300 * jitter(0.18);
        bandpass.Q.value = 0.6;
        noiseGain.gain.setValueAtTime(0.5 * velocity, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17 * jitter(0.12));
        noise.connect(highpass).connect(bandpass).connect(noiseGain).connect(beatBus);
        noise.start(now, Math.random() * 0.25);
        noise.stop(now + 0.22);

        // Drum shell tone.
        const shell = context.createOscillator();
        const shellGain = context.createGain();
        shell.type = "triangle";
        shell.frequency.setValueAtTime(215 * pitch, now);
        shell.frequency.exponentialRampToValueAtTime(165 * pitch, now + 0.07);
        shellGain.gain.setValueAtTime(0.34 * velocity, now);
        shellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        shell.connect(shellGain).connect(beatBus);
        shell.start(now);
        shell.stop(now + 0.12);
      }

      // Subdivision metronome: lower, hollow "wood block" (square wave through a
      // lowpass, short pitch drop) so it can't be confused with the main tick.
      function subClickSound(accented, when) {
        const context = getAudioContext();
        const now = when ?? context.currentTime;
        const oscillator = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        const base = accented ? 560 : 400;
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(base * 1.25, now);
        oscillator.frequency.exponentialRampToValueAtTime(base, now + 0.02);
        filter.type = "lowpass";
        filter.frequency.value = 1800;
        gain.gain.setValueAtTime(accented ? 0.15 : 0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        oscillator.connect(filter).connect(gain).connect(subBus);
        oscillator.start(now);
        oscillator.stop(now + 0.1);
      }

      function playSeventhChord(rootIndex, chordType, when) {
        const context = getAudioContext();
        const now = when ?? context.currentTime;
        const intervals = chordTypes[chordType].intervals;
        const voicing = buildVoicing(rootIndex, intervals);
        previousVoicing = voicing;
        runAt(now, () => renderPlayedNotes(voicing));
        const barDuration = currentBarDuration();
        const pianoRelease = Math.max(0.45, Math.min(2.35, barDuration * 0.78));
        const stringRelease = Math.max(1.1, Math.min(4.2, barDuration * 1.35));
        const chordGain = context.createGain();
        const filter = context.createBiquadFilter();
        const dryGain = context.createGain();
        const reverbSend = context.createGain();

        chordGain.gain.setValueAtTime(0.0001, now);
        chordGain.gain.exponentialRampToValueAtTime(1, now + 0.012);
        chordGain.gain.exponentialRampToValueAtTime(0.0001, now + pianoRelease);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(7600, now);
        filter.frequency.exponentialRampToValueAtTime(2200, now + pianoRelease * 0.94);
        filter.Q.value = 0.45;
        dryGain.gain.value = 0.92;
        reverbSend.gain.value = 0.33;
        chordGain.connect(filter);
        filter.connect(dryGain).connect(masterOutput);
        filter.connect(reverbSend).connect(concertReverb);

        voicing.forEach((note, voiceIndex) => {
          const frequency = 130.81 * Math.pow(2, note / 12);
          [-2.3, 2.3].forEach((detune, stringIndex) => {
            const oscillator = context.createOscillator();
            const voiceGain = context.createGain();
            const level = voiceIndex === 0 ? 0.09 : 0.072;
            oscillator.setPeriodicWave(pianoWave);
            oscillator.frequency.value = frequency;
            oscillator.detune.value = detune;
            voiceGain.gain.setValueAtTime(0.0001, now);
            voiceGain.gain.exponentialRampToValueAtTime(level * (stringIndex === 0 ? 1 : 0.9), now + 0.008);
            voiceGain.gain.exponentialRampToValueAtTime(level * 0.24, now + 0.3);
            voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + pianoRelease * 0.98);
            oscillator.connect(voiceGain).connect(chordGain);
            oscillator.start(now);
            oscillator.stop(now + pianoRelease);
          });
        });

        playStringLayer(context, voicing, now, stringRelease);
        if (bassEnabled) playBassLayer(context, rootIndex, now, stringRelease);
      }

      function playStringLayer(context, voicing, now, release) {
        const stringsGain = context.createGain();
        const stringsFilter = context.createBiquadFilter();
        const stringsReverbSend = context.createGain();
        const stringsDryGain = context.createGain();

        stringsGain.gain.setValueAtTime(0.0001, now);
        stringsGain.gain.exponentialRampToValueAtTime(1, now + 0.18);
        stringsGain.gain.exponentialRampToValueAtTime(0.0001, now + release);
        stringsFilter.type = "lowpass";
        stringsFilter.frequency.setValueAtTime(1750, now);
        stringsFilter.Q.value = 0.35;
        stringsDryGain.gain.value = 0.72;
        stringsReverbSend.gain.value = 0.48;
        stringsGain.connect(stringsFilter);
        stringsFilter.connect(stringsDryGain).connect(masterOutput);
        stringsFilter.connect(stringsReverbSend).connect(concertReverb);

        voicing.forEach((note, voiceIndex) => {
          const oscillator = context.createOscillator();
          const voiceGain = context.createGain();
          const frequency = 130.81 * Math.pow(2, note / 12);
          oscillator.type = "sawtooth";
          oscillator.frequency.value = frequency;
          oscillator.detune.value = (voiceIndex - 1.5) * 1.1;
          voiceGain.gain.value = voiceIndex === 0 ? 0.052 : 0.04;
          oscillator.connect(voiceGain).connect(stringsGain);
          oscillator.start(now);
          oscillator.stop(now + release + 0.03);
        });
      }

      function playBassLayer(context, rootIndex, now, release) {
        const bassFrequency = 65.405 * Math.pow(2, rootIndex / 12); // C2 fins a B2
        const bassRelease = Math.max(0.55, Math.min(2.8, release * 0.92));
        playBassTone(context, bassFrequency, now, bassRelease);
      }

      function playBassTone(context, bassFrequency, now, bassRelease) {
        const bassGain = context.createGain();
        const bassFilter = context.createBiquadFilter();
        const bassReverbSend = context.createGain();

        bassGain.gain.setValueAtTime(0.0001, now);
        bassGain.gain.exponentialRampToValueAtTime(0.58, now + 0.025);
        bassGain.gain.exponentialRampToValueAtTime(0.31, now + 0.18);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + bassRelease);
        bassFilter.type = "lowpass";
        bassFilter.frequency.setValueAtTime(620, now);
        bassFilter.frequency.exponentialRampToValueAtTime(190, now + bassRelease * 0.85);
        bassFilter.Q.value = 0.7;
        bassReverbSend.gain.value = 0.13;
        bassGain.connect(bassFilter);
        bassFilter.connect(masterOutput);
        bassFilter.connect(bassReverbSend).connect(concertReverb);

        [
          { type: "triangle", multiple: 1, level: 0.72 },
          { type: "sine", multiple: 2, level: 0.18 }
        ].forEach(layer => {
          const oscillator = context.createOscillator();
          const voiceGain = context.createGain();
          oscillator.type = layer.type;
          oscillator.frequency.value = bassFrequency * layer.multiple;
          voiceGain.gain.value = layer.level;
          oscillator.connect(voiceGain).connect(bassGain);
          oscillator.start(now);
          oscillator.stop(now + bassRelease + 0.03);
        });
      }

      function flash() {
        chordCard.classList.add("beat");
        window.setTimeout(() => chordCard.classList.remove("beat"), 85);
      }

      // Seconds per quarter note, and per whole bar.
      function beatSeconds() {
        return 60 / Number(tempo.value);
      }

      function currentBarDuration() {
        return barBeats * beatSeconds();
      }

      // Builds the events of one bar as phases in [0, 1). Beats come first at
      // equal phases so the two clicks of a coincidence stay in a stable order.
      function buildBarEvents() {
        const events = [];
        for (let k = 0; k < barBeats; k += 1) events.push({ phase: k / barBeats, kind: "beat", index: k });
        for (let j = 0; j < subParts; j += 1) events.push({ phase: j / subParts, kind: "sub", index: j });
        events.sort((a, b) => a.phase - b.phase || (a.kind === "beat" ? -1 : 1));
        return events;
      }

      function playEvent(event, when) {
        if (event.kind === "beat") {
          if (event.index === 0) chooseChord(when);
          drumSound(event.index, when);
          runAt(when, () => {
            highlightBeatDot(event.index);
            flash();
          });
        } else {
          subClickSound(event.index === 0, when);
          runAt(when, () => highlightSubDot(event.index));
        }
      }

      // Look-ahead scheduler: every 25 ms, queue every click that falls inside
      // the next 120 ms on the audio clock (sample-accurate, unlike setInterval).
      function scheduler() {
        const context = audioContext;
        const horizon = context.currentTime + LOOKAHEAD_SEC;
        for (;;) {
          if (eventPointer >= barEvents.length) {
            // Bar finished: start the next one, applying any new settings.
            barStartTime += currentBarDuration();
            barEvents = buildBarEvents();
            eventPointer = 0;
          }
          const event = barEvents[eventPointer];
          const when = barStartTime + event.phase * currentBarDuration();
          if (when > horizon) break;
          playEvent(event, Math.max(when, context.currentTime));
          eventPointer += 1;
        }
      }

      // A tempo change keeps the current position inside the bar: we rescale the
      // bar start so the phase stays where it is, and later events use the new
      // tempo straight away.
      function rescaleForTempo(oldBeatSeconds) {
        if (!running) return;
        const now = audioContext.currentTime;
        const phase = (now - barStartTime) / (barBeats * oldBeatSeconds);
        barStartTime = now - phase * currentBarDuration();
      }

      // Changing the bar / subdivision while running restarts the bar a moment
      // later, so the new pattern is heard from its downbeat.
      function restartBar() {
        if (!running) return;
        clearPendingUi();
        barStartTime = audioContext.currentTime + 0.06;
        barEvents = buildBarEvents();
        eventPointer = 0;
        rebuildDotRows();
      }

      function clearPendingUi() {
        pendingUiTimeouts.forEach(id => window.clearTimeout(id));
        pendingUiTimeouts.clear();
      }

      function start() {
        const context = getAudioContext();
        applyRandomPastelPalette();
        running = true;
        startPracticeTimer();
        rebuildDotRows();
        barStartTime = context.currentTime + 0.06;
        barEvents = buildBarEvents();
        eventPointer = 0;
        scheduler();
        schedulerId = window.setInterval(scheduler, SCHEDULER_MS);
        toggle.textContent = "Stop";
        toggle.classList.add("running");
        toggle.setAttribute("aria-pressed", "true");
      }

      function stop() {
        running = false;
        stopPracticeTimer();
        window.clearInterval(schedulerId);
        schedulerId = undefined;
        clearPendingUi();
        dots.forEach(dot => dot.classList.remove("active"));
        subDots.forEach(dot => dot.classList.remove("active"));
        toggle.textContent = "Start";
        toggle.classList.remove("running");
        toggle.setAttribute("aria-pressed", "false");
      }

      // ---- Polyrhythm selection -------------------------------------------
      // "A:B" = a bar of A quarter notes plus a second metronome dividing that
      // same bar into B equal parts. Pairs where one number divides the other
      // (4:2, 3:6, 5:5, anything with 1...) are just a plain subdivision of the
      // same pulse, so they are left out. Numbers go up to 7.
      const POLY_MAX = 7;
      const polyCombos = [];
      for (let a = 2; a <= POLY_MAX; a += 1) {
        for (let b = 2; b <= POLY_MAX; b += 1) {
          if (a % b !== 0 && b % a !== 0) polyCombos.push({ a, b });
        }
      }
      let polyButtons = [];

      function buildPolyGrid() {
        const fragment = document.createDocumentFragment();
        polyButtons = polyCombos.map(combo => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "poly-option";
          button.textContent = `${combo.a}:${combo.b}`;
          button.dataset.beats = String(combo.a);
          button.dataset.parts = String(combo.b);
          button.setAttribute("aria-pressed", "false");
          fragment.appendChild(button);
          return button;
        });
        polyGrid.appendChild(fragment);
        polyGrid.addEventListener("click", event => {
          const button = event.target.closest(".poly-option");
          if (!button) return;
          const beats = Number(button.dataset.beats);
          const parts = Number(button.dataset.parts);
          // Clicking the active combination again switches polyrhythm off.
          if (beats === barBeats && parts === subParts) setPolyrhythm(4, 0);
          else setPolyrhythm(beats, parts);
        });
      }

      function setPolyrhythm(beats, parts) {
        barBeats = beats;
        subParts = parts;
        polyButtons.forEach(button => {
          const selected = parts !== 0 && Number(button.dataset.beats) === beats && Number(button.dataset.parts) === parts;
          button.classList.toggle("selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        polyToggleButton.textContent = parts === 0 ? "Polyrhythm: Off" : `Polyrhythm: ${beats}:${parts}`;
        polyToggleButton.classList.toggle("selected", parts !== 0);
        helpText.textContent = helpMessage();
        if (running) restartBar();
        else rebuildDotRows();
      }

      function togglePolyPanel() {
        const expanded = polyToggleButton.getAttribute("aria-expanded") === "true";
        // The combinations and the two volume sliders open and close together.
        polyGrid.hidden = expanded;
        polyVolumes.hidden = expanded;
        polyToggleButton.setAttribute("aria-expanded", String(!expanded));
      }

      function helpMessage() {
        const base = subParts === 0
          ? "A new chord sounds on the first beat of every 4/4 bar (kick on strong beats, snare on weak ones)."
          : `Polyrhythm ${barBeats}:${subParts}: a bar of ${barBeats} beats (kick and snare) with ${subParts} equal parts over the same bar (low wood-block). A new chord sounds on each downbeat.`;
        return `${base} Press the space bar to start or stop.`;
      }

      let knownBeatSeconds = beatSeconds();
      tempo.addEventListener("input", () => {
        // The slider value has already changed by now, so the previous tempo is
        // kept in knownBeatSeconds to rescale the running bar against it.
        const oldBeatSeconds = knownBeatSeconds;
        knownBeatSeconds = beatSeconds();
        tempoValue.value = `${tempo.value} BPM`;
        tempoValue.textContent = `${tempo.value} BPM`;
        rescaleForTempo(oldBeatSeconds);
      });

      function bindVolume(slider, output, getBus) {
        slider.addEventListener("input", () => {
          output.value = slider.value;
          output.textContent = slider.value;
          const bus = getBus();
          if (bus) bus.gain.setTargetAtTime(volumeToGain(slider.value), audioContext.currentTime, 0.015);
        });
      }
      bindVolume(beatVolume, beatVolumeValue, () => beatBus);
      bindVolume(subVolume, subVolumeValue, () => subBus);

      toggle.addEventListener("click", () => running ? stop() : start());
      polyToggleButton.addEventListener("click", togglePolyPanel);
      transpositionButton.addEventListener("click", toggleTransposition);
      resetPracticeButton.addEventListener("click", resetPracticeTime);
      probToggleButton.addEventListener("click", toggleProbPanel);
      probNotesToggleButton.addEventListener("click", toggleProbNotesPanel);
      probResetButton.addEventListener("click", resetProbWeights);
      chordTypeButtons.forEach(button => {
        button.addEventListener("click", () => toggleChordType(button.dataset.chordType));
      });

      window.addEventListener("keydown", event => {
        if (event.code === "Space" && event.target.tagName !== "INPUT") {
          event.preventDefault();
          running ? stop() : start();
        }
      });

      buildProbGrid();
      buildProbNotesGrid();
      buildPolyGrid();

      // Seed the "next chord" preview before the metronome is ever started.
      queuedChord = createRandomChord();
      renderNextChordSymbol();
      renderStaff(nextChordStaffWrap, queuedChord, "next");
    })();
  </script>
</body>
</html>
