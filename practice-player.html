<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Player</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#14161a;--panel:#1d2026;--panel2:#262a33;--line:#343947;
  --text:#e8eaee;--muted:#98a0ae;--accent:#f0a93a;--accent2:#4fb3a5;--danger:#e0605a;
}
*{box-sizing:border-box}
html{overflow:auto;background:var(--bg)}
html,body{margin:0;color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{height:100vh;min-height:600px;display:flex;flex-direction:column;gap:9px;padding:10px 14px;max-width:1400px;margin:0 auto}
.muted{color:var(--muted)}
.spacer{flex:1}
button,.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:#5a6176}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--accent2);outline-offset:1px}
.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:650}
input[type=text],select{font:inherit;color:var(--text);background:#14171c;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
button.mini{padding:2px 8px;font-size:12px;border-radius:6px}

.bar{display:flex;align-items:center;gap:10px;position:relative}
h1{font-size:18px;margin:0 6px 0 0;font-weight:650;white-space:nowrap}
#fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#tracks{max-width:300px;min-width:0}
#tracks[hidden]{display:none}
#q{width:min(360px,32vw)}
#status{height:16px;font-size:12.5px;color:var(--muted);margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.err{color:var(--danger)}
#results{position:absolute;right:0;top:44px;width:min(680px,94vw);max-height:68vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.55);display:grid;gap:5px;align-content:start}
#results[hidden]{display:none}
#results .rhead{display:flex;gap:8px;align-items:center;position:sticky;top:-8px;background:var(--panel);padding:2px 0 6px;z-index:1}
#results .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:6px}
#results .row{display:flex;gap:8px;align-items:center}
#results .row input{accent-color:var(--accent);width:16px;height:16px;flex:none}
#results .item{display:flex;justify-content:space-between;gap:12px;text-align:left;flex:1;min-width:0;padding:5px 10px}
#results .item small{color:var(--muted);white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
#results .item span{overflow:hidden;text-overflow:ellipsis}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}

#wavewrap{position:relative;flex:1;min-height:110px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#101216}
canvas#wave{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
.transport{display:flex;gap:10px;align-items:center;position:relative}
.seg{display:flex;gap:3px;flex:1}
.seg button{flex:1;padding:3px 0;min-width:28px}
.seg button[aria-pressed=true]{background:var(--accent2);border-color:var(--accent2);color:#06201c;font-weight:650}
#plBtns{flex:none}
#plBtns button{flex:none;min-width:28px;padding:3px 8px}
#saxInfo{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#plPanel{position:absolute;right:0;top:36px;width:min(620px,94vw);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.55);display:grid;gap:5px;align-content:start}
#plPanel[hidden]{display:none}
#plPanel .rhead{display:flex;gap:8px;align-items:center}
#plPanel .rhead input{width:160px}
#plPanel .row{display:flex;gap:6px;align-items:center;border-radius:7px;padding:1px 3px}
#plPanel .row.cur{background:var(--panel2)}
#plPanel .row b{width:18px;text-align:center;font-size:12px;color:var(--muted)}
#plPanel .item{display:flex;justify-content:space-between;gap:12px;text-align:left;flex:1;min-width:0;padding:4px 10px}
#plPanel .item span{overflow:hidden;text-overflow:ellipsis}
#plPanel .item small{color:var(--muted);white-space:nowrap}
#time{font-variant-numeric:tabular-nums;font-size:16px;min-width:170px}
.keys{font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport select{padding:4px 6px;border-radius:7px}
button.toggle[aria-pressed=true]{background:var(--accent2);border-color:var(--accent2);color:#06201c;font-weight:650}
button.toggle{min-width:46px;padding:3px 10px}

.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.sl{display:flex;align-items:center;gap:10px}
.sl+.sl{margin-top:3px}
.sl .lbl{width:78px;color:var(--muted);font-size:12.5px}
.sl input[type=range]{flex:1;min-width:0;width:0;accent-color:var(--accent)}
.ctl>.box{min-width:0}
.sl select{flex:1}
output{font-variant-numeric:tabular-nums;min-width:58px;text-align:right}

#loops{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:4px 10px}
.loop{--c:hsl(var(--h) 70% 58%);display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:7px;padding:2px 6px;min-width:0;height:28px}
.loop.on{box-shadow:0 0 0 2px var(--c) inset}
.loop b{font-size:12px;width:14px;text-align:center;flex:none}
.loop button{padding:0 5px;height:20px;font-size:11px;border-radius:5px;flex:none}
.loop button.lp{width:24px;padding:0;background:var(--c);border-color:var(--c);color:#111;font-weight:700}
.loop button.ar{width:16px;padding:0;font-size:11px;line-height:1;touch-action:manipulation;user-select:none}
.loop button.ar:hover{border-color:var(--c);color:var(--c)}
.loop input.t{width:64px;flex:none;padding:1px 4px;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);background:#14171c;border:1px solid var(--line);border-radius:5px}
.loop input.sp{flex:1;min-width:36px;accent-color:var(--c);height:14px}
.loop output{min-width:34px;font-size:12px;flex:none}

@media (max-width:960px){
  #loops{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .ctl{grid-template-columns:1fr}
  body{height:auto}
  #wavewrap{min-height:180px}
}
</style>
</head>
<body>

<div class="bar">
  <h1>Practice Player</h1>
  <label class="btn primary" for="file">Open file</label>
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.oga,.opus,.m4a,.aac" multiple hidden>
  <span id="fileName" class="muted">No file loaded. You can also drop one here.</span>
  <select id="tracks" hidden title="Loaded versions"></select>
  <input type="text" id="q" placeholder="Search a song or an artist, or paste a link" autocomplete="off">
  <button id="searchBtn">Search</button>
  <div id="results" hidden></div>
</div>
<div id="status"></div>

<div id="wavewrap"><canvas id="wave"></canvas></div>

<div class="transport">
  <button id="toStart" title="Back to start">⏮</button>
  <button id="playBtn" class="primary" style="min-width:112px">▶ Play</button>
  <span id="time">0:00.000 / 0:00.000</span>
  <label class="muted" for="nudge" title="Step used by the loop start/end arrows">Nudge</label>
  <select id="nudge" title="Step used by the loop start/end arrows">
    <option value="0.01">0.01 s</option>
    <option value="0.05" selected>0.05 s</option>
    <option value="0.1">0.10 s</option>
    <option value="0.25">0.25 s</option>
    <option value="0.5">0.50 s</option>
    <option value="1">1 s</option>
  </select>
  <span class="spacer"></span>
  <span class="keys">Space · ←/→ ±5 s · 1–0 loops · S sax</span>
  <span class="muted">Lists</span>
  <div class="seg" id="plBtns" role="group" aria-label="Track lists"></div>
  <div id="plPanel" hidden></div>
  <label class="muted" for="vol">Volume</label>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" style="accent-color:var(--accent2);width:110px">
</div>

<div class="ctl">
  <div class="box">
    <div class="sl">
      <span class="lbl">Speed</span>
      <input type="range" id="speed" min="0.2" max="2" step="0.01" value="1">
      <output id="speedV">100%</output>
      <button class="mini" id="speedR" title="Reset to 100%">↺</button>
    </div>
    <div class="sl">
      <span class="lbl">Window</span>
      <select id="win" title="Short suits attacks and percussion, long suits sustained notes">
        <option value="43">Short · 43 ms</option>
        <option value="85" selected>Normal · 85 ms</option>
        <option value="170">Long · 170 ms</option>
      </select>
    </div>
  </div>
  <div class="box">
    <div class="sl">
      <span class="lbl">Semitones</span>
      <input type="range" id="semis" min="-12" max="12" step="1" value="0">
      <output id="semisV">0 st</output>
      <button class="mini" id="semisR" title="Reset to 0">↺</button>
    </div>
    <div class="sl">
      <span class="lbl">Cents</span>
      <input type="range" id="cents" min="-100" max="100" step="1" value="0">
      <output id="centsV">0 ct</output>
      <button class="mini" id="centsR" title="Reset to 0">↺</button>
    </div>
  </div>
  <div class="box">
    <div class="sl">
      <span class="lbl">Sax focus</span>
      <div class="seg" id="saxSeg" role="group" aria-label="Sax focus level">
        <button data-l="0" aria-pressed="true" title="Original mix (S cycles the levels)">Off</button>
        <button data-l="1" aria-pressed="false" title="Level 1: everything except the tracked saxophone melody is reduced by about 6 dB">1</button>
        <button data-l="2" aria-pressed="false" title="Level 2: everything except the tracked saxophone melody is reduced by about 15 dB">2</button>
        <button data-l="3" aria-pressed="false" title="Level 3: everything except the tracked saxophone melody is reduced by about 30 dB">3</button>
      </div>
      <select id="saxType" title="Type of saxophone">
        <option value="soprano">Soprano</option>
        <option value="alto">Alto</option>
        <option value="tenor" selected>Tenor</option>
        <option value="baritone">Baritone</option>
      </select>
    </div>
    <div class="sl">
      <span class="lbl"></span>
      <span id="saxInfo" class="muted"></span>
    </div>
  </div>
</div>

<div id="loops"></div>

<script id="sax-src" type="text/plain">
function* saxJob(L, R, sr, cfg) {
  const guide = cfg.guide || null;
  const XL = L, XR = R || L;
  const GL = guide ? guide.L : L, GR = guide ? (guide.R || guide.L) : (R || L);
  const len = L.length;
  const N = 1 << Math.round(Math.log2(sr * 0.093));
  const H = N >> 2, half = N >> 1;
  const nF = Math.ceil(len / H) + 3;
  const binHz = sr / N;
  const win = new Float64Array(N);
  let winEnergy = 0;
  for (let n = 0; n < N; n++) { win[n] = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N); winEnergy += win[n] * win[n]; }
  const cosT = new Float64Array(half), sinT = new Float64Array(half);
  for (let k = 0; k < half; k++) { cosT[k] = Math.cos(2 * Math.PI * k / N); sinT[k] = Math.sin(2 * Math.PI * k / N); }
  const bits = Math.round(Math.log2(N));
  const rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) { let r = 0, x = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
  const re = new Float64Array(N), im = new Float64Array(N);
  function fft(sgn) {
    for (let i = 0; i < N; i++) {
      const j = rev[i];
      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let size = 2; size <= N; size <<= 1) {
      const hs = size >> 1, step = N / size;
      for (let start = 0; start < N; start += size) {
        for (let k = 0, tw = 0; k < hs; k++, tw += step) {
          const wr = cosT[tw], wi = sgn * sinT[tw];
          const a = start + k, b = a + hs;
          const xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
          re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
        }
      }
    }
  }
  function loadFrame(a, b, t) {
    const s0 = t * H - (N - H);
    for (let n = 0; n < N; n++) {
      const i = s0 + n;
      if (i >= 0 && i < len) { re[n] = a[i] * win[n]; im[n] = b[i] * win[n]; } else { re[n] = 0; im[n] = 0; }
    }
  }
  const A = new Float64Array(half + 1), B = new Float64Array(half + 1), Pk = new Float64Array(half + 1), cum = new Float64Array(half + 2);
  function midMag() {
    let e = 0;
    for (let k = 0; k <= half; k++) {
      const k2 = (N - k) & (N - 1);
      const zr = re[k], zi = im[k], wr = re[k2], wi = im[k2];
      const lr = (zr + wr) * 0.5, li = (zi - wi) * 0.5;
      const rr = (zi + wi) * 0.5, ri = (wr - zr) * 0.5;
      const mr = (lr + rr) * 0.5, mi = (li + ri) * 0.5;
      A[k] = Math.sqrt(mr * mr + mi * mi);
      e += A[k] * A[k];
    }
    return 2 * e / (N * winEnergy);
  }
  const fmin = cfg.fmin, fmax = cfg.fmax, stepC = 20, HM = 14, fTop = 8000;
  const P = Math.floor(1200 * Math.log2(fmax / fmin) / stepC) + 1;
  const hbin = new Float32Array(P * HM), hcnt = new Uint8Array(P), bias = new Float32Array(P), hw = new Float32Array(HM);
  for (let h = 0; h < HM; h++) hw[h] = Math.pow(0.86, h);
  for (let p = 0; p < P; p++) {
    const f = fmin * Math.pow(2, p * stepC / 1200);
    let c = 0;
    for (let h = 1; h <= HM; h++) {
      const fh = f * h;
      if (fh > fTop || fh / binHz >= half - 2) break;
      hbin[p * HM + c] = fh / binHz; c++;
    }
    hcnt[p] = c;
    bias[p] = 1 + 0.08 * (1 - p / Math.max(1, P - 1));
  }
  const Wb = Math.max(8, Math.round(600 / binHz));
  const kTop = Math.min(half, Math.ceil(fTop / binHz) + 2);
  const sal = new Float32Array(nF * P);
  const gated = new Uint8Array(nF);
  const peaksT = [];
  for (let t = 0; t < nF; t++) {
    loadFrame(GL, GR, t); fft(-1);
    const ms = midMag();
    if (ms > 1e-8) {
      gated[t] = 1;
      cum[0] = 0;
      for (let k = 0; k <= half; k++) { B[k] = Math.sqrt(A[k]); cum[k + 1] = cum[k] + B[k]; }
      for (let k = 0; k <= half; k++) {
        if (k > kTop) { Pk[k] = 0; continue; }
        const lo = k - Wb < 0 ? 0 : k - Wb, hi = k + Wb > half ? half : k + Wb;
        const v = B[k] / ((cum[hi + 1] - cum[lo]) / (hi - lo + 1) + 1e-12) - 1;
        Pk[k] = v > 0 ? (v < 3 ? v : 3) : 0;
      }
      let mx = 0;
      for (let p = 0; p < P; p++) {
        let s = 0, ws = 0;
        const c = hcnt[p], o = p * HM;
        for (let h = 0; h < c; h++) {
          const i = Math.round(hbin[o + h]);
          let v = Pk[i];
          if (Pk[i - 1] > v) v = Pk[i - 1];
          if (Pk[i + 1] > v) v = Pk[i + 1];
          s += hw[h] * v; ws += hw[h];
        }
        const val = ws > 0 ? s / ws * bias[p] : 0;
        sal[t * P + p] = val;
        if (val > mx) mx = val;
      }
      peaksT.push(mx);
    }
    if ((t & 63) === 0) yield 0.35 * t / nF;
  }
  peaksT.sort((a, b) => a - b);
  const ref = peaksT.length ? Math.max(peaksT[Math.floor(0.9 * (peaksT.length - 1))], 1e-6) : 1;
  const tau = cfg.tau, lam = cfg.lam, jumpC = cfg.jump, vPen = cfg.vpen;
  const S1 = P + 1;
  const bp = new Int16Array(nF * S1);
  let prev = new Float32Array(S1), cur = new Float32Array(S1);
  const fw = new Float32Array(P), fs = new Int16Array(P), bw = new Float32Array(P), bs = new Int16Array(P);
  for (let j = 0; j < P; j++) prev[j] = gated[0] ? sal[j] / ref : 0;
  prev[P] = tau;
  for (let t = 1; t < nF; t++) {
    let gm = -1e9, gi = 0;
    for (let j = 0; j < P; j++) if (prev[j] > gm) { gm = prev[j]; gi = j; }
    for (let j = 0; j < P; j++) {
      if (j > 0 && fw[j - 1] - lam > prev[j]) { fw[j] = fw[j - 1] - lam; fs[j] = fs[j - 1]; } else { fw[j] = prev[j]; fs[j] = j; }
    }
    for (let j = P - 1; j >= 0; j--) {
      if (j < P - 1 && bw[j + 1] - lam > fw[j]) { bw[j] = bw[j + 1] - lam; bs[j] = bs[j + 1]; } else { bw[j] = fw[j]; bs[j] = fs[j]; }
    }
    const fromU = prev[P] - vPen, o = t * S1, g = gated[t];
    for (let j = 0; j < P; j++) {
      let best = bw[j], src = bs[j];
      if (gm - jumpC > best) { best = gm - jumpC; src = gi; }
      if (fromU > best) { best = fromU; src = P; }
      cur[j] = best + (g ? sal[t * P + j] / ref : 0);
      bp[o + j] = src;
    }
    let ub = prev[P], us = P;
    if (gm - vPen > ub) { ub = gm - vPen; us = gi; }
    cur[P] = ub + tau;
    bp[o + P] = us;
    const sw = prev; prev = cur; cur = sw;
    if ((t & 255) === 0) yield 0.35 + 0.05 * t / nF;
  }
  const f0 = new Float32Array(nF), voiced = new Uint8Array(nF);
  let st = P, bv = prev[P];
  for (let j = 0; j < P; j++) if (prev[j] > bv) { bv = prev[j]; st = j; }
  let nGated = 0, nVoiced = 0;
  for (let t = nF - 1; t >= 0; t--) {
    if (st < P) {
      voiced[t] = 1;
      const a = st > 0 ? sal[t * P + st - 1] : 0, b0 = sal[t * P + st], c = st < P - 1 ? sal[t * P + st + 1] : 0;
      const den = a - 2 * b0 + c;
      let d = den < -1e-9 ? 0.5 * (a - c) / den : 0;
      if (d > 0.5) d = 0.5; else if (d < -0.5) d = -0.5;
      f0[t] = fmin * Math.pow(2, (st + d) * stepC / 1200);
    }
    if (gated[t]) { nGated++; if (voiced[t]) nVoiced++; }
    st = bp[t * S1 + st];
  }
  yield 0.4;
  const SL = new Float32Array(len), SR = R ? new Float32Array(len) : null;
  const m = new Float32Array(half + 1);
  const norm = 1 / (1.5 * N), hiLimit = Math.min(cfg.hi || 14000, 0.45 * sr);
  const f0s = [];
  for (let t = 0; t < nF; t++) {
    f0s.length = 0;
    for (let u = t - 1; u <= t + 1; u++) if (u >= 0 && u < nF && voiced[u]) f0s.push(f0[u]);
    if (f0s.length) {
      loadFrame(GL, GR, t); fft(-1); midMag();
      m.fill(0);
      for (let q = 0; q < f0s.length; q++) {
        const f = f0s[q];
        for (let h = 1; h * f <= hiLimit; h++) {
          const c = h * f / binHz;
          const w = 1.2 + 0.004 * c;
          let lo = Math.floor(c - w), hi = Math.ceil(c + w);
          if (lo < 1) lo = 1;
          if (hi > half - 1) hi = half - 1;
          if (lo > hi) break;
          let cp = lo, mv = A[lo];
          for (let k = lo + 1; k <= hi; k++) if (A[k] > mv) { mv = A[k]; cp = k; }
          const hwid = 1.5 + 0.0035 * c, taper = 1.0;
          let k0 = Math.floor(cp - hwid - taper), k1 = Math.ceil(cp + hwid + taper);
          if (k0 < 1) k0 = 1;
          if (k1 > half - 1) k1 = half - 1;
          for (let k = k0; k <= k1; k++) {
            const dist = Math.abs(k - cp);
            const v = dist <= hwid ? 1 : 1 - (dist - hwid) / taper;
            if (v > m[k]) m[k] = v;
          }
        }
      }
      if (guide) { loadFrame(XL, XR, t); fft(-1); }
      for (let k = 0; k <= half; k++) {
        const mk = m[k];
        re[k] *= mk; im[k] *= mk;
        if (k > 0 && k < half) { re[N - k] *= mk; im[N - k] *= mk; }
      }
      fft(1);
      const s0 = t * H - (N - H);
      for (let n = 0; n < N; n++) {
        const i = s0 + n;

class StretchProcessor extends AudioWorkletProcessor {

async function searchArchive(q) {

    '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&rows=12&page=1&output=json&sort%5B%5D=downloads+desc';
  const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).response.docs;
}
async function searchItunes(q) {
  const r = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=10&term=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).results;
}

  setStatus('Searching YouTube and SoundCloud…');
  const r = await fetch(helperBase + '/api/search?q=' + encodeURIComponent(q));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  const by = {};
  for (const it of j.results) (by[it.source] = by[it.source] || []).push({ ...it, helper: true });
  const groups = Object.keys(by).map(k => ({ title: k, items: by[k] }));
  const errs = Object.entries(j.errors || {}).map(([k, v]) => k + ': ' + v);
  if (!groups.length) { hideResults(); setStatus(errs.length ? 'Search failed. ' + errs.join(' | ') : 'No results. Try different words.', !!errs.length); return; }
  renderResults(groups);
  setStatus(errs.length ? 'Some sources failed. ' + errs.join(' | ') : 'Tick the versions you want and press "Load selected", or click one to load it.', !!errs.length);
}
async function searchBrowserOnly(q) {

  const groups = [];
  if (ia.status === 'fulfilled' && ia.value.length) {
    groups.push({
      title: 'Internet Archive · full tracks (free or public-domain music)',

        const t = (Array.isArray(d.title) ? d.title[0] : d.title) || d.identifier;
        const c = Array.isArray(d.creator) ? d.creator[0] : d.creator;
        return { title: t + (c ? ' — ' + c : ''), small: 'files →', drill: () => showArchiveFiles(d.identifier, t, () => searchBrowserOnly(q)) };

      items: it.value.filter(d => d.previewUrl).map(d => ({ title: d.trackName, uploader: d.artistName, source: 'preview', url: d.previewUrl, name: d.artistName + ' - ' + d.trackName + ' (preview)', helper: false }))

async function doSearch() {
  const q = $('#q').value.trim(); if (!q) return;
  if (!helper) await detectHelper();
  if (/^https?:\/\//i.test(q)) {
    hideResults();
    const guess = decodeURIComponent(q.split('/').pop().split('?')[0]) || 'audio';
    if (helper) { loadItems([{ title: guess, url: q, helper: true }]); return; }
    if (/(youtube\.com|youtu\.be|instagram\.com|soundcloud\.com|tiktok\.com|facebook\.com|vimeo\.com|bandcamp\.com|twitter\.com|x\.com)/i.test(q)) { setStatus('This link needs the helper. ' + helperHint(), true); return; }
    loadItems([{ title: guess, url: q, helper: false }]); return;
  }
  try {
    if (helper) await searchViaHelper(q); else await searchBrowserOnly(q);
  } catch (err) {
    console.error(err);
    hideResults();
    if (helper && err instanceof TypeError) { helper = null; helperBase = ''; setStatus('The helper stopped responding. ' + helperHint(), true); }
    else setStatus('Search failed: ' + err.message, true);
  }
}
async function pingHelper(base) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 2500);
  try {
    const r = await fetch(base + '/api/ping', { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.ok ? j : null;
  } catch (e) { return null; }
  finally { clearTimeout(timer); }
}
async function detectHelper() {
  if (location.protocol === 'file:') { helper = null; helperBase = ''; return false; }
  const bases = [];
  if (isWeb && !isHosted) bases.push('');
  bases.push('http://127.0.0.1:' + helperPort);
  for (const base of bases) {
    const j = await pingHelper(base);
    if (j) {
      helper = j; helperBase = base;
      $('#q').placeholder = 'Search a song or an artist (YouTube, SoundCloud…), or paste a link';
      return true;
    }
  }
  helper = null; helperBase = '';
  $('#q').placeholder = 'Search a song or an artist, or paste a link';

}

const canvas = $('#wave'), g = canvas.getContext('2d'), wrap = $('#wavewrap');

    mn[x] = lo; mx[x] = hi;

  o.strokeStyle = '#2a2f3a'; o.lineWidth = 1; o.beginPath(); o.moveTo(0, mid); o.lineTo(w, mid); o.stroke();

  for (let t = 0; t < audio.duration; t += st) {
    const x = Math.round(t * pxPerSec); o.fillStyle = '#1e222b'; o.fillRect(x, 0, 1, h);
    o.fillStyle = '#6b7385'; o.fillText(fmt(t).slice(0, -4), x + 3 * dpr, h - 14 * dpr);
  }
  o.fillStyle = '#f0a93a';
  for (let x = 0; x < w; x++) {
    const y0 = mid - mx[x] * mid * 0.95, y1 = mid - mn[x] * mid * 0.95;

function draw() {
  requestAnimationFrame(draw);
  $('#time').textContent = fmt(curSec) + ' / ' + fmt(audio ? audio.duration : 0);
  if (!off) { g.fillStyle = '#101216'; g.fillRect(0, 0, canvas.width, canvas.height); return; }
  const w = canvas.width, h = canvas.height, dur = audio.duration, dpr = window.devicePixelRatio || 1;
  g.drawImage(off, 0, 0);
  loops.forEach((lp, i) => {
    if (lp.start == null || lp.end == null) return;
    const x0 = lp.start / dur * w, x1 = lp.end / dur * w, hue = loopHue(i);
    g.fillStyle = `hsla(${hue},70%,58%,${mode === i && playing ? 0.34 : 0.2})`; g.fillRect(x0, 0, Math.max(2, x1 - x0), h);
    g.fillStyle = `hsl(${hue} 70% 58%)`; g.fillRect(x0, 0, 2, h); g.fillRect(x1 - 1, 0, 2, h);
    g.fillRect(x0, 0, 24 * dpr, 16 * dpr); g.fillStyle = '#111'; g.font = 'bold ' + (11 * dpr) + 'px system-ui'; g.textBaseline = 'top';
    g.fillText(String(i + 1), x0 + 6 * dpr, 2 * dpr);
  });
  const px = curSec / dur * w; g.fillStyle = '#fff'; g.fillRect(px - 1, 0, 2 * Math.max(1, dpr * 0.8), h);
}
const xToSec = ev => { const r = canvas.getBoundingClientRect(); return clamp((ev.clientX - r.left) / r.width, 0, 1) * (audio ? audio.duration : 0); };
canvas.addEventListener('pointerdown', ev => { if (audio) seekClick(xToSec(ev)); });
function seekClick(t) {
  if (typeof mode === 'number') {
    const lp = loops[mode];
    if (t >= lp.start && t < lp.end) seekTo(t);
    else { mode = 'main'; post({ type: 'loop', enabled: false, start: 0, end: 0 }); seekTo(t); applyParams(); refreshUI(); }
  } else seekTo(t);
}
let rz;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(computePeaks, 120); }).observe(wrap);

const loopEls = [];
function buildLoops() {
  const grid = $('#loops');
  loops.forEach((lp, i) => {
    const c = document.createElement('div'); c.className = 'loop'; c.style.setProperty('--h', loopHue(i));
    c.innerHTML = `
      <button class="lp" title="Play loop ${i + 1}">▶</button><b>${i + 1}</b>
      <button class="ar" data-n="start" data-d="-1" title="Start earlier">◂</button><input class="t ts" placeholder="start" spellcheck="false" title="Loop start (m:ss.mmm)"><button class="ar" data-n="start" data-d="1" title="Start later">▸</button><button class="sS" title="Set the start at the cursor">Set</button>
      <button class="ar" data-n="end" data-d="-1" title="End earlier">◂</button><input class="t te" placeholder="end" spellcheck="false" title="Loop end (m:ss.mmm)"><button class="ar" data-n="end" data-d="1" title="End later">▸</button><button class="sE" title="Set the end at the cursor">Set</button>
      <input type="range" class="sp" min="0.2" max="2" step="0.01" value="1" title="Loop speed">
      <output class="spv">100%</output><button class="rs" title="Reset speed to 100%">↺</button><button class="clr" title="Clear loop">✕</button>`;
    grid.append(c);
    const q = s => c.querySelector(s);
    const e = { c, ts: q('.ts'), te: q('.te'), sp: q('.sp'), spv: q('.spv'), lp: q('.lp') };
    loopEls.push(e);
    c.querySelectorAll('.ar').forEach(b => holdRepeat(b, () => nudge(i, b.dataset.n, +b.dataset.d)));
    q('.sS').onclick = () => audio && setBound(i, 'start', curSec);
    q('.sE').onclick = () => audio && setBound(i, 'end', curSec);
    e.ts.onchange = () => { const t = parseTime(e.ts.value); if (isNaN(t)) refreshLoop(i); else setBound(i, 'start', t); };
    e.te.onchange = () => { const t = parseTime(e.te.value); if (isNaN(t)) refreshLoop(i); else setBound(i, 'end', t); };
    e.sp.oninput = () => { lp.speed = +e.sp.value; e.spv.textContent = pct(lp.speed); if (mode === i) applyParams(); saveLoops(); };
    q('.rs').onclick = () => { e.sp.value = 1; e.sp.oninput(); };
    q('.clr').onclick = () => { if (mode === i && playing) pauseAll(); lp.start = lp.end = null; lp.speed = 1; refreshLoop(i); saveLoops(); };
    e.lp.onclick = () => playLoop(i);
  });
}
function setBound(i, which, sec) {
  if (!audio) return;
  const lp = loops[i]; lp[which] = clamp(sec, 0, audio.duration);
  if (lp.start != null && lp.end != null && lp.end < lp.start + 0.05) {
    if (which === 'start') lp.end = null; else lp.start = null;
    setStatus('The end must be after the start: set the other end of loop ' + (i + 1) + ' again.', true);
  }
  refreshLoop(i); saveLoops();
  if (mode === i && playing && lp.start != null && lp.end != null) sendLoop(i);
}
function nudge(i, which, dir) {
  if (!audio) return;
  const lp = loops[i];
  let v = (lp[which] == null ? curSec : lp[which]) + dir * (+$('#nudge').value);
  v = Math.round(clamp(v, 0, audio.duration) * 1000) / 1000;
  const other = which === 'start' ? lp.end : lp.start;
  if (other != null) v = which === 'start' ? Math.min(v, other - 0.05) : Math.max(v, other + 0.05);
  if (v < 0 || v > audio.duration) return;
  setBound(i, which, v);
}
function holdRepeat(btn, fn) {
  let first = null, repeat = null;
  const stop = () => { clearTimeout(first); clearInterval(repeat); first = repeat = null; };
  btn.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    const ae = document.activeElement;
    if (ae && ae !== btn && ae.tagName === 'INPUT' && ae.type === 'text') ae.blur();
    stop(); fn();
    first = setTimeout(() => { repeat = setInterval(fn, 80); }, 400);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(n => btn.addEventListener(n, stop));
  btn.addEventListener('click', ev => { if (ev.detail === 0) fn(); });
}
function refreshLoop(i, force = false) {
  const lp = loops[i], e = loopEls[i];
  e.ts.value = lp.start == null ? '' : fmt(lp.start);
  e.te.value = lp.end == null ? '' : fmt(lp.end);
  e.sp.value = lp.speed; e.spv.textContent = pct(lp.speed);
}
const storeKey = () => audio ? 'loops|' + audio.name + '|' + audio.duration.toFixed(1) : null;
function saveLoops() { const k = storeKey(); if (!k) return; try { localStorage.setItem(k, JSON.stringify(loops)); } catch (e) {} }
function restoreLoops() {
  loops.forEach(l => { l.start = l.end = null; l.speed = 1; });
  try {
    const k = storeKey(), s = k && localStorage.getItem(k);
    if (s) JSON.parse(s).forEach((l, i) => { if (loops[i]) Object.assign(loops[i], { start: l.start, end: l.end, speed: l.speed || 1 }); });
  } catch (e) {}
  loops.forEach((_, i) => refreshLoop(i, true));
}

function refreshUI() {
  $('#playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
  loopEls.forEach((e, i) => {
    const on = playing && mode === i;
    e.c.classList.toggle('on', on); e.lp.textContent = on ? '■' : '▶';
  });
}
$('#file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; loadFiles(f); };
$('#tracks').onchange = e => { const t = tracks[+e.target.value]; if (t && t !== audio) activateTrack(t); };
$('#searchBtn').onclick = doSearch;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.addEventListener('click', e => { const bt = e.target.closest && e.target.closest('button'); if (bt && e.detail > 0) bt.blur(); });
document.addEventListener('click', e => { if (!results.hidden && !results.contains(e.target) && e.target.id !== 'searchBtn' && e.target.id !== 'q') hideResults(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideResults(); if (plOpen) { plOpen = false; renderPl(); } } });
document.addEventListener('click', e => { if (plOpen && !e.composedPath().some(n => n.id === 'plPanel' || n.id === 'plBtns')) { plOpen = false; renderPl(); } });
$('#playBtn').onclick = togglePlay;
$('#toStart').onclick = () => { if (audio) { if (typeof mode === 'number') seekClick(0); else seekTo(0); } };
$('#speed').oninput = e => { mainSpeed = +e.target.value; $('#speedV').textContent = pct(mainSpeed); if (typeof mode !== 'number') applyParams(); };
$('#speedR').onclick = () => { $('#speed').value = 1; $('#speed').oninput({ target: $('#speed') }); };
const fmtS = v => (v > 0 ? '+' : '') + v;
$('#semis').oninput = e => { semis = +e.target.value; $('#semisV').textContent = fmtS(semis) + ' st'; applyParams(); };
$('#cents').oninput = e => { cents = +e.target.value; $('#centsV').textContent = fmtS(cents) + ' ct'; applyParams(); };
$('#semisR').onclick = () => { $('#semis').value = 0; $('#semis').oninput({ target: $('#semis') }); };
$('#centsR').onclick = () => { $('#cents').value = 0; $('#cents').oninput({ target: $('#cents') }); };
$('#win').onchange = e => { winMs = +e.target.value; if (ready) post({ type: 'window', ms: winMs }); };
$('#vol').oninput = e => { volume = +e.target.value; if (master) master.gain.value = volume; };
document.querySelectorAll('#saxSeg button').forEach(b => { b.onclick = () => setSaxLevel(+b.dataset.l); });
$('#saxType').onchange = onSaxType;

window.addEventListener('keydown', e => {
  const t = e.target, tag = t.tagName;
  if (tag === 'SELECT' || (tag === 'INPUT' && t.type !== 'range')) return;
  if (tag === 'BUTTON' && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft' && audio) { e.preventDefault(); seekClick(curSec - 5); }
  else if (e.key === 'ArrowRight' && audio) { e.preventDefault(); seekClick(curSec + 5); }
  else if (e.key === 's' || e.key === 'S') setSaxLevel((saxLevel + 1) % 4);
  else if (/^[0-9]$/.test(e.key)) { const idx = e.key === '0' ? 9 : +e.key - 1; if (idx < LOOP_COUNT) playLoop(idx); }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dropping'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('dropping'); }));
document.addEventListener('drop', e => { const f = [...e.dataTransfer.files]; if (f.length) loadFiles(f); });

buildPlBtns(); saxInfo(); buildLoops(); refreshUI(); computePeaks(); if (isWeb && !isHosted) detectHelper(); requestAnimationFrame(draw);
</script>
