<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bass Rodeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16141f;
    --paper: #f1e6c8;
    --yellow: #f2b632;
    --red: #e2522b;
    --teal: #2aa3b5;
    --muted: #9a93ad;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #0d0c14;
    color: var(--paper);
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; display: flex; flex-direction: column; align-items: center; }

  #stage {
    position: relative;
    width: min(100%, calc((100vh - 118px) * 16 / 9));
    min-width: min(100%, 420px);
    aspect-ratio: 16 / 9;
    border: 3px solid #05040a;
    box-shadow: 0 0 0 2px var(--paper), 10px 12px 0 rgba(0,0,0,.6);
    overflow: hidden;
    background: #000;
  }
  #stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; box-shadow: none; }
  #stage:fullscreen canvas { object-fit: contain; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; pointer-events: none; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  #stats {
    top: 10px; left: 10px;
    background: var(--ink); color: var(--paper);
    border-left: 5px solid var(--yellow);
    padding: 4px 12px 4px 10px;
    font-size: clamp(.8rem, 1.5vw, 1.15rem);
    box-shadow: 3px 3px 0 rgba(0,0,0,.55);
  }
  #pips { top: 10px; right: 10px; display: flex; gap: 6px; background: var(--ink); padding: 7px 10px; box-shadow: 3px 3px 0 rgba(0,0,0,.55); }
  .pip { width: 15px; height: 15px; background: var(--yellow); border: 2px solid #05040a; transform: skewX(-14deg); }
  .pip.lost { background: #3a3646; }
  #heardBox {
    bottom: 10px; left: 10px;
    background: var(--ink); color: var(--paper);
    padding: 4px 12px; min-width: 150px;
    border-left: 5px solid var(--teal);
    font-size: clamp(.75rem, 1.3vw, 1rem);
    box-shadow: 3px 3px 0 rgba(0,0,0,.55);
  }
  #meter { margin-top: 4px; height: 4px; background: rgba(255,255,255,.18); }
  #meterFill { height: 100%; width: 0; background: var(--yellow); }
  #msg {
    bottom: 12px; left: 50%;
    transform: translateX(-50%) rotate(-.6deg);
    max-width: 60%; text-align: center;
    background: #f4d35e; color: var(--ink);
    border: 3px solid #05040a; padding: 5px 18px;
    font-size: clamp(.95rem, 2vw, 1.5rem);
    letter-spacing: .05em;
    box-shadow: 5px 5px 0 #05040a;
    transition: opacity .25s;
  }
  #msg.hidden { opacity: 0; }
  #msg.ok { background: #8fd9c0; }
  #msg.warn { background: #f2a03d; }
  #msg.bad { background: #ee6a4a; color: #fff3dc; }

  #bar {
    width: min(100%, 1700px);
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: stretch;
    margin-top: 12px;
  }
  .grp {
    display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    background: var(--ink);
    border: 2px solid rgba(241,230,200,.25);
    border-top: 3px solid var(--yellow);
    padding: 5px 10px 6px;
    min-width: 110px;
  }
  .lab { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--yellow); font-weight: 700; }
  .val { display: flex; align-items: center; gap: 8px; }
  .val b { min-width: 46px; text-align: center; font-size: 1.15rem; letter-spacing: .06em; }
  .grp em { font-style: normal; font-size: .72rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; min-height: 1em; }

  button {
    font: 700 .95rem "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
    color: var(--ink); background: var(--paper);
    border: 2px solid #05040a; border-radius: 0;
    padding: 4px 11px;
    box-shadow: 3px 3px 0 #05040a;
  }
  button:hover { background: #fff6dc; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #05040a; }
  button.dim { opacity: .4; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .val button { padding: 2px 9px; }
  #play {
    align-self: center;
    font: 400 1.7rem Anton, Impact, sans-serif; letter-spacing: .08em;
    padding: 6px 30px 4px;
    background: var(--red); color: #fff3dc;
    transform: skewX(-8deg);
    box-shadow: 4px 4px 0 #05040a;
  }
  #play:hover { background: #f0643a; }
  #play:active { transform: skewX(-8deg) translate(2px, 2px); }
  #play.on { background: #7d2616; }
  #full { align-self: center; padding: 6px 12px; font-size: 1.1rem; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1600" height="900"></canvas>
    <div id="stats" class="hud">Encerts 0/0 · Ratxa 0 · Rècord 0</div>
    <div id="pips" class="hud" title="Oportunitats"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
    <div id="heardBox" class="hud"><div id="heard">Sento: —</div><div id="meter"><div id="meterFill"></div></div></div>
    <div id="msg" class="hud hidden"></div>
  </div>

  <div id="bar">
    <button id="play" type="button">▶ Juga</button>

    <div class="grp">
      <span class="lab">Posició</span>
      <div class="val"><button id="posDown" type="button">◀</button><b id="posVal">1a</b><button id="posUp" type="button">▶</button></div>
      <em id="posDesc"></em>
    </div>

    <div class="grp">
      <span class="lab">Dificultat</span>
      <div class="val"><button id="lvDown" type="button">◀</button><b id="lvVal">1</b><button id="lvUp" type="button">▶</button></div>
      <em id="lvDesc"></em>
    </div>

    <div class="grp">
      <span class="lab">Alteracions</span>
      <div class="val"><button id="acc" type="button">♯ Sostinguts</button></div>
      <em>Des del nivell 2</em>
    </div>

    <div class="grp">
      <span class="lab">Baix</span>
      <div class="val"><button id="strings" type="button">4 cordes</button></div>
      <em>Mi La Re Sol</em>
    </div>

    <div class="grp">
      <span class="lab">Octava</span>
      <div class="val"><button id="oct" type="button">Exacta</button></div>
      <em id="octDesc"></em>
    </div>

    <div class="grp">
      <span class="lab">Nom de la nota</span>
      <div class="val"><button id="hint" type="button">Amagat</button></div>
      <em>Sobre l'ocell</em>
    </div>

    <button id="full" type="button" title="Pantalla completa (Espai = juga / atura)">⛶</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ */
  /*  Constants & helpers                                               */
  /* ------------------------------------------------------------------ */
  const W = 1600, H = 900, HORIZON = 640, TAU = Math.PI * 2;
  const OUT = "#16141f";          // ink
  const SHADOW = "#252a5a";       // cel-shading colour
  const STAFF = { x1: 290, x2: 1500, bottom: 570, gap: 54 };
  const lineY = k => STAFF.bottom - k * STAFF.gap;
  const stepY = s => STAFF.bottom - s * STAFF.gap / 2;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function parseColor(s) {
    if (s[0] === "#") {
      let h = s.slice(1);
      if (h.length === 3) h = h.split("").map(c => c + c).join("");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    const m = s.match(/[\d.]+/g);
    return [+m[0], +m[1], +m[2]];
  }
  function mix(a, b, t) {
    const A = parseColor(a), B = parseColor(b);
    return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")";
  }
  const shade = (c, f) => mix(c, "#0c0b18", f);
  const light = (c, f) => mix(c, "#ffffff", f);

  /* ------------------------------------------------------------------ */
  /*  Settings                                                          */
  /* ------------------------------------------------------------------ */
  const KEY = "bassRodeo.v2";
  const S = { v: 0, pos: 1, level: 1, acc: "sharp", strings: 4, strict: false, hint: false, lastPhase: "" };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (S.v !== 3) { S.strict = false; S.v = 3; }
  S.pos = clamp(Math.round(S.pos) || 1, 1, 13);
  S.level = clamp(Math.round(S.level) || 1, 1, 5);
  S.acc = S.acc === "flat" ? "flat" : "sharp";
  S.strings = S.strings === 5 ? 5 : 4;
  function saveS() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ------------------------------------------------------------------ */
  /*  Music theory                                                      */
  /* ------------------------------------------------------------------ */
  const NAT = { 0: "C", 2: "D", 4: "E", 5: "F", 7: "G", 9: "A", 11: "B" };
  const LIDX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  const SOL = { C: "Do", D: "Re", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si" };
  const STRING_NAME = { 23: "Si", 28: "Mi", 33: "La", 38: "Re", 43: "Sol" };
  const SHARP_ORDER = [6, 1, 8, 3, 10];
  const FLAT_ORDER = [10, 3, 8, 1, 6];
  const LEVEL_COUNT = [0, 1, 2, 4, 5];

  // The bass sounds an octave below where it is written, so the written
  // note (clef de fa) is the sounding MIDI note + 12.
  function spell(midi, mode) {
    const pc = ((midi % 12) + 12) % 12;
    let letter, a = 0, base = midi;
    if (NAT[pc] !== undefined) letter = NAT[pc];
    else if (mode === "sharp") { a = 1; base = midi - 1; letter = NAT[(pc + 11) % 12]; }
    else { a = -1; base = midi + 1; letter = NAT[(pc + 1) % 12]; }
    const written = base + 12;
    const oct = Math.floor(written / 12) - 1;
    const dn = oct * 7 + LIDX[letter];
    return { letter, acc: a, oct, dn, step: dn - 18, pc };
  }
  const accSym = a => (a === 1 ? "♯" : a === -1 ? "♭" : "");
  const noteLabel = sp => SOL[sp.letter] + accSym(sp.acc) + " (" + sp.letter + accSym(sp.acc) + ")";
  const shortName = midi => { const sp = spell(midi, S.acc); return SOL[sp.letter] + accSym(sp.acc); };
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

  const stringList = () => (S.strings === 5 ? [23, 28, 33, 38, 43] : [28, 33, 38, 43]);
  function fretRange() {
    if (S.pos === 13) return [0, 15];
    if (S.pos === 1) return [0, 4];
    return [S.pos, S.pos + 3];
  }
  function allowedPCs() {
    const set = new Set([0, 2, 4, 5, 7, 9, 11]);
    const order = S.acc === "sharp" ? SHARP_ORDER : FLAT_ORDER;
    for (let i = 0; i < LEVEL_COUNT[S.level - 1]; i++) set.add(order[i]);
    return set;
  }
  function candidates() {
    const [f0, f1] = fretRange();
    const al = allowedPCs();
    const map = new Map();
    stringList().forEach(open => {
      for (let f = f0; f <= f1; f++) {
        const midi = open + f;
        if (al.has(midi % 12)) {
          if (!map.has(midi)) map.set(midi, []);
          map.get(midi).push({ open, f });
        }
      }
    });
    return map;
  }
  function levelDesc() {
    if (S.level === 1) return "Només naturals";
    if (S.level === 5) return "Cromàtic";
    const names = S.acc === "sharp" ? ["F♯", "C♯", "G♯", "D♯", "A♯"] : ["B♭", "E♭", "A♭", "D♭", "G♭"];
    return "+ " + names.slice(0, LEVEL_COUNT[S.level - 1]).join(" ");
  }

  /* ------------------------------------------------------------------ */
  /*  Time of day (picked at random on every start)                     */
  /* ------------------------------------------------------------------ */
  const PHASES = [
    { id: "alba", sky: ["#2b3a73", "#6d6aa8", "#e68a86", "#ffc58f"], sx: 0.22, sy: 0.66, disk: true, sunColor: "#fff0b0", stars: 0.35,
      tint: "rgba(255,150,120,0.20)", dark: 0, shadowLen: 2.2, dir: 1, shadowAlpha: 0.34, glow: "255,170,110", glowA: 0.55, rays: true,
      cloud: "#ffd9c8", cloudShade: "#a8789e", vig: 0.34, halo: 0.14, haze: "rgba(255,200,170,0.30)" },
    { id: "mati", sky: ["#1f8fb0", "#58bfcf", "#a8e3dc", "#f3e6c0"], sx: 0.2, sy: 0.27, disk: true, sunColor: "#fff6c0", stars: 0,
      tint: "rgba(255,240,200,0.07)", dark: 0, shadowLen: 1.3, dir: 1, shadowAlpha: 0.32, glow: "255,240,190", glowA: 0.4, rays: false,
      cloud: "#f7edd2", cloudShade: "#7fa9c0", vig: 0.3, halo: 0, haze: "rgba(235,245,235,0.32)" },
    { id: "migdia", sky: ["#1b86b4", "#3fb0c9", "#8fd6d8", "#d8efe0"], sx: 0.5, sy: 0.12, disk: true, sunColor: "#fffbd0", stars: 0,
      tint: "rgba(255,255,230,0.03)", dark: 0, shadowLen: 0.3, dir: 1, shadowAlpha: 0.3, glow: "255,255,220", glowA: 0.3, rays: false,
      cloud: "#fcf4de", cloudShade: "#8db9cc", vig: 0.26, halo: 0, haze: "rgba(235,248,240,0.30)" },
    { id: "tarda", sky: ["#2a8bb8", "#6dc0cc", "#f2dca4", "#f7c98a"], sx: 0.78, sy: 0.3, disk: true, sunColor: "#fff2b8", stars: 0,
      tint: "rgba(255,190,110,0.14)", dark: 0, shadowLen: 1.4, dir: -1, shadowAlpha: 0.32, glow: "255,215,140", glowA: 0.5, rays: true,
      cloud: "#fcebc9", cloudShade: "#b98e86", vig: 0.32, halo: 0, haze: "rgba(255,225,180,0.30)" },
    { id: "posta", sky: ["#27235e", "#7d3f7c", "#e8644a", "#ffb347"], sx: 0.76, sy: 0.6, disk: true, sunColor: "#fff2a0", stars: 0.15,
      tint: "rgba(255,95,40,0.30)", dark: 0, shadowLen: 3, dir: -1, shadowAlpha: 0.42, glow: "255,130,50", glowA: 0.65, rays: true,
      cloud: "#ffb184", cloudShade: "#8f3f66", vig: 0.38, halo: 0.12, haze: "rgba(255,170,110,0.32)" },
    { id: "vespre", sky: ["#0f1538", "#2d3a82", "#8a4f93", "#e8806f"], sx: 0.12, sy: 0.74, disk: false, sunColor: "#fff", stars: 0.6,
      tint: "rgba(70,60,150,0.40)", dark: 0.08, shadowLen: 0.8, dir: 1, shadowAlpha: 0.2, glow: "240,120,110", glowA: 0.5, rays: false,
      cloud: "#8b6fb0", cloudShade: "#3d3678", vig: 0.42, halo: 0.3, haze: "rgba(200,120,150,0.25)", lit: true },
    { id: "nit", sky: ["#050a1c", "#0b1a45", "#183a72"], sx: 0.34, sy: 0.2, disk: false, moon: true, sunColor: "#fff", stars: 1,
      tint: "rgba(20,40,130,0.50)", dark: 0.18, shadowLen: 1.2, dir: 1, shadowAlpha: 0.18, glow: "150,180,255", glowA: 0.25, rays: false,
      cloud: "#2f4378", cloudShade: "#141f48", vig: 0.46, halo: 0.5, haze: "rgba(60,90,170,0.25)", lit: true }
  ];

  /* ------------------------------------------------------------------ */
  /*  Canvases                                                          */
  /* ------------------------------------------------------------------ */
  const mkCanvas = (w, h) => { const d = document.createElement("canvas"); d.width = w; d.height = h; return d; };
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const skyC = mkCanvas(W, H), landC = mkCanvas(W, H), bgC = mkCanvas(W, H);
  const bgX = bgC.getContext("2d", { willReadFrequently: true });

  let P = PHASES[1];
  let sunPos = { x: 0, y: 0 };
  let SV = { x: 0.55, y: 0.83 };       // direction the shadows fall to
  let ART = Math.random;               // seeded generator for the static art
  let grainPat = null;
  let stars = [];
  let clouds = [];
  let cloudLum = 0.8;
  const TONE_SPLIT = 0.47;
  const rr = () => ART();
  const jit = a => (ART() - 0.5) * 2 * a;

  /* ------------------------------------------------------------------ */
  /*  Ink toolkit: hand-inked contours, tapered strokes, hatching       */
  /* ------------------------------------------------------------------ */
  function wob(pts, step, amp, closed) {
    const n = pts.length, out = [], m = closed ? n : n - 1;
    for (let i = 0; i < m; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), k = Math.max(1, Math.round(len / step));
      for (let j = 0; j < k; j++) {
        const t = j / k, f = j === 0 ? 0.3 : 1;
        out.push([a[0] + dx * t + jit(amp) * f, a[1] + dy * t + jit(amp) * f]);
      }
    }
    if (!closed) out.push([pts[n - 1][0], pts[n - 1][1]]);
    return out;
  }
  function polyPath(c, pts, closed) {
    c.beginPath();
    pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
    if (closed !== false) c.closePath();
  }
  function vGrad(c, y0, y1, c0, c1) {
    const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g;
  }
  function hGrad(c, x0, x1, c0, c1) {
    const g = c.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, c0); g.addColorStop(1, c1); return g;
  }
  // Closed contour whose thickness grows on the side facing away from the light
  // (classic comic inking: heavier line where the shadow is).
  function inkRing(c, pts, base, color) {
    const n = pts.length; if (n < 3) return;
    let area = 0;
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
    const sg = area > 0 ? 1 : -1, nor = [];
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      nor.push(sg > 0 ? [dy, -dx] : [-dy, dx]);
    }
    const outer = [], inner = [];
    for (let i = 0; i < n; i++) {
      const n1 = nor[(i - 1 + n) % n], n2 = nor[i];
      let nx = n1[0] + n2[0], ny = n1[1] + n2[1]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const miter = 1 / Math.max(0.6, nx * n2[0] + ny * n2[1]);
      const sb = Math.max(0, nx * SV.x + ny * SV.y);
      const w = base * 0.6 * (0.55 + 1.0 * sb) * (0.85 + 0.3 * rr()) * miter;
      outer.push([pts[i][0] + nx * w * 0.62, pts[i][1] + ny * w * 0.62]);
      inner.push([pts[i][0] - nx * w * 0.38, pts[i][1] - ny * w * 0.38]);
    }
    c.beginPath();
    outer.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]))); c.closePath();
    for (let i = n - 1; i >= 0; i--) (i === n - 1 ? c.moveTo(inner[i][0], inner[i][1]) : c.lineTo(inner[i][0], inner[i][1]));
    c.closePath();
    c.fillStyle = color || OUT; c.fill("evenodd");
  }
  // Open brush stroke with tapered ends (uses the current fillStyle).
  // mode: "both" (pointed at both ends), "tail" (thick start, thin end), "none"
  function inkLine(c, pts, w, mode) {
    const n = pts.length; if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[Math.min(i + 1, n - 1)];
      let dx = p1[0] - p0[0], dy = p1[1] - p0[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const t = i / (n - 1);
      const k = mode === "none" ? 1 : mode === "tail" ? Math.max(0.12, 1 - Math.pow(t, 1.3)) : Math.pow(Math.sin(Math.PI * t), 0.55);
      const ww = Math.max(0.25, w * k * (0.85 + 0.3 * rr())) / 2;
      L.push([pts[i][0] - dy * ww, pts[i][1] + dx * ww]);
      R.push([pts[i][0] + dy * ww, pts[i][1] - dx * ww]);
    }
    c.beginPath();
    L.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
    for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
    c.closePath(); c.fill();
  }
  function taper(c, x0, y0, x1, y1, w) {

  // Hand-drawn parallel hatching inside the clip regions.
  function hatch(c, clips, bb, spacing, ang, w, color, alpha, dens) {
    c.save();
    clips.forEach(fn => { fn(); c.clip(); });
    c.fillStyle = color; c.globalAlpha = alpha;
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2, Rd = Math.hypot(bb[2] - bb[0], bb[3] - bb[1]) / 2 + 4;

      let t = -Rd;
      while (t < Rd) {

    }
    c.restore();
  }
  function shadeRegion(c, clips, color, alpha) {
    c.save(); clips.forEach(fn => { fn(); c.clip(); });
    c.globalAlpha = alpha; c.fillStyle = color; c.fillRect(0, 0, W, H); c.restore();
  }
  function groundShadow(c, x, y, len) {
    c.save(); c.globalAlpha = P.shadowAlpha; c.fillStyle = OUT;
    c.beginPath(); c.ellipse(x + P.dir * len * 0.5, y + 3, len * 0.55 + 12, 9, 0, 0, TAU); c.fill(); c.restore();
  }
  function makeGrain() {
    const d = mkCanvas(256, 256), c = d.getContext("2d"), id = c.createImageData(256, 256);
    for (let i = 0; i < 256 * 256; i++) {
      const v = Math.floor(Math.random() * 255);
      id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;

  const lumOf = col => { const q = parseColor(col); return (0.2126 * q[0] + 0.7152 * q[1] + 0.0722 * q[2]) / 255; };

  /* ------------------------------------------------------------------ */
  /*  Clouds: inked cumulus sprites, 3-tone cel shading + hatching      */
  /* ------------------------------------------------------------------ */
  function makeCloud(wid, hei, lumps) {
    const d = mkCanvas(wid, hei), c = d.getContext("2d");
    const base = hei - 16, cs = [];
    for (let i = 0; i < lumps; i++) {
      const t = (i + 0.5) / lumps, bump = Math.sin(Math.PI * t);
      const r = hei * (0.12 + 0.17 * bump) * (0.75 + rr() * 0.5);
      cs.push({ x: 20 + t * (wid - 40) + jit(8), y: base - r * 0.85 - bump * hei * 0.1 * rr(), r });
    }
    const top = cs.slice();
    top.forEach(o => { if (rr() < 0.75) cs.push({ x: o.x + jit(o.r * 0.5), y: o.y - o.r * 0.7, r: o.r * (0.55 + rr() * 0.2) }); });
    const circ = (o, dx, dy, k) => { c.beginPath(); c.arc(o.x + dx, o.y + dy, o.r * (k || 1), 0, TAU); };

    c.fillStyle = OUT; c.strokeStyle = OUT; c.lineJoin = "round";
    c.lineWidth = 7; cs.forEach(o => { circ(o, 2, 3); c.stroke(); });
    c.lineWidth = 4.6; cs.forEach(o => { circ(o, 0, 0); c.stroke(); });
    // shade tone
    c.fillStyle = P.cloudShade; cs.forEach(o => { circ(o, 0, 0); c.fill(); });
    c.save();
    c.beginPath(); cs.forEach(o => { c.moveTo(o.x + o.r, o.y); c.arc(o.x, o.y, o.r, 0, TAU); }); c.clip();
    // mid tone (lit side)
    const lx = -P.dir, g = vGrad(c, 0, hei, light(P.cloud, 0.15), P.cloud);
    c.fillStyle = g; cs.forEach(o => { circ(o, lx * o.r * 0.2, -o.r * 0.24, 0.97); c.fill(); });
    // highlight tone
    c.fillStyle = light(P.cloud, 0.4); cs.forEach(o => { circ(o, lx * o.r * 0.38, -o.r * 0.42, 0.62); c.fill(); });
    // interior contour of the billows (thin, tapered)
    c.fillStyle = OUT; c.globalAlpha = 0.6;
    cs.forEach(o => {
      if (rr() < 0.25) return;
      const a0 = P.dir > 0 ? 0.05 : Math.PI * 0.25, pts = [];
      for (let k = 0; k <= 8; k++) { const a = a0 + (k / 8) * Math.PI * 0.7; pts.push([o.x + Math.cos(a) * o.r * 0.97, o.y + Math.sin(a) * o.r * 0.97]); }
      inkLine(c, pts, 2.4, "both");
    });
    c.globalAlpha = 1;
    c.restore();
    // hatching in the shaded belly of the cloud
    const union = () => { c.beginPath(); cs.forEach(o => { c.moveTo(o.x + o.r, o.y); c.arc(o.x, o.y, o.r, 0, TAU); }); };
    hatch(c, [union, () => { c.beginPath(); c.rect(0, hei * 0.58, wid, hei); }], [0, hei * 0.58, wid, hei], 6.5, P.dir > 0 ? 1.0 : 2.15, 1.3, shade(P.cloudShade, 0.45), 0.4, 0.6);
    return d;
  }
  function drawClouds(c) {
    clouds.forEach(cl => c.drawImage(cl.sp, cl.x, cl.y, cl.sp.width * cl.s, cl.sp.height * cl.s));
  }
  function updateClouds(dt) {
    clouds.forEach(cl => {
      cl.x += cl.v * dt;
      if (cl.x > W + 40) { cl.x = -cl.sp.width * cl.s - 40; cl.y = 30 + Math.random() * 250; }
    });
  }
  function lumAt(x, y) {
    const x0 = clamp(Math.round(x - 40), 0, W - 80), y0 = clamp(Math.round(y - 26), 0, H - 52);
    const d = bgX.getImageData(x0, y0, 80, 52).data;
    let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 16) { s += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; n++; }

  function inCloud(x, y) {
    for (const cl of clouds) {
      const w = cl.sp.width * cl.s, h = cl.sp.height * cl.s;
      if (x > cl.x + w * 0.08 && x < cl.x + w * 0.92 && y > cl.y + h * 0.2 && y < cl.y + h * 0.9) return true;
    }
    return false;
  }

  /* ---------------------------- sky ---------------------------------- */
  function buildSky() {
    const c = skyC.getContext("2d");
    c.clearRect(0, 0, W, H);
    const g = c.createLinearGradient(0, 0, 0, HORIZON + 30);
    P.sky.forEach((col, i) => g.addColorStop(i / (P.sky.length - 1), col));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // painterly streaks
    for (let i = 0; i < 170; i++) {
      const y = rr() * HORIZON, x = rr() * W, ww = 140 + rr() * 420, hh = 3 + rr() * 9;
      c.globalAlpha = 0.035 + rr() * 0.05; c.fillStyle = rr() < 0.5 ? "#ffffff" : P.sky[0];
      c.beginPath(); c.ellipse(x, y, ww / 2, hh / 2, jit(0.05), 0, TAU); c.fill();
    }
    c.globalAlpha = 1;

    const sx = P.sx * W, sy = P.sy * H;
    sunPos = { x: sx, y: sy };
    if (P.rays) {
      for (let i = 0; i < 18; i++) {
        const a = i * TAU / 18 + 0.1, w = 0.05;
        c.fillStyle = i % 2 ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.12)";
        c.beginPath(); c.moveTo(sx, sy);
        c.lineTo(sx + Math.cos(a - w) * 1800, sy + Math.sin(a - w) * 1800);
        c.lineTo(sx + Math.cos(a + w) * 1800, sy + Math.sin(a + w) * 1800);
        c.closePath(); c.fill();
      }
    }
    const gg = c.createRadialGradient(sx, sy, 10, sx, sy, 440);
    gg.addColorStop(0, "rgba(" + P.glow + ",0.85)"); gg.addColorStop(1, "rgba(" + P.glow + ",0)");
    c.fillStyle = gg; c.fillRect(0, 0, W, H);

    const disc = (x, y, r) => { const pts = []; for (let i = 0; i < 48; i++) { const a = i / 48 * TAU; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } return wob(pts, 10, 0.7, true); };
    if (P.disk) {
      const pts = disc(sx, sy, 52);
      polyPath(c, pts); c.fillStyle = P.sunColor; c.fill();
      c.fillStyle = "rgba(255,255,255,0.6)"; c.beginPath(); c.arc(sx - 14, sy - 14, 20, 0, TAU); c.fill();
      inkRing(c, pts, 3.2, OUT);
    }
    if (P.moon) {
      const pts = disc(sx, sy, 48);
      polyPath(c, pts); c.fillStyle = "#f2ecd2"; c.fill();
      c.fillStyle = "#c9c0a0";
      [[-14, -10, 11], [16, 8, 14], [-8, 22, 7], [20, -22, 6]].forEach(([a, b, r]) => { c.beginPath(); c.arc(sx + a, sy + b, r, 0, TAU); c.fill(); });
      hatch(c, [() => polyPath(c, pts)], [sx - 50, sy - 50, sx + 50, sy + 50], 5, 1.0, 1.4, "#3b3a50", 0.35, 0.7);
      inkRing(c, pts, 3.2, OUT);
    }
    // big cloud banks near the horizon
    for (let i = 0; i < 0; i++) {
      const sp = makeCloud(1000, 420, 13);
      const s = 0.8 + rr() * 0.25;
      c.drawImage(sp, -120 + i * 590 + jit(60), HORIZON - 300 * s - 40 + jit(30), sp.width * s, sp.height * s);
    }
  }

  /* ---------------------------- land --------------------------------- */
  function drawMountains(c) {
    const base = HORIZON + 8;
    const layers = [
      { col: "#a9bfd4", hMin: 130, hMax: 270, ink: 1.8, a: 0.32 },
      { col: "#8aa2bf", hMin: 70, hMax: 190, ink: 2.4, a: 0.48 }
    ];
    layers.forEach(Ly => {
      const pts = []; let x = -70, up = true;
      while (x < W + 130) {
        pts.push({ x, y: up ? base - (Ly.hMin + rr() * (Ly.hMax - Ly.hMin)) : base - (8 + rr() * 40), peak: up });
        x += 60 + rr() * 110; up = !up;
      }
      const poly = [[-90, base + 40]].concat(pts.map(p => [p.x, p.y]), [[W + 140, base + 40]]);
      const wp = wob(poly, 13, 2.4, true);
      const path = () => polyPath(c, wp);
      path(); c.fillStyle = vGrad(c, base - 270, base + 10, light(Ly.col, 0.22), Ly.col); c.fill();
      pts.forEach((p, i) => {
        if (!p.peak) return;
        const nb = pts[i + P.dir]; if (!nb) return;
        const reg = () => { c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(nb.x, nb.y); c.lineTo(nb.x, base + 40); c.lineTo(p.x, base + 40); c.closePath(); };
        shadeRegion(c, [path, reg], SHADOW, Ly.a);
        hatch(c, [path, reg], [Math.min(p.x, nb.x), p.y, Math.max(p.x, nb.x), base], 6, P.dir > 0 ? 1.05 : 2.1, 1.6, OUT, 0.4, 0.8);
        c.save(); path(); c.clip(); c.fillStyle = SHADOW; c.globalAlpha = 0.45;
        for (let k = 0; k < 3; k++) {
          const rx = lerp(p.x, nb.x, 0.12 + k * 0.1), ry = lerp(p.y, nb.y, 0.12 + k * 0.1) + 8;
          const pp = []; for (let q = 0; q <= 5; q++) pp.push([rx + jit(5) + q * P.dir * 2, ry + q * (14 + rr() * 8)]);
          inkLine(c, pp, 3, "tail");
        }
        c.restore();
      });
      inkRing(c, wp, Ly.ink, OUT);
    });
    // atmospheric haze at the foot of the mountains (only on painted pixels)
    c.save(); c.globalCompositeOperation = "source-atop";
    c.fillStyle = vGrad(c, base - 220, base + 10, "rgba(255,255,255,0)", P.haze); c.fillRect(0, base - 220, W, 240);
    c.restore();
  }

  function drawMesa(c, x, w, h, base) {
    const rel = [[0, 0.25], [0.03, -0.2], [0.04, -0.5], [0.1, -0.56], [0.12, -0.92], [0.2, -1], [0.5, -0.97], [0.8, -1], [0.88, -0.94], [0.9, -0.57], [0.96, -0.5], [0.98, -0.2], [1, 0.25]];
    const pts = wob(rel.map(([a, b]) => [x + a * w, base + b * h]), 11, 2.4, true);
    const path = () => polyPath(c, pts);
    path(); c.fillStyle = vGrad(c, base - h, base, "#ee9a5c", "#c9622f"); c.fill();
    c.save(); path(); c.clip();
    // strata bands
    for (let i = 0; i < 9; i++) {
      const yy = base - h * (0.04 + i * 0.115) + jit(5), line = [];
      for (let k = 0; k <= 12; k++) line.push([x - 6 + (w + 12) * k / 12, yy + jit(3.5)]);
      c.globalAlpha = 0.5; c.fillStyle = i % 2 ? "#97431f" : "#f8b97c";
      inkLine(c, line, 5 + rr() * 11, "both");
    }
    // vertical erosion grooves
    c.fillStyle = "#6a2a10"; c.globalAlpha = 0.55;
    for (let k = 0; k < w / 20; k++) {
      const gx = x + w * (0.05 + 0.9 * rr()), gy = base - h * (0.5 + rr() * 0.45), len = h * (0.2 + rr() * 0.45), pp = [];
      for (let q = 0; q <= 5; q++) pp.push([gx + jit(2.5) + q * jit(1), gy + len * q / 5]);
      inkLine(c, pp, 2 + rr() * 3, "tail");
    }
    c.globalAlpha = 1;
    c.restore();
    // shadow side, hatching and cross-hatching
    const sx0 = P.dir > 0 ? x + w * 0.5 : x - 20, sw = w * 0.5 + 20;
    const reg = () => { c.beginPath(); c.rect(sx0, base - h - 20, sw, h + 80); };
    const bb = [sx0, base - h, sx0 + sw, base];
    shadeRegion(c, [path, reg], SHADOW, 0.5);
    hatch(c, [path, reg], bb, 5, P.dir > 0 ? 1.2 : 1.95, 1.7, OUT, 0.5, 0.85);
    hatch(c, [path, reg, () => { c.beginPath(); c.rect(x - 10, base - h * 0.36, w + 20, h); }], bb, 6, P.dir > 0 ? -0.6 : -2.5, 1.5, OUT, 0.4, 0.7);
    // rim light on the sunny top edge
    c.save(); path(); c.clip(); c.fillStyle = "#ffe0b0"; c.globalAlpha = 0.8;
    const lit = pts.filter(p => p[1] < base - h * 0.9 && (P.dir > 0 ? p[0] < x + w * 0.55 : p[0] > x + w * 0.45)).map(p => [p[0], p[1] + 3]);
    if (lit.length > 2) inkLine(c, lit, 3, "both");
    c.restore();
    inkRing(c, pts, 3.6, OUT);

    // scree skirt at the foot
    const sk = wob([[x - 40, base + 25], [x + w * 0.06, base - h * 0.18], [x + w * 0.94, base - h * 0.18], [x + w + 40, base + 25]], 10, 3, true);
    const skp = () => polyPath(c, sk);
    skp(); c.fillStyle = vGrad(c, base - h * 0.2, base + 25, "#d89c66", "#b87746"); c.fill();
    shadeRegion(c, [skp, () => { c.beginPath(); c.rect(P.dir > 0 ? x + w * 0.5 : x - 60, base - h * 0.3, w * 0.5 + 80, h); }], SHADOW, 0.45);
    hatch(c, [skp, () => { c.beginPath(); c.rect(P.dir > 0 ? x + w * 0.5 : x - 60, base - h * 0.3, w * 0.5 + 80, h); }], [x - 40, base - h * 0.2, x + w + 40, base + 25], 5, 1.3, 1.5, OUT, 0.5, 0.8);
    for (let k = 0; k < 14; k++) {
      const rx = x - 20 + rr() * (w + 40), ry = base - h * 0.14 + rr() * h * 0.16, rs = 3 + rr() * 6;
      const rp = wob([[rx - rs, ry + rs * 0.5], [rx - rs * 0.6, ry - rs * 0.6], [rx + rs * 0.6, ry - rs * 0.7], [rx + rs, ry + rs * 0.5]], 4, 0.6, true);
      polyPath(c, rp); c.fillStyle = "#c79a76"; c.fill(); inkRing(c, rp, 1.5, OUT);
    }
    inkRing(c, sk, 2.6, OUT);
    return { x, w, base };
  }

  function drawGround(c) {
    const ph = rr() * 6;
    const gTop = xx => HORIZON + Math.sin(xx * 0.006 + ph) * 9 + Math.sin(xx * 0.017) * 4;
    const top = []; for (let xx = -10; xx <= W + 10; xx += 20) top.push([xx, gTop(xx)]);
    const poly = top.concat([[W + 10, H + 10], [-10, H + 10]]);
    polyPath(c, poly); c.fillStyle = vGrad(c, HORIZON, H, "#f3ca86", "#b97a4a"); c.fill();
    for (let i = 0; i < 40; i++) {
      c.globalAlpha = 0.12; c.fillStyle = rr() < 0.5 ? "#ffe3a8" : "#8b4f32";
      c.beginPath(); c.ellipse(rr() * W, HORIZON + 30 + rr() * 240, 60 + rr() * 160, 6 + rr() * 16, jit(0.05), 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
    // haze near the horizon
    c.save(); polyPath(c, poly); c.clip();
    c.fillStyle = vGrad(c, HORIZON - 10, HORIZON + 110, P.haze, "rgba(255,255,255,0)"); c.fillRect(0, HORIZON - 10, W, 130); c.restore();
    c.fillStyle = OUT; inkLine(c, top, 4.4, "none");
    return { poly };
  }

  function drawGroundDetail(c) {
    const ink = OUT;
    // cracked earth
    c.fillStyle = "#6b3b24";
    for (let i = 0; i < 26; i++) {
      const x = rr() * W, y = 700 + rr() * 190, pp = [[x, y]];
      for (let k = 1; k < 6; k++) pp.push([pp[k - 1][0] + jit(20) + 10, pp[k - 1][1] + jit(8)]);
      c.globalAlpha = 0.5; inkLine(c, pp, 2.4, "both");
    }
    c.globalAlpha = 1;
    // pebbles
    for (let i = 0; i < 70; i++) {
      const x = rr() * W, y = HORIZON + 30 + rr() * 230, k = (y - HORIZON) / (H - HORIZON), s = 2 + k * 6 * rr();
      const pp = wob([[x - s, y + s * 0.4], [x - s * 0.5, y - s * 0.5], [x + s * 0.5, y - s * 0.6], [x + s, y + s * 0.4]], 3, 0.4, true);

      hatch(c, [() => { c.beginPath(); c.rect(0, 770 + i * 26, W, 30); }], [0, 770 + i * 26, W, 800 + i * 26], 7, -0.45, 1.5 + i * 0.25, ink, 0.18 + i * 0.07, 0.55);
    }
  }

  function drawRoad(c) {
    const bez = (a, b, cc, d, t) => { const u = 1 - t; return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * cc[0] + t * t * t * d[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * cc[1] + t * t * t * d[1]]; };
    const Ls = [], Rs = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      Ls.push(bez([480, H + 10], [560, 800], [900, 720], [870, HORIZON + 3], t));
      Rs.push(bez([1130, H + 10], [1020, 820], [1000, 730], [892, HORIZON + 3], t));
    }
    const poly = wob(Ls.concat(Rs.slice().reverse()), 12, 1.6, true);
    polyPath(c, poly); c.fillStyle = vGrad(c, HORIZON, H, "#dcb27c", "#c28f58"); c.fill();
    // ruts
    c.fillStyle = "#7a4a2c";
    [0.3, 0.7].forEach(f => {
      const line = Ls.map((p, i) => [lerp(p[0], Rs[i][0], f) + jit(1.5), lerp(p[1], Rs[i][1], f)]);
      c.globalAlpha = 0.5; inkLine(c, line, 6, "both");
    });
    c.globalAlpha = 1;
    hatch(c, [() => polyPath(c, poly)], [480, HORIZON, 1130, H], 8, 0.2, 1.4, OUT, 0.18, 0.5);
    inkRing(c, poly, 2.8, OUT);
  }

  function drawCactus(c, x, base, h) {
    const w = h * 0.14;
    groundShadow(c, x, base, h * 0.4 * P.shadowLen);
    const parts = [{ pts: [[x, base + 4], [x + jit(2), base - h * 0.5], [x + jit(2), base - h]], w }];
    const ay = base - h * (0.35 + rr() * 0.15), ah = h * (0.22 + rr() * 0.12), al = h * 0.26;
    parts.push({ pts: [[x, ay], [x - al, ay], [x - al, ay - ah]], w: w * 0.72 });
    const by = base - h * (0.5 + rr() * 0.15), bh = h * (0.2 + rr() * 0.1), bl = h * 0.24;
    parts.push({ pts: [[x, by], [x + bl, by], [x + bl, by - bh]], w: w * 0.72 });
    const stroke = (color, extra, off, wf, alpha) => {
      c.globalAlpha = alpha || 1;
      parts.forEach(p => {
        c.beginPath(); p.pts.forEach((q, i) => (i ? c.lineTo(q[0] + off, q[1]) : c.moveTo(q[0] + off, q[1])));
        c.lineWidth = p.w * wf + extra; c.strokeStyle = color; c.stroke();
      });
      c.globalAlpha = 1;
    };
    c.lineCap = "round"; c.lineJoin = "round";
    stroke(OUT, 7, P.dir * 1.2, 1); stroke(OUT, 5.2, 0, 1);

  /* ================================================================== */
  /*  REALISTIC LAYER — noise-based sky/terrain, weathered buildings.   */
  /*  Declared after the base art so these definitions take over.       */
  /* ================================================================== */
  let NZ = null, NZ2 = null;
  function makeNoise() {
    const g = new Float32Array(256), p = new Uint8Array(512), q = [];

    for (let i = 255; i > 0; i--) { const j = Math.floor(rr() * (i + 1)); const t = q[i]; q[i] = q[j]; q[j] = t; }
    for (let i = 0; i < 512; i++) p[i] = q[i & 255];
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
      const a = g[p[p[X] + Y]], b = g[p[p[X + 1] + Y]], c = g[p[p[X] + Y + 1]], d = g[p[p[X + 1] + Y + 1]];

    };

    return s / n;

  const rgbOf = s => parseColor(s);

  /* ------------------------------ SKY -------------------------------- */
  function skyColorAt(stops, t) {
    const f = clamp(t, 0, 1) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f));
    return mixc(stops[i], stops[i + 1], f - i);
  }
  function buildSky() {
    NZ = makeNoise(); NZ2 = makeNoise();
    const c = skyC.getContext("2d");
    c.clearRect(0, 0, W, H);
    const sx = P.sx * W, sy = P.sy * H; sunPos = { x: sx, y: sy };
    const gh = HORIZON + 50, stops = P.sky.map(rgbOf), cl = rgbOf(P.cloud), cs = rgbOf(P.cloudShade), gl = P.glow.split(",").map(Number);
    const w2 = 800, h2 = Math.ceil(gh / 2), lo = mkCanvas(w2, h2), lc = lo.getContext("2d"), id = lc.createImageData(w2, h2), d = id.data;
    const thr = (P.id === "migdia" ? 0.56 : P.id === "nit" ? 0.6 : 0.52) + rr() * 0.06;
    const ox = rr() * 40, oy = rr() * 40, lightVis = P.id === "nit" ? 0.55 : 1;
    const dens = (X, Y) => {
      const t = (HORIZON + 80 - Y) / (HORIZON + 80), z = 1 / Math.max(0.1, t);
      let nx = (X - W / 2) * z * 0.0034 + ox, ny = z * 1.15 + oy;

      return fbm(nx, ny, 6);

      const Y = j * 2;

        const X = i * 2, k = (j * w2 + i) * 4;
        let col = skyColorAt(stops, Y / gh);
        const ddx = X - sx, ddy = Y - sy, r2 = ddx * ddx + ddy * ddy;
        const glow = Math.exp(-r2 / (2 * 300 * 300)) * P.glowA * 0.75 + Math.exp(-r2 / (2 * 60 * 60)) * 0.35;
        col = mixc(col, gl, clamp(glow, 0, 0.85));
        const t = (HORIZON + 80 - Y) / (HORIZON + 80);
        const dn = dens(X, Y);
        let m = sstep(thr, thr + 0.17, dn) * sstep(0.1, 0.34, t);
        if (m > 0.004) {
          const L = Math.hypot(ddx, ddy) || 1, ldx = ddx / L, ldy = ddy / L;
          const z = 1 / Math.max(0.1, t), st = 14;
          const dn2 = dens(X + ldx * st, Y + ldy * st * 0.7);

    c.fillStyle = toCss(...stops[stops.length - 1]); c.fillRect(0, h2 * 2 - 1, W, H);
    // faint sky grain so it reads painted
    c.globalAlpha = 0.5;
    for (let i = 0; i < 90; i++) {
      const y = rr() * HORIZON, x = rr() * W, ww = 120 + rr() * 380;
      c.globalAlpha = 0.02 + rr() * 0.03; c.fillStyle = rr() < 0.5 ? "#ffffff" : toCss(...stops[0]);
      c.beginPath(); c.ellipse(x, y, ww / 2, 1.5 + rr() * 3, jit(0.04), 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
    if (P.rays) {
      for (let i = 0; i < 14; i++) {
        const a = i * TAU / 14 + 0.1, w = 0.035;
        c.fillStyle = "rgba(255,255,255," + (i % 2 ? 0.03 : 0.07) + ")";
        c.beginPath(); c.moveTo(sx, sy);
        c.lineTo(sx + Math.cos(a - w) * 1800, sy + Math.sin(a - w) * 1800);
        c.lineTo(sx + Math.cos(a + w) * 1800, sy + Math.sin(a + w) * 1800);
        c.closePath(); c.fill();
      }
    }
    if (P.disk) {
      let g = c.createRadialGradient(sx, sy, 0, sx, sy, 120);
      g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.18, P.sunColor); g.addColorStop(0.3, "rgba(" + P.glow + ",0.55)"); g.addColorStop(1, "rgba(" + P.glow + ",0)");
      c.fillStyle = g; c.fillRect(sx - 130, sy - 130, 260, 260);
      c.fillStyle = "#fffdf0"; c.beginPath(); c.arc(sx, sy, 30, 0, TAU); c.fill();
    }
    if (P.moon) {
      let g = c.createRadialGradient(sx, sy, 20, sx, sy, 150);
      g.addColorStop(0, "rgba(190,210,255,0.5)"); g.addColorStop(1, "rgba(190,210,255,0)");
      c.fillStyle = g; c.fillRect(sx - 160, sy - 160, 320, 320);
      const R = 40, mc = mkCanvas(R * 2 + 4, R * 2 + 4), mx = mc.getContext("2d"), mid = mx.createImageData(R * 2 + 4, R * 2 + 4);
      for (let y = 0; y < R * 2 + 4; y++) for (let x = 0; x < R * 2 + 4; x++) {
        const dx = x - R - 2, dy = y - R - 2, r = Math.hypot(dx, dy), k = (y * (R * 2 + 4) + x) * 4;
        if (r > R) { mid.data[k + 3] = 0; continue; }
        const nn = fbm(x * 0.09, y * 0.09, 4), cr = fbm(x * 0.2 + 9, y * 0.2, 3);
        const lim = 0.6 + 0.4 * Math.sqrt(1 - (r / R) * (r / R));

      }

  /* --------------------- drifting cloud sprites ---------------------- */
  function makeCloud(wid, hei) {
    const d = mkCanvas(wid, hei), c = d.getContext("2d"), id = c.createImageData(wid, hei), da = id.data;
    const ox = rr() * 60, oy = rr() * 60, cl = rgbOf(P.cloud), cs = rgbOf(P.cloudShade);
    const lx = -P.dir * 0.8, ly = -0.6;
    const dens = (x, y) => {
      const u = (x / wid - 0.5) * 2, v = (y / hei - 0.5) * 2;
      const shape = 1 - (u * u * 1.0 + (v > 0 ? v * v * 3.2 : v * v * 1.15));
      return shape * 1.25 + (fbm(x * 0.011 + ox, y * 0.017 + oy, 5) - 0.5) * 1.15;
    };
    for (let y = 0; y < hei; y++) for (let x = 0; x < wid; x++) {
      const dn = dens(x, y), m = sstep(0.2, 0.4, dn), k = (y * wid + x) * 4;
      if (m <= 0.003) { da[k + 3] = 0; continue; }
      const dn2 = dens(x + lx * 16, y + ly * 16), v = (y / hei - 0.5) * 2;
      let lit = clamp(0.64 - (dn2 - dn) * 4.8, 0.05, 1) * (1 - 0.32 * clamp(v + 0.2, 0, 1));
      lit = clamp(lit + (1 - sstep(0.2, 0.36, dn)) * 0.3, 0, 1);
      const cc = mixc(cs, cl, lit);
      da[k] = cc[0]; da[k + 1] = cc[1]; da[k + 2] = cc[2]; da[k + 3] = 255 * m;
    }
    c.putImageData(id, 0, 0);
    return d;
  }
  function updateClouds(dt) {
    clouds.forEach(cl => {
      cl.x += cl.v * dt;
      if (cl.x > W + 40) { cl.x = -cl.sp.width * cl.s - 40; cl.y = 20 + Math.random() * 150; }
    });
  }

  /* ----------------------------- mountains --------------------------- */
  function drawMountains(c) {
    const base = HORIZON + 10, hz = hazeRGB();
    const layers = [
      { col: "#8ea4bf", hMin: 40, hMax: 250, f: 0.0042, mix: 0.52, off: 3 },
      { col: "#76809a", hMin: 20, hMax: 170, f: 0.0058, mix: 0.3, off: 40 },
      { col: "#8a735f", hMin: 6, hMax: 80, f: 0.009, mix: 0.12, off: 90 }
    ];
    layers.forEach((Ly, li) => {
      const step = 2, n = Math.ceil((W + 20) / step), hs = [];
      for (let i = 0; i <= n + 1; i++) hs.push(Ly.hMin + (Ly.hMax - Ly.hMin) * Math.pow(ridged(i * step * Ly.f + Ly.off, 0.5 + Ly.off, 5), 2.1));
      const baseC = mixc(rgbOf(Ly.col), hz, Ly.mix);
      for (let i = 1; i <= n; i++) {
        const x = i * step - 10, top = base - hs[i];
        const slope = (hs[i + 1] - hs[i - 1]) * P.dir;          // >0 : face towards the sun

  /* ------------------------------------------------------------------ */

  }

  function updatePips() {

  function hintFor(midi) {
    const c = candidates().get(midi) || [];

  function spawnBird(demo) {

    const midi = pick(list);
    G.lastMidi = midi;
    const sp = spell(midi, S.acc);
    const space = Math.abs(sp.step) % 2 === 1;
    const scale = rnd(1.1, 1.18);

      tx, ty, x: tx, y: ty, sx: fromLeft ? -140 : W + 140, sy: rnd(60, 260),
      mode: demo ? "idle" : "in", t: 0, dur: 1.15, flying: demo ? space : true, phase: Math.random() * TAU,
      wrongs: 0, tone: 0, toneTarget: 0, toneAt: 0, lum: 0.5, tintFrom: 0, tintTo: 0, tintP: 1, hopT: 0, hopY: 0, shakeAmp: 0, excitedUntil: 0, steamT: 0

  function updateBird(dt) {

  /* ----------------------------- wires ------------------------------- */
  function wirePath(c, y, x1, x2, amp, t, pin) {
    c.beginPath();
    const n = Math.max(2, Math.round((x2 - x1) / 20));
    for (let i = 0; i <= n; i++) {
      const x = x1 + (x2 - x1) * i / n;
      const env = pin ? Math.sin(Math.PI * i / n) : 1;
      const yy = y + amp * env * Math.sin(x * 0.02 - t * 30);
      i ? c.lineTo(x, yy) : c.moveTo(x, yy);
    }
  }
  // The staff is black. At dusk/night a faint pale edge keeps it readable.

    c.restore();
    c.lineCap = "butt";
  }
  function drawWires(c) {

  /* ------------------------------------------------------------------ */

  function render() {
    const c = ctx, t = T / 1000;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    c.save();
    if (state.shake > 0.2) c.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    c.drawImage(skyC, 0, 0);
    if (P.stars > 0) {
      stars.forEach(s => {
        const lim = P.stars < 1 ? 330 : HORIZON;

    }
  }

  function update(dt) {
    state.wobble *= Math.exp(-dt * 2.6); if (state.wobble < 0.05) state.wobble = 0;
    state.shake *= Math.exp(-dt * 7);
    updateClouds(dt);
    updateBird(dt);
    updateParts(dt);

  }

  /* ------------------------------------------------------------------ */

  let lockMidi = null;
  const b0pc = () => -1;

  /* ----------------------------- sound ------------------------------- */
  let sfx = null;
  function sfxCtx() {
    try { if (!sfx) sfx = new (window.AudioContext || window.webkitAudioContext)(); if (sfx.state === "suspended") sfx.resume(); } catch (e) { sfx = null; }
    return sfx;
  }
  function tone(a, t0, f0, f1, dur, o) {

    os.type = o.type || "sine"; os.frequency.setValueAtTime(f0, t0); os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    if (o.vib) { const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = o.vib; lg.gain.value = f0 * 0.035; l.connect(lg); lg.connect(os.frequency); l.start(t0); l.stop(t0 + dur + 0.05); }

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = a.createBufferSource(); src.buffer = bf;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp || 1800;
    const g = a.createGain(); g.gain.value = vol || 0.3;

  const CHIRPS = {
    piu: (a, t, p) => { tone(a, t, 2900 * p, 3700 * p, 0.11, { vib: 30 }); tone(a, t + 0.19, 2700 * p, 3500 * p, 0.13, { vib: 30 }); },
    tuit: (a, t, p) => { for (let i = 0; i < 3; i++) tone(a, t + i * 0.13, 2400 * p, 3600 * p, 0.09); },
    trill: (a, t, p) => { for (let i = 0; i < 9; i++) tone(a, t + i * 0.055, (i % 2 ? 3300 : 2800) * p, (i % 2 ? 2900 : 3500) * p, 0.05, { vol: 0.1 }); },
    fiu: (a, t, p) => { tone(a, t, 2200 * p, 4200 * p, 0.16); tone(a, t + 0.2, 4000 * p, 2600 * p, 0.2, { vib: 22 }); },
    pipiu: (a, t, p) => { tone(a, t, 3300 * p, 3500 * p, 0.06); tone(a, t + 0.12, 3300 * p, 3500 * p, 0.06); tone(a, t + 0.26, 3800 * p, 2400 * p, 0.3, { vib: 26 }); },
    warble: (a, t, p) => { let tt = t; for (let i = 0; i < 8; i++) { const f = (2200 + Math.random() * 1800) * p, d = 0.07 + Math.random() * 0.07; tone(a, tt, f, f * (0.8 + Math.random() * 0.6), d, { vib: 20 + Math.random() * 20 }); tt += d * 0.9; } }
  };

  }
  function whistleSound(dur) { const a = sfxCtx(); if (!a) return; try { const t = a.currentTime + 0.02; tone(a, t, 380, 1700, dur, { type: "sawtooth", vol: 0.05, lp: 2400 }); tone(a, t, 200, 900, dur, { type: "square", vol: 0.025, lp: 1500 }); } catch (e) {} }

    const a = sfxCtx(); if (!a) return;
    try { const t = a.currentTime + 0.02; tone(a, t, 150, 38, 0.5, { vol: 0.55 }); noise(a, t, 0.7, 0.45, 900); noise(a, t, 0.25, 0.25, 6000, 1500); tone(a, t + 0.12, 90, 30, 0.6, { vol: 0.3 }); } catch (e) {}

  /* ---------------------- happy / failure animations ----------------- */
  const happyNames = ["hop", "twirl", "dance", "halo", "boing", "loop", "sing"];
  let happyBag = [];
  function nextHappy() { if (!happyBag.length) happyBag = happyNames.map((_, i) => i).sort(() => Math.random() - 0.5); return happyBag.pop(); }
  const FAIL_FX = [
    (x, y, cols) => { flash(x, y, "#ffc060"); ring(x, y, "#ff7a1a", 0, 230); ring(x, y, "#b01010", 0.08, 300);
      puffs(x, y, 12, ["#3b3b3b", "#6b6b6b", "#9a9a9a"], rnd(60, 100));
      radial(70, a => { const sp = rnd(200, 700); addP({ type: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 1.7, g: 300, life: rnd(0.7, 1.3), size: rnd(3, 6), color: pick(["#ffd23a", "#ff8a1a", "#ff4a1a"]) }); });
      feathers(x, y, 36, cols, 1.2); burstText(x, y - 40, "BOOM!"); state.shake = 18; },
    (x, y, cols) => { flash(x, y, "#ffffff"); puffs(x, y, 16, ["#f2f2f2", "#d9d9d9", "#bdbdbd"], rnd(60, 110));
      feathers(x, y, 64, cols, 0.9); stars5(x, y, 8, ["#ffd23a", "#ff8a1a"]); burstText(x, y - 40, "PUF!"); state.shake = 10; },
    (x, y, cols) => { flash(x, y, "#ffd0a0"); ring(x, y, "#ff4a1a", 0, 200);
      radial(90, a => { const sp = rnd(250, 760); addP({ type: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 1.6, g: 340, life: rnd(0.7, 1.4), size: rnd(3, 6), color: pick(["#ff5a2a", "#ffb02a", "#ffffff"]) }); });
      feathers(x, y, 44, cols, 1.4); puffs(x, y, 8, ["#4a4a4a", "#777777"], rnd(50, 90)); burstText(x, y - 40, pick(["PAM!", "BANG!", "ZAS!"])); state.shake = 14; }
  ];
  function explodeBird(b) {
    const cc = curCols(b);

  // Called each frame while the bird is celebrating.
  function happyAnim(b, dt) {
    const u = b.t, k = b.hk, bx = b.tx, by = b.ty;

    b.rot = 0; b.puff = 0; b.sing = 0;

    switch (k) {
      case 0: { // three hops, each launches a musical note
        if (u < 1.5) {
          const hp = (u % 0.5) / 0.5; oy = -Math.abs(Math.sin(hp * Math.PI)) * 46; air = oy < -4; b.sing = oy < -8 ? 1 : 0.15;
          const idx = Math.floor(u / 0.5);
          if (idx !== b.lastIdx) { b.lastIdx = idx; addP({ type: "note", x: b.x, y: b.y - 30, vx: f * rnd(40, 120), vy: -rnd(160, 240), g: -10, drag: 0.6, life: 1.4, rot: rnd(-0.3, 0.3), vr: rnd(-1, 1), size: 46, color: pick(RAINBOW), text: pick(["♪", "♫", "♬"]) }); }
        }
        break; }
      case 1: { // backflip with a sparkle trail
        const q = clamp((u - 0.2) / 0.8, 0, 1);
        if (u > 0.2 && u < 1.0) { oy = -Math.sin(q * Math.PI) * 74; air = true; b.rot = -q * TAU * f; b.sing = 1;
          em(40, () => addP({ type: "star", x: b.x, y: b.y, vx: rnd(-40, 40), vy: rnd(-30, 30), drag: 1.5, life: 0.6, rot: Math.random() * TAU, vr: rnd(-6, 6), size: rnd(7, 13), color: pick(["#fff4a0", "#ffffff", "#ffd23a"]) })); }
        else b.sing = 0.2;
        break; }
      case 2: { // happy wiggle with hearts
        b.rot = Math.sin(u * 14) * 0.2; oy = -Math.abs(Math.sin(u * 7)) * 9; b.sing = 0.5 + 0.5 * Math.sin(u * 14);
        em(9, () => addP({ type: "heart", x: b.x + rnd(-24, 24), y: b.y - 34, vx: rnd(-40, 40), vy: -rnd(90, 170), g: 0, drag: 0.4, life: 1.5, rot: Math.random() * TAU, vr: rnd(-3, 3), size: rnd(18, 30), color: pick(["#ff3b6a", "#ff7aa8", "#ff9ab8"]) }));
        break; }
      case 3: { // golden halo: lifts, swells and sends out rings
        oy = -20 * Math.sin(Math.min(1, u / 0.45) * Math.PI / 2) + Math.sin(u * 9) * 3; air = true; b.puff = 0.07 + 0.05 * Math.sin(u * 12); b.sing = 0.6;
        em(2.4, () => { ring(b.x, b.y, "#ffd23a", 0, 150); stars5(b.x, b.y, 7, ["#fff4a0", "#ffffff", "#ffd23a"]); });
        break; }
      case 4: { // two big jumps that shake the wire
        const j = u < 0.6 ? u / 0.6 : u < 1.4 ? (u - 0.6) / 0.8 : 1, big = u < 0.6 ? 56 : 92;
        if (u < 1.4) { oy = -Math.sin(j * Math.PI) * big; air = oy < -4; b.sing = 1; }
        const idx = u < 0.6 ? 0 : u < 1.4 ? 1 : 2;
        if (idx !== b.lastIdx) { b.lastIdx = idx; if (idx > 0) { state.wobble = 7; radial(34, () => addP({ type: "confetti", x: b.x, y: b.y - 20, vx: rnd(-300, 300), vy: -rnd(200, 560), g: 620, drag: 0.5, life: rnd(1.2, 1.8), rot: Math.random() * TAU, vr: rnd(-9, 9), size: rnd(6, 11), color: pick(RAINBOW) })); } }
        break; }
      case 5: { // loop-the-loop with a rainbow trail
        const q = clamp((u - 0.1) / 1.2, 0, 1);
        if (u > 0.1 && u < 1.3) { const a = q * TAU; ox = Math.sin(a) * 78 * f; oy = (Math.cos(a) - 1) * 78; air = true; b.rot = a * 0 - a * f * 0.15; b.sing = 1;
          em(60, () => addP({ type: "spark", x: b.x - f * 10, y: b.y, vx: rnd(-20, 20), vy: rnd(-10, 30), drag: 2, life: 0.8, size: 7, color: RAINBOW[Math.floor(u * 22) % 7] })); }
        break; }
      default: { // singing chest-puffed bird
        b.puff = 0.1 * Math.abs(Math.sin(u * 9)); b.sing = Math.abs(Math.sin(u * 9));
        em(6, () => addP({ type: "note", x: b.x + f * 36, y: b.y - 26, vx: f * rnd(70, 130), vy: -rnd(50, 110), g: 0, drag: 0.2, life: 1.8, rot: rnd(-0.4, 0.4), vr: rnd(-1, 1), size: rnd(34, 58), color: pick(RAINBOW), text: pick(["♪", "♫", "♬"]) }));
      }
    }
    b.x = bx + ox; b.y = by + oy; b.flying = air;
    b.hopY = 0;
  }

  function win() {
    const b = G.bird;
    G.correct++; G.total++; G.streak++; G.best = Math.max(G.best, G.streak);
    setMsg("Correcte! " + noteLabel(b.spelled), "ok");
    b.mode = "happy"; b.t = 0; b.dur = 2.0; b.happy = true; b.hk = nextHappy(); b.lastIdx = -1; b.emT = 0; b.shakeAmp = 0;
    b.tintFrom = b.tintTo = 0; b.tintP = 1;
    const p = b.pf;
    ({ 0: () => { chirp("pipiu", p, 0); chirp("piu", p, 0.5); chirp("tuit", p, 1.0); },
      1: () => { chirp("fiu", p, 0.15); chirp("piu", p, 1.1); },
      2: () => { chirp("warble", p, 0); chirp("piu", p, 1.0); },
      3: () => { chirp("trill", p, 0); chirp("piu", p, 0.8); },
      4: () => { chirp("pipiu", p, 0); chirp("tuit", p, 0.65); },
      5: () => { chirp("fiu", p, 0.1); chirp("tuit", p, 0.8); chirp("piu", p, 1.4); },
      6: () => { chirp("warble", p, 0); chirp("warble", p, 0.7); chirp("pipiu", p, 1.4); } })[b.hk]();
    G.acceptAfter = T + 1e9; updateStats(); updatePips();
  }
  function wrong(midi) {
    const b = G.bird;
    b.wrongs++; G.acceptAfter = T + 450; b.hopT = 0.5; state.wobble = Math.max(state.wobble, 6);
    if (b.wrongs === 1) {
      b.tintFrom = b.tintTo; b.tintTo = 1; b.tintP = 0;
      setMsg("Has tocat " + shortName(midi) + ". Torna-ho a provar! (2a oportunitat)", "warn");
    } else if (b.wrongs === 2) {
      b.tintFrom = b.tintTo; b.tintTo = 2; b.tintP = 0;
      setMsg("Has tocat " + shortName(midi) + ". Última oportunitat!", "bad");
    } else {
      b.tintFrom = b.tintTo; b.tintTo = 2; b.tintP = 1;
      b.mode = "swell"; b.t = 0; b.hopT = 0; G.acceptAfter = T + 1e9;
      const h = hintFor(b.midi);
      setMsg("Era " + noteLabel(b.spelled) + (h ? " — " + h : ""), "bad");
      whistleSound(0.8);
    }
    updatePips();
  }
  function evaluate(midi) {
    const b = G.bird; if (!b) return;
    const ok = S.strict ? midi === b.midi : (midi % 12 === b.midi % 12);
    lockMidi = midi;
    if (ok) win(); else wrong(midi);
  }

  /* ------------------------------------------------------------------ */
  /*  Microphone & pitch detection (NSDF / McLeod-style, bass range)    */
  /* ------------------------------------------------------------------ */
  let audioCtx = null, analyser = null, micStream = null, buf = null, dec = null, cs = null, nsdf = null;
  let noiseFloor = 0.01;
  const ABS_SIL = 0.0025, RATIO = 2.3, ADAPT = 0.08, HOLD_MS = 130;
  let candMidi = null, candSince = 0, lastValidAt = 0;

  function updateNoise(rms) { noiseFloor += (Math.max(rms, ABS_SIL) - noiseFloor) * ADAPT; }

  function detect() {
    if (!analyser) return null;
    if (!buf || buf.length !== analyser.fftSize) buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    const N = buf.length;
    let s = 0; for (let i = 0; i < N; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / N);
    if (rms < ABS_SIL || rms < noiseFloor * RATIO) { updateNoise(rms); return { rms, f: -1, loud: false }; }

    const sr = audioCtx.sampleRate;
    const D = Math.max(1, Math.round(sr / 12000)), fs = sr / D, n = Math.floor(N / D);
    if (!dec || dec.length !== n) { dec = new Float32Array(n); cs = new Float64Array(n + 1); }
    let mean = 0;
    for (let i = 0; i < n; i++) { let a = 0; for (let j = 0; j < D; j++) a += buf[i * D + j]; dec[i] = a / D; mean += dec[i]; }
    mean /= n;
    cs[0] = 0;
    for (let i = 0; i < n; i++) { dec[i] -= mean; cs[i + 1] = cs[i] + dec[i] * dec[i]; }

    const lowHz = midiHz(stringList()[0]) * 0.92;
    const maxLag = Math.min(Math.ceil(fs / lowHz), (n >> 1) - 2);
    const minLag = Math.floor(fs / 420);
    if (!nsdf || nsdf.length < maxLag + 3) nsdf = new Float32Array(maxLag + 3);
    for (let lag = 1; lag <= maxLag + 1; lag++) {
      let r = 0; const lim = n - lag;
      for (let i = 0; i < lim; i++) r += dec[i] * dec[i + lag];
      const m = cs[lim] + (cs[n] - cs[lag]);
      nsdf[lag] = m > 0 ? 2 * r / m : 0;
    }
    let pos = 1;
    while (pos <= maxLag && nsdf[pos] > 0) pos++;
    while (pos <= maxLag && nsdf[pos] <= 0) pos++;
    const peaks = []; let curL = -1, curV = -1, gmax = 0;
    for (; pos <= maxLag; pos++) {
      const v = nsdf[pos];
      if (v > 0) { if (v > curV) { curV = v; curL = pos; } }
      else if (curL > 0) { peaks.push([curL, curV]); if (curV > gmax) gmax = curV; curL = -1; curV = -1; }
    }
    if (curL > 0) { peaks.push([curL, curV]); if (curV > gmax) gmax = curV; }
    if (!peaks.length || gmax < 0.45) return { rms, f: -1, loud: true };
    const pk = peaks.find(p => p[0] >= minLag && p[1] >= 0.88 * gmax);
    if (!pk) return { rms, f: -1, loud: true };
    const lag = pk[0];
    const a = nsdf[lag - 1], b = nsdf[lag], c = nsdf[lag + 1];
    const den = a - 2 * b + c;
    const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
    const f = fs / (lag + clamp(shift, -1, 1));
    if (!Number.isFinite(f) || f < 26 || f > 450) return { rms, f: -1, loud: true };
    return { rms, f, loud: true };
  }

  function processAudio() {
    if (!analyser) return;
    const r = detect(); if (!r) return;
    meterEl.style.width = Math.min(100, Math.sqrt(r.rms) * 260) + "%";
    let midi = null;
    if (r.f > 0) {
      const mf = 69 + 12 * Math.log2(r.f / 440), m = Math.round(mf);
      if (Math.abs(mf - m) <= 0.42 && m >= stringList()[0] - 1 && m <= 76) midi = m;
    }
    if (midi !== null) {
      lastValidAt = T;
      heardEl.textContent = "Sento: " + shortName(midi) + " (" + (midi % 12 === b0pc() ? "" : "") + "oct. " + (Math.floor(midi / 12) - 1) + ") · " + r.f.toFixed(0) + " Hz";
      if (candMidi !== midi) { candMidi = midi; candSince = T; }
    } else {
      if (T - lastValidAt > 110) candMidi = null;
      if (T - lastValidAt > 240) lockMidi = null;
      if (T - lastValidAt > 400) heardEl.textContent = "Sento: —";
    }
    if (!G.running || !G.bird || G.bird.mode !== "idle" || T < G.acceptAfter) return;
    if (candMidi !== null && T - candSince >= HOLD_MS && candMidi !== lockMidi) evaluate(candMidi);
  }

  async function startMic() {
    if (window.isSecureContext === false) { setMsg("El micro necessita una pàgina segura (https). Obre el fitxer directament al navegador.", "bad"); return false; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setMsg("Micròfon no disponible en aquest navegador.", "bad"); return false; }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (error) {
      const name = error && error.name;
      if (name === "NotAllowedError" || name === "SecurityError") setMsg("Micròfon bloquejat: revisa el permís del navegador per a aquesta pàgina.", "bad");
      else if (name === "NotFoundError") setMsg("No s'ha trobat cap micròfon.", "bad");
      else setMsg("No s'ha pogut accedir al micròfon (" + (name || "error") + ").", "bad");
      return false;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = S.strings === 5 ? 8192 : 4096;
    analyser.smoothingTimeConstant = 0;
    source.connect(analyser);
    noiseFloor = 0.01; candMidi = null; lockMidi = null; buf = null; dec = null;
    return true;
  }
  function stopMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    analyser = null;
    if (audioCtx) { audioCtx.close && audioCtx.close(); audioCtx = null; }
    heardEl.textContent = "Sento: —"; meterEl.style.width = "0";
  }

  /* ------------------------------------------------------------------ */
  /*  Controls                                                          */
  /* ------------------------------------------------------------------ */
  const playBtn = el("play");

  async function startGame() {
    playBtn.disabled = true; playBtn.textContent = "Escoltant…";
    sfxCtx();
    const ok = await startMic();
    playBtn.disabled = false;
    if (!ok) { playBtn.textContent = "▶ Juga"; return; }
    G.running = true; G.bird = null; G.nextAt = T + 300; G.lastMidi = -1;
    playBtn.textContent = "■ Atura"; playBtn.classList.add("on");
    setMsg("");
  }
  function stopGame() {
    G.running = false; stopMic();
    playBtn.textContent = "▶ Juga"; playBtn.classList.remove("on");
    G.bird = null; spawnBird(true);
    setMsg("Joc aturat · Encerts " + G.correct + "/" + G.total, "");
  }
  function togglePlay() { if (playBtn.disabled) return; if (G.running) stopGame(); else startGame(); }
  playBtn.addEventListener("click", togglePlay);

  function settingsChanged() {
    saveS(); refreshControls();
    if (G.running) { G.bird = null; G.nextAt = T + 200; setMsg(""); }
    else { G.bird = null; spawnBird(true); }
  }
  function refreshControls() {
    const [f0, f1] = fretRange();
    el("posVal").textContent = S.pos === 13 ? "Tot" : S.pos + "a";
    el("posDesc").textContent = "Trastos " + f0 + "–" + f1 + (S.pos === 1 ? " · amb buides" : "");
    el("lvVal").textContent = S.level;
    el("lvDesc").textContent = levelDesc();
    el("acc").textContent = S.acc === "sharp" ? "♯ Sostinguts" : "♭ Bemolls";
    el("acc").classList.toggle("dim", S.level === 1);
    el("strings").textContent = S.strings + " cordes";
    el("oct").textContent = S.strict ? "Exacta" : "Qualsevol";
    el("octDesc").textContent = S.strict ? "Cal l'octava correcta" : "Només el nom";
    el("hint").textContent = S.hint ? "Visible" : "Amagat";
  }
  el("posUp").addEventListener("click", () => { S.pos = S.pos % 13 + 1; settingsChanged(); });
  el("posDown").addEventListener("click", () => { S.pos = S.pos === 1 ? 13 : S.pos - 1; settingsChanged(); });
  el("lvUp").addEventListener("click", () => { S.level = Math.min(5, S.level + 1); settingsChanged(); });
  el("lvDown").addEventListener("click", () => { S.level = Math.max(1, S.level - 1); settingsChanged(); });
  el("acc").addEventListener("click", () => { S.acc = S.acc === "sharp" ? "flat" : "sharp"; settingsChanged(); });
  el("strings").addEventListener("click", () => {
    S.strings = S.strings === 4 ? 5 : 4;
    if (analyser) analyser.fftSize = S.strings === 5 ? 8192 : 4096;
    settingsChanged();
  });
  el("oct").addEventListener("click", () => { S.strict = !S.strict; saveS(); refreshControls(); });
  el("hint").addEventListener("click", () => { S.hint = !S.hint; saveS(); refreshControls(); });
  el("full").addEventListener("click", () => {
    const st = el("stage");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (st.requestFullscreen) st.requestFullscreen();
  });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" && !(e.target && e.target.tagName === "BUTTON")) { e.preventDefault(); togglePlay(); }
  });
  window.addEventListener("beforeunload", () => { if (G.running) stopMic(); });

  /* ------------------------------------------------------------------ */
  /*  Start                                                             */
  /* ------------------------------------------------------------------ */
  buildScene();
  refreshControls();
  updateStats();
  spawnBird(true);
  setMsg("Prem JUGA i toca la nota de l'ocell", "");

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; T = now;
    update(dt);
    render();
    processAudio();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
