<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Rodeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Bangers&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16141f;
    --paper: #f1e6c8;
    --yellow: #f2b632;
    --red: #e2522b;
    --teal: #2aa3b5;
    --muted: #9a93ad;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #0d0c14;
    color: var(--paper);
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; display: flex; flex-direction: column; align-items: center; }

  #stage {
    position: relative;
    width: min(100%, calc((100vh - 118px) * 16 / 9));
    min-width: min(100%, 420px);
    aspect-ratio: 16 / 9;
    border: 3px solid #05040a;
    box-shadow: 0 0 0 2px var(--paper), 10px 12px 0 rgba(0,0,0,.6);
    overflow: hidden;
    background: #000;
  }
  #stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; box-shadow: none; }
  #stage:fullscreen canvas { object-fit: contain; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; pointer-events: none; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  #stats {
    top: 10px; left: 10px;
    background: var(--ink); color: var(--paper);
    border-left: 5px solid var(--yellow);
    padding: 4px 12px 4px 10px;
    font-size: clamp(.8rem, 1.5vw, 1.15rem);
    box-shadow: 3px 3px 0 rgba(0,0,0,.55);
  }
  #pips { top: 10px; right: 10px; display: flex; gap: 6px; background: var(--ink); padding: 7px 10px; box-shadow: 3px 3px 0 rgba(0,0,0,.55); }
  .pip { width: 15px; height: 15px; background: var(--yellow); border: 2px solid #05040a; transform: skewX(-14deg); }
  .pip.lost { background: #3a3646; }
  #heardBox {
    bottom: 10px; left: 10px;
    background: var(--ink); color: var(--paper);
    padding: 4px 12px; min-width: 150px;
    border-left: 5px solid var(--teal);
    font-size: clamp(.75rem, 1.3vw, 1rem);
    box-shadow: 3px 3px 0 rgba(0,0,0,.55);
  }
  #meter { margin-top: 4px; height: 4px; background: rgba(255,255,255,.18); }
  #meterFill { height: 100%; width: 0; background: var(--yellow); }
  #msg {
    bottom: 12px; left: 50%;
    transform: translateX(-50%) rotate(-.6deg);
    max-width: 60%; text-align: center;
    background: #f4d35e; color: var(--ink);
    border: 3px solid #05040a; padding: 5px 18px;
    font-size: clamp(.95rem, 2vw, 1.5rem);
    letter-spacing: .05em;
    box-shadow: 5px 5px 0 #05040a;
    transition: opacity .25s;
  }
  #msg.hidden { opacity: 0; }
  #msg.ok { background: #8fd9c0; }
  #msg.warn { background: #f2a03d; }
  #msg.bad { background: #ee6a4a; color: #fff3dc; }

  #bar {
    width: min(100%, 1700px);
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: stretch;
    margin-top: 12px;
  }
  .grp {
    display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    background: var(--ink);
    border: 2px solid rgba(241,230,200,.25);
    border-top: 3px solid var(--yellow);
    padding: 5px 10px 6px;
    min-width: 110px;
  }
  .lab { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--yellow); font-weight: 700; }
  .val { display: flex; align-items: center; gap: 8px; }
  .val b { min-width: 46px; text-align: center; font-size: 1.15rem; letter-spacing: .06em; }
  .grp em { font-style: normal; font-size: .72rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; min-height: 1em; }

  button {
    font: 700 .95rem "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
    color: var(--ink); background: var(--paper);
    border: 2px solid #05040a; border-radius: 0;
    padding: 4px 11px;
    box-shadow: 3px 3px 0 #05040a;
  }
  button:hover { background: #fff6dc; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #05040a; }
  button.dim { opacity: .4; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .val button { padding: 2px 9px; }
  #play {
    align-self: center;
    font: 400 1.7rem Anton, Impact, sans-serif; letter-spacing: .08em;
    padding: 6px 30px 4px;
    background: var(--red); color: #fff3dc;
    transform: skewX(-8deg);
    box-shadow: 4px 4px 0 #05040a;
  }
  #play:hover { background: #f0643a; }
  #play:active { transform: skewX(-8deg) translate(2px, 2px); }
  #play.on { background: #7d2616; }
  #full { align-self: center; padding: 6px 12px; font-size: 1.1rem; }

  #pips { display: none; }
  :root { --ink: #2a1d14; --paper: #ecdfba; --yellow: #d99a2b; --red: #c4452d; --teal: #1b7f8f; --muted: #b9a681; }
  body { background: #1c140e; }
  #stage { box-shadow: 0 0 0 2px #d99a2b, 10px 12px 0 rgba(0,0,0,.6); }
  .grp { border-top-color: #d99a2b; }
  button.chip.on { background: #d99a2b; }
  button { background: #ecdfba; }
  #stats { left: auto; right: 10px; }
  #stage { width: min(100%, calc((100vh - 200px) * 16 / 9)); }
  #stage:fullscreen { width: 100vw; }
  #bar { gap: 6px; margin-top: 8px; }
  .grp { padding: 3px 8px 5px; min-width: 0; }
  #heardBox, #msg, button.chip, .chips { text-transform: none; }
  #heardBox { letter-spacing: .04em; font-size: clamp(.8rem, 1.4vw, 1.1rem); }
  #msg { letter-spacing: .03em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip { padding: 3px 10px; background: #2b2838; color: var(--paper); border-color: #05040a; box-shadow: 2px 2px 0 #05040a; }
  button.chip:hover { background: #3a3650; }
  button.chip.on { background: var(--yellow); color: var(--ink); }
  #listen { align-self: center; font: 400 1.5rem Anton, Impact, sans-serif; letter-spacing: .08em; padding: 6px 22px 4px; background: var(--red); color: #fff3dc; transform: skewX(-8deg); box-shadow: 4px 4px 0 #05040a; }
  #listen:hover { background: #f0643a; }
  #listen.on { background: #7d2616; }
  .act { align-self: center; font-size: 1.05rem; padding: 7px 14px; }
  #heardBox { min-width: 220px; max-width: 70%; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1600" height="900"></canvas>
    <div id="stats" class="hud">Encerts 0</div>
    <div id="pips" class="hud"></div>
    <div id="heardBox" class="hud"><div id="heard">Sento: —</div><div id="meter"><div id="meterFill"></div></div></div>
    <div id="msg" class="hud hidden"></div>
  </div>
  <div id="bar">
    <button id="listen" type="button">🎧 Escolta</button>
    <div class="grp"><span class="lab">Tipus d'acord</span><div class="chips" id="types"></div></div>
    <div class="grp"><span class="lab" title="Cap botó premut = guitarra de 6 cordes">Guitarra 7 cordes</span><div class="chips" id="inst"></div></div>
    <div class="grp"><span class="lab">Grup de cordes</span><div class="chips" id="sets"></div></div>
    <div class="grp"><span class="lab">Inversió</span><div class="chips" id="invs"></div></div>
    <div class="grp"><span class="lab">Detecció</span><div class="chips"><button id="tol" class="chip" type="button" title="Tolerant: accepta l'acord si en sento 3 de les 4 notes">Estricte</button></div></div>
    <button id="newc" class="act" type="button" title="Espai">↻ Nou acord</button>
    <button id="hear" class="act" type="button">🔊 Sentir</button>
    <button id="full" type="button" title="Pantalla completa">⛶</button>
  </div>
</div>
<script>
(() => {
  "use strict";
  /* ------------------------------------------------------------------ */
  /*  Constants & helpers                                               */
  /* ------------------------------------------------------------------ */
  const W = 1600, H = 900, HORIZON = 640, TAU = Math.PI * 2;
  const OUT = "#16141f";          // ink
  const SHADOW = "#252a5a";       // cel-shading colour
  const STAFF = { x1: 290, x2: 1500, bottom: 570, gap: 54 };
  const lineY = k => STAFF.bottom - k * STAFF.gap;
  const stepY = s => STAFF.bottom - s * STAFF.gap / 2;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function parseColor(s) {
    if (s[0] === "#") {
      let h = s.slice(1);
      if (h.length === 3) h = h.split("").map(c => c + c).join("");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    const m = s.match(/[\d.]+/g);
    return [+m[0], +m[1], +m[2]];
  }
  function mix(a, b, t) {
    const A = parseColor(a), B = parseColor(b);
    return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")";
  }
  const shade = (c, f) => mix(c, "#0c0b18", f);
  const light = (c, f) => mix(c, "#ffffff", f);


  /* ------------------------------------------------------------------ */
  /*  Chord theory: types, string sets, voicing solver                  */
  /* ------------------------------------------------------------------ */
  // semitone offsets and degree labels (F = fonamental)
  const CHORD_TYPES = [
    { id: "maj7", btn: "Maj7", suffix: "maj7", name: "Major setena major", iv: [0, 4, 7, 11], deg: ["F", "3", "5", "7"] },
    { id: "dom7", btn: "7", suffix: "7", name: "Setena de dominant", iv: [0, 4, 7, 10], deg: ["F", "3", "5", "♭7"] },
    { id: "m7", btn: "m7", suffix: "m7", name: "Menor setena", iv: [0, 3, 7, 10], deg: ["F", "♭3", "5", "♭7"] },
    { id: "m6", btn: "m6", suffix: "m6", name: "Menor sisena", iv: [0, 3, 7, 9], deg: ["F", "♭3", "5", "6"] },
    { id: "mmaj7", btn: "m maj7", suffix: "m(maj7)", name: "Menor amb setena major", iv: [0, 3, 7, 11], deg: ["F", "♭3", "5", "7"] },
    { id: "m7b5", btn: "m7♭5", suffix: "m7♭5", name: "Semidisminuït", iv: [0, 3, 6, 10], deg: ["F", "♭3", "♭5", "♭7"] },
    { id: "dim7", btn: "dim7", suffix: "dim7", name: "Disminuït", iv: [0, 3, 6, 9], deg: ["F", "♭3", "♭5", "♭♭7"] }
  ];
  const KEYS = [["C", 0], ["D♭", 1], ["D", 2], ["E♭", 3], ["E", 4], ["F", 5], ["F♯", 6], ["G", 7], ["A♭", 8], ["A", 9], ["B♭", 10], ["B", 11]];
  const NOTE_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
  const TUNING = { 6: 40, 5: 45, 4: 50, 3: 55, 2: 59, 1: 64 };       // MIDI of the open strings
  // sets of strings, listed from the lowest (bass) string to the highest
  const STRING_SETS = [
    { id: "6543", strs: [6, 5, 4, 3], fam: "drop2" },
    { id: "6432", strs: [6, 4, 3, 2], fam: "drop3" },
    { id: "5321", strs: [5, 3, 2, 1], fam: "drop3" },
    { id: "5432", strs: [5, 4, 3, 2], fam: "drop2" },
    { id: "4321", strs: [4, 3, 2, 1], fam: "drop2" },
    { id: "6321", strs: [6, 3, 2, 1], fam: "closed" }
  ];
  // order of the chord tones (0=root,1=3rd,2=5th,3=7th) from the bass string upward, per inversion
  const FAMILY = {
    drop2: [[0, 2, 3, 1], [1, 3, 0, 2], [2, 0, 1, 3], [3, 1, 2, 0]],
    drop3: [[0, 3, 1, 2], [1, 0, 2, 3], [2, 1, 3, 0], [3, 2, 0, 1]],
    closed: [[0, 1, 2, 3], [1, 2, 3, 0], [2, 3, 0, 1], [3, 0, 1, 2]]
  };
  // 7-string guitar: every group of 4 strings that includes the 7th string (20 groups)
  const SETS7 = [];
  for (let a = 6; a >= 3; a--) for (let b = a - 1; b >= 2; b--) for (let c = b - 1; c >= 1; c--)
    SETS7.push({ id: "7" + a + b + c, strs: [7, a, b, c], fam: null });
  const VIZ7 = ["7654", "7543"];
  const INV_NAMES = ["Fonamental", "1a inversió", "2a inversió", "3a inversió"];
  const INV_SHORT = ["Fonamental", "1a inv.", "2a inv.", "3a inv."];

  // Find the playable fingering (no open strings, max span) of one inversion.
  function solveVoicing(rootPc, type, set, inv, tun) {
    tun = tun || TUNING;
    const order = FAMILY[set.fam][inv], notes = [];
    for (let i = 0; i < 4; i++) {
      const ti = order[i], pc = (rootPc + type.iv[ti]) % 12, s = set.strs[i];
      const opts = [];
      for (let f = 1; f <= 17; f++) if ((tun[s] + f) % 12 === pc) opts.push(f);
      notes.push({ s, ti, pc, opts });
    }
    let best = null;
    const rec = (i, frets, last) => {
      if (i === 4) {
        const mn = Math.min(...frets), mx = Math.max(...frets), span = mx - mn;
        const score = span * 100 + mx;
        if (span <= maxSpan && (!best || score < best.score)) best = { frets: frets.slice(), score, span };
        return;
      }
      for (const f of notes[i].opts) {
        const p = tun[notes[i].s] + f;
        if (p <= last) continue;                      // pitches must rise from bass to treble
        frets.push(f); rec(i + 1, frets, p); frets.pop();
      }
    };
    let maxSpan = 5;
    rec(0, [], -1);
    while (!best && maxSpan < 7) { maxSpan++; rec(0, [], -1); }
    if (!best) return null;
    return {
      inv, span: best.span,
      notes: notes.map((n, i) => ({ s: n.s, fret: best.frets[i], ti: n.ti, midi: tun[n.s] + best.frets[i], deg: type.deg[n.ti] }))
    };
  }
  // Free search: any distribution of the 4 chord tones over the 4 strings (the lowest sounding note
  // decides the inversion); picks the most compact (closest) hand position.
  const PERMS = (() => { const r = []; const rec = (a, u) => { if (a.length === 4) { r.push(a.slice()); return; } for (let i = 0; i < 4; i++) if (!u[i]) { u[i] = 1; a.push(i); rec(a, u); a.pop(); u[i] = 0; } }; rec([], []); return r; })();
  function solveCompact(rootPc, type, set, inv, tun) {
    tun = tun || TUNING;
    let best = null;
    PERMS.forEach(order => {
      const opts = order.map((ti, i) => { const pc = (rootPc + type.iv[ti]) % 12, s = set.strs[i], o = []; for (let f = 1; f <= 17; f++) if ((tun[s] + f) % 12 === pc) o.push(f); return o; });
      const frets = [];
      const rec = i => {
        if (i === 4) {
          const ps = frets.map((f, k) => tun[set.strs[k]] + f), lo = Math.min(...ps);
          if (order[ps.indexOf(lo)] !== inv) return;
          if (new Set(ps).size < 4) return;
          const mn = Math.min(...frets), mx = Math.max(...frets), span = mx - mn, range = Math.max(...ps) - lo;
          let rise = 0; for (let k = 1; k < 4; k++) if (ps[k] <= ps[k - 1]) rise++;
          const score = span * 100 + rise * 45 + Math.max(0, range - 16) * 6 + mx;
          if (!best || score < best.score) best = { frets: frets.slice(), order: order.slice(), score, span };
          return;
        }
        for (const f of opts[i]) { frets.push(f); rec(i + 1); frets.pop(); }
      };
      rec(0);
    });
    if (!best) return null;
    return {
      inv, span: best.span, score: best.score, hard: best.span > 4,
      notes: best.order.map((ti, i) => ({ s: set.strs[i], fret: best.frets[i], ti, midi: tun[set.strs[i]] + best.frets[i], deg: type.deg[ti] }))
    };
  }
  function buildChord(rootPc, rootName, type, set, tun) {
    const voicings = [];
    for (let inv = 0; inv < 4; inv++) {
      const o = set.fam ? solveVoicing(rootPc, type, set, inv, tun) : null, c = solveCompact(rootPc, type, set, inv, tun);
      let v = c;
      if (o && (!c || o.span <= c.span) ) { o.hard = o.span > 4; v = o; }
      if (v) voicings.push(v);
    }
    const pcs = type.iv.map(i => (rootPc + i) % 12);
    return { rootPc, rootName, type, set, voicings, pcs, name: rootName + type.suffix };
  }

  /* ------------------------------------------------------------------ */
  /*  Particles & explosions                                            */
  /* ------------------------------------------------------------------ */
  const parts = [];
  const state = { shake: 0, wobble: 0 };
  function addP(o) {
    const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: 1, rot: 0, vr: 0, size: 10, color: "#fff", type: "spark", delay: 0, text: "" }, o);
    p.max = p.life; parts.push(p);
  }
  function starPath(c, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  }
  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      const k = Math.max(0, 1 - p.drag * dt);
      p.vx *= k; p.vy *= k; p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  }
  function drawParts(c) {
    parts.forEach(p => {
      if (p.delay > 0) return;
      const u = p.life / p.max, age = 1 - u;
      c.save(); c.translate(p.x, p.y);
      c.lineJoin = "round"; c.lineCap = "round"; c.strokeStyle = OUT;
      switch (p.type) {
        case "feather":
          c.rotate(p.rot); c.globalAlpha = Math.min(1, u * 2.2);
          c.beginPath(); c.ellipse(0, 0, p.size, p.size * 0.3, 0, 0, TAU); c.fillStyle = p.color; c.fill(); c.lineWidth = 2; c.stroke();
          c.beginPath(); c.moveTo(-p.size, 0); c.lineTo(p.size * 0.8, 0); c.lineWidth = 1.4; c.stroke();
          break;
        case "spark":
          c.globalAlpha = Math.min(1, u * 2);
          c.strokeStyle = p.color; c.lineWidth = p.size * (0.5 + u * 0.6);
          c.beginPath(); c.moveTo(0, 0); c.lineTo(-p.vx * 0.045, -p.vy * 0.045); c.stroke();
          break;
        case "star":
          c.rotate(p.rot); c.globalAlpha = Math.min(1, u * 2.5);
          c.scale(0.5 + u * 0.6, 0.5 + u * 0.6); starPath(c, p.size);
          c.fillStyle = p.color; c.fill(); c.lineWidth = 3; c.stroke();
          break;
        case "heart": {
          const s = p.size * (0.7 + 0.3 * u); c.globalAlpha = Math.min(1, u * 2.5); c.rotate(Math.sin(p.rot) * 0.3);
          c.beginPath(); c.moveTo(0, s * 0.3);
          c.bezierCurveTo(-s, -s * 0.4, -s * 0.5, -s * 1.1, 0, -s * 0.5);
          c.bezierCurveTo(s * 0.5, -s * 1.1, s, -s * 0.4, 0, s * 0.3);
          c.fillStyle = p.color; c.fill(); c.lineWidth = 3; c.stroke();
          break;
        }
        case "note":
          c.rotate(Math.sin(p.rot) * 0.4); c.globalAlpha = Math.min(1, u * 2.5);
          c.font = "bold " + p.size + "px Georgia, serif"; c.textAlign = "center"; c.textBaseline = "middle";
          c.lineWidth = 5; c.strokeText(p.text, 0, 0); c.fillStyle = p.color; c.fillText(p.text, 0, 0);
          break;
        case "coin":
          c.globalAlpha = Math.min(1, u * 2.5); c.scale(Math.max(0.12, Math.abs(Math.cos(p.rot))), 1);
          c.beginPath(); c.arc(0, 0, p.size, 0, TAU); c.fillStyle = "#ffcf3a"; c.fill(); c.lineWidth = 3; c.stroke();
          c.beginPath(); c.arc(0, 0, p.size * 0.62, 0, TAU); c.strokeStyle = "#c8861a"; c.lineWidth = 2.5; c.stroke();
          break;
        case "confetti":
          c.rotate(p.rot); c.globalAlpha = Math.min(1, u * 2.5); c.scale(1, Math.cos(p.rot * 2.3));

  G.total = 0; updateStats();
  setMsg("Prem 🎧 ESCOLTA i toca l'acord que veus", "");

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; T = now;
    update(dt);
    render();
    processAudio();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
